# Allowed Model spec.family values. A family is the base model lineage a model ships
# under, with no version, size or product line in it; a fine-tune takes its base
# model's family. validate fails on any other value.
#
# aliases map an importer's family names (models.dev's) onto a family; a name that
# starts with "<family>-", "<family>." or "<family><digit>" maps without an alias.
#
# lines lists the allowed spec.productLine values for a family: the vendor's named
# tier or variant inside it, never a version or size. A model's productLine is empty
# or one of its family's line names; a family without lines accepts only empty.
# Line aliases are importer-only, mapping a models.dev family remainder onto a line,
# and are never valid productLine values.

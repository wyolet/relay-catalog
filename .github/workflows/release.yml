name: Release

# build -> publish -> index: index.yaml never names a tag before its assets are published.
# Consumers pin the published sha256s, so a published asset is never replaced: a re-run with identical bytes is a no-op, different bytes fail the run.

on:
  push:
    tags: ["v*"]
  # Auto release calls this after pushing a tag: a tag pushed with GITHUB_TOKEN starts no workflow of its own.
  workflow_call:
    inputs:
      tag:
        description: An existing tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Read-only token; only the built files cross into the job that can write the release.
  build:
    runs-on: ubuntu-latest
    steps:
      # The default depth-1 fetch holds the tagged commit, all the build reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Load the catalog tools image
        run: grep '^CATALOG_TOOLS_IMAGE=' .github/catalog-tools.env >> "$GITHUB_ENV"

      # All rebuild byte-identically from the tag: generatedAt is the tagged commit's time, and the tarballs come from git archive.
      - name: Build the data tarball and catalog.json.gz
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$CATALOG_TOOLS_IMAGE" \
            catalog-server build --repo . --ref "$(git rev-parse HEAD)" --version "$TAG" --out out

      # Built with git alone, so it doesn't wait for a relay release; a builder that also writes it must agree byte for byte.
      - name: Build the mcp tarball
        run: |
          set -euo pipefail
          name="mcp-catalog-data-${TAG}.tar.gz"
          if [ -z "$(git ls-tree -d --name-only HEAD -- mcp)" ]; then
            [ ! -f "out/$name" ] || { echo "::error::the builder wrote $name for a tree without mcp/"; exit 1; }
            exit 0
          fi
          pip install --quiet pyyaml
          python3 .github/scripts/validate_mcp.py mcp
          .github/scripts/build_mcp.sh "$(git rev-parse HEAD)" "$TAG" mcp-out
          if [ -f "out/$name" ]; then
            cmp -s "out/$name" "mcp-out/$name" \
              || { echo "::error::catalog-server and git archive built different $name; the catalog server would never match the published sum"; exit 1; }
          fi
          if [ -f "mcp-out/$name" ]; then
            cp "mcp-out/$name" "mcp-out/$name.sha256" out/
          elif [ -f "out/$name" ]; then
            echo "::error::the builder wrote $name, git archive found no live documents"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: List the release files
        id: files
        run: |
          set -euo pipefail
          files="catalog.json.gz relay-catalog-data-${TAG}.tar.gz"
          if [ -f "mcp-catalog-data-${TAG}.tar.gz" ]; then
            files="$files mcp-catalog-data-${TAG}.tar.gz"
          fi
          echo "names=$files" >> "$GITHUB_OUTPUT"
          { echo 'paths<<EOF'; tr ' ' '\n' <<<"$files"; echo EOF; } >> "$GITHUB_OUTPUT"

      # Consumers verify with: gh attestation verify <file> --repo wyolet/relay-catalog
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.paths }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILES: ${{ steps.files.outputs.names }}
        run: |
          set -euo pipefail
          tag="$TAG"
          # Create only when missing, so notes on an existing release stay untouched.
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --notes ""
          assets=$(gh release view "$tag" --json assets -q '.assets[].name')
          mkdir published
          upload_once() {
            local file=$1
            if printf '%s\n' "$assets" | grep -qxF "$file"; then
              gh release download "$tag" --pattern "$file" --dir published
              cmp -s "$file" "published/$file" \
                || { echo "::error::$file is already published with different bytes; it is never replaced"; exit 1; }
              echo "$file is already published with identical bytes"
            else
              gh release upload "$tag" "$file"
            fi
          }
          for file in $FILES; do
            upload_once "$file"
            upload_once "$file.sha256"
          done

  # Points the tagged schema channel's `latest` at this tag in index.yaml on main; relays on RELAY_CATALOG_VERSION=latest resolve through it. An older tag never downgrades the channel.
  index:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialises pushes to main across tag runs.
    concurrency:
      group: release-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history so the tagged commit is reachable for `git show`.
          fetch-depth: 0

      - name: Update index.yaml
        run: |
          set -eu
          # The channel is the tagged tree's schema version, read from the
          # tag's own data files (not main's, which may already be ahead).
          channel=$(git show "${TAG}:data/providers/anthropic/provider.yaml" \
            | sed -n 's|^apiVersion:.*/||p' | head -1)
          pip install --quiet pyyaml
          python3 .github/scripts/update_index.py "$channel" "${TAG}"

      - name: Commit
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git diff --cached --quiet && exit 0
          git commit -m "index: channel latest -> ${TAG}"
          # Data merges now release within minutes, so main may have moved since checkout.
          git pull --rebase origin main
          git push origin main

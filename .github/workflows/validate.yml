name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The validator imports tagged github.com/wyolet/relay (app/catalogvalidate
      # + app/manifest/model/meta/pricing), resolved from the module proxy — no
      # side-by-side checkout or replace directive needed.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests (rules)
        run: go test ./...

      - name: Validate catalog data
        run: go run ./cmd/validate ./data

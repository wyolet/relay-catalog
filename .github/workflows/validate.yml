name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The validator imports tagged github.com/wyolet/relay (app/catalogvalidate
      # + app/manifest/model/meta/pricing), resolved from the module proxy — no
      # side-by-side checkout or replace directive needed.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests (rules)
        run: go test ./...

      - name: Validate catalog data
        run: go run ./cmd/validate ./data

      # Old tags have no .gitattributes, so release tooling keeps the pathspec; the two must agree.
      - name: Release archive matches the data pathspec
        run: |
          set -euo pipefail
          archive=$(git archive --format=tar HEAD | sha256sum)
          pathspec=$(git archive --format=tar HEAD -- data ':(exclude)data/drafts' | sha256sum)
          [ "$archive" = "$pathspec" ] \
            || { echo "::error::git archive HEAD differs from data/ minus data/drafts; .gitattributes must keep release archives to that tree"; exit 1; }

name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The validator imports github.com/wyolet/relay/app/catalogvalidate
      # (+ app/manifest, app/model, app/meta). relay is a multi-module repo
      # (root module + sdk submodule wired by go.work), so the catalog
      # go.mod replaces BOTH github.com/wyolet/relay => ../relay and
      # github.com/wyolet/relay/sdk => ../relay/sdk — hence the side-by-side
      # checkout. relay is public now, so the checkout uses the default
      # GITHUB_TOKEN; no PAT secret needed.
      - name: Check out relay-catalog
        uses: actions/checkout@v4
        with:
          path: relay-catalog

      - name: Check out relay (side-by-side for the replace directives)
        uses: actions/checkout@v4
        with:
          repository: wyolet/relay
          path: relay

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay-catalog/go.mod

      - name: Unit tests (rules)
        working-directory: relay-catalog
        run: go test ./...

      - name: Validate catalog data
        working-directory: relay-catalog
        run: go run ./cmd/validate ./data

name: Release asset

# Attaches the flattened SDK catalog and the live data tree to the tag's release. Both rebuild byte-identically from the tag: generatedAt is the tagged commit's time, and the data tarball comes from git archive (scripts/data-tarball.sh).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build catalog.json.gz
        run: |
          set -eu
          go run ./cmd/embed -o catalog.json.gz -generated-at "$(git show -s --format=%cI HEAD)" -version "$GITHUB_REF_NAME" ./data
          sha256sum catalog.json.gz > catalog.json.gz.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Create only when missing, so notes on an existing release stay untouched.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --notes ""
          gh release upload "$GITHUB_REF_NAME" catalog.json.gz catalog.json.gz.sha256 --clobber

  # The data tree relay's image seeds from. Built with a read-only token; only the tarball crosses into the job that can write the release.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the data tarball
        run: scripts/data-tarball.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          path: out/
          retention-days: 1

  data-publish:
    # After asset, which creates the release when it is missing.
    needs: [asset, data]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data

      # Consumers verify with: gh attestation verify relay-catalog-data-<tag>.tar.gz --repo wyolet/relay-catalog
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: relay-catalog-data-${{ github.ref_name }}.tar.gz

      # Relay pins this tarball's sha256, so once published its bytes never change. A re-run with identical bytes succeeds without uploading; different bytes fail the run.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tarball="relay-catalog-data-${GITHUB_REF_NAME}.tar.gz"
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          if printf '%s\n' "$assets" | grep -qxF "$tarball"; then
            mkdir published
            gh release download "$GITHUB_REF_NAME" --pattern "$tarball" --dir published
            cmp -s "$tarball" "published/$tarball" \
              || { echo "::error::$tarball is already published with different bytes; it is never replaced"; exit 1; }
            echo "$tarball is already published with identical bytes"
          else
            gh release upload "$GITHUB_REF_NAME" "$tarball"
          fi
          printf '%s\n' "$assets" | grep -qxF "$tarball.sha256" || gh release upload "$GITHUB_REF_NAME" "$tarball.sha256"

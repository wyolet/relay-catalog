apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: paddle-sandbox
  title: Paddle (sandbox)
  description: Paddle Billing in its sandbox, covering products, prices, customers, subscriptions, transactions and simulated webhooks.
  publisher: Paddle
  homepage: https://developer.paddle.com/
  iconURL: https://assets.paddle.com/assets/logo/paddle-logo-square-black-on-yellow.png
  categories:
    - payments
    - billing
spec:
  slots:
    - name: apiKey
      title: Sandbox API key
      description: A Paddle sandbox API key; it starts with pdl_sdbx_.
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://sandbox-mcp.paddle.com/mcp

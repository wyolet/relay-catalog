apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: neon
  title: Neon
  description: Manages Neon projects, branches and Postgres databases and runs SQL against them.
  publisher: Neon
  homepage: https://neon.com/docs/ai/neon-mcp-server
  iconURL: https://neon.com/brand/neon-logomark-light-color.svg
  categories:
    - databases
    - postgres
spec:
  slots:
    - name: apiKey
      title: API key
      description: A Neon API key.
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
    - name: readOnly
      title: Read-only
      description: Set to true to expose only read-only tools.
      example: "true"
      type: config
      target:
        header: x-read-only
  runtime:
    kind: remote
    url: https://mcp.neon.tech/mcp

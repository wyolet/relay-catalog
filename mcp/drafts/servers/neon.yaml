apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: neon
spec:
  title: Neon
  description: Manages Neon projects, branches and Postgres databases and runs SQL against them. The credential is an APIKey whose key is a Neon API key; set readOnly to true to expose only read-only tools.
  publisher: Neon
  homepage: https://neon.com/docs/ai/neon-mcp-server
  iconURL: https://neon.com/brand/neon-logomark-light-color.svg
  categories:
    - databases
    - postgres
  slots:
    - name: apiKey
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
    - name: readOnly
      type: config
      target:
        header: x-read-only
  runtime:
    kind: remote
    url: https://mcp.neon.tech/mcp

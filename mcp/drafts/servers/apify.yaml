apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: apify
  title: Apify
  description: Runs Apify Store scrapers, crawlers and automations and returns their data.
  publisher: Apify
  homepage: https://docs.apify.com/platform/integrations/mcp
  iconURL: https://mcp.apify.com/images/apify-icon.png
  categories:
    - web-scraping
    - automation
spec:
  slots:
    - name: apiKey
      title: API token
      description: An Apify API token.
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://mcp.apify.com/

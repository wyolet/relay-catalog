apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: apify
spec:
  title: Apify
  description: Runs Apify Store scrapers, crawlers and automations and returns their data. The credential is an APIKey whose key is an Apify API token.
  publisher: Apify
  homepage: https://docs.apify.com/platform/integrations/mcp
  iconURL: https://mcp.apify.com/images/apify-icon.png
  categories:
    - web-scraping
    - automation
  slots:
    - name: apiKey
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://mcp.apify.com/

apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: github
  title: GitHub
  description: Repositories, issues, pull requests, code search and Actions on github.com, through GitHub's hosted MCP server.
  publisher: GitHub
  homepage: https://github.com/github/github-mcp-server
  iconURL: https://github.githubassets.com/favicons/favicon.svg
  categories:
    - developer-tools
    - source-control
spec:
  slots:
    - name: token
      title: Personal access token
      description: A GitHub personal access token; its scopes decide what the tools may do.
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://api.githubcopilot.com/mcp/

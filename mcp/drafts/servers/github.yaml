apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: github
spec:
  title: GitHub
  description: Repositories, issues, pull requests, code search and Actions on github.com, through GitHub's hosted MCP server. The credential is an APIKey whose key is a GitHub personal access token; the token's scopes decide what the tools may do.
  publisher: GitHub
  homepage: https://github.com/github/github-mcp-server
  iconURL: https://github.githubassets.com/favicons/favicon.svg
  categories:
    - developer-tools
    - source-control
  slots:
    - name: token
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://api.githubcopilot.com/mcp/

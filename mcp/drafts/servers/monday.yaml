apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: monday
  title: monday.com
  description: Boards, items, updates and users of a monday.com account.
  publisher: monday.com
  homepage: https://github.com/mondaycom/mcp
  categories:
    - project-management
spec:
  slots:
    - name: apiKey
      title: API token
      description: A monday.com API token.
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://mcp.monday.com/mcp

apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: postman
spec:
  title: Postman
  description: Workspaces, collections, environments, specs and monitors of a Postman account. The credential is an APIKey whose key is a Postman API key; EU accounts use https://mcp.eu.postman.com/mcp.
  publisher: Postman
  homepage: https://www.postman.com/product/mcp-server/
  iconURL: https://raw.githubusercontent.com/postmanlabs/postman-mcp-server/main/icon.png
  categories:
    - api
    - developer-tools
  slots:
    - name: apiKey
      type: secret
      target:
        header: Authorization
        format: Bearer {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: https://mcp.postman.com/mcp

apiVersion: wymcp.wyolet.dev/v1alpha1
kind: MCPTemplate
metadata:
  name: victoriametrics
spec:
  title: VictoriaMetrics
  description: |-
    Queries, metrics, labels, alerting rules and documentation of a VictoriaMetrics instance, through a VictoriaMetrics MCP server you run in streamable HTTP mode behind HTTP Basic auth.
    The credential is an APIKey: url is the server's MCP endpoint (for example https://vm-mcp.example.com/mcp), key is the base64 of user:password.
  publisher: VictoriaMetrics
  homepage: https://github.com/VictoriaMetrics/mcp-victoriametrics
  iconURL: https://victoriametrics.com/icons/favicon.ico
  categories:
    - observability
    - metrics
  slots:
    - name: url
      type: config
      target:
        urlVar: url
      credentialField: APIKey.url
      required: true
    - name: auth
      type: secret
      target:
        header: Authorization
        format: Basic {value}
      credentialField: APIKey.key
      required: true
  runtime:
    kind: remote
    url: "{url}"

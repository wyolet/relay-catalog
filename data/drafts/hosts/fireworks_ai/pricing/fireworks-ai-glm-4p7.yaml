# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: fireworks_ai-fireworks-ai-glm-4p7
    owner:
        kind: host
        id: fireworks_ai
spec:
    currency: USD
    targetModels:
        - fireworks-ai-glm-4p7
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3

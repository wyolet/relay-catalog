apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: submodel-deepseek-ai-deepseek-r1
    displayName: deepseek-ai-deepseek-r1 pricing
    owner:
        kind: host
        id: submodel
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 2.15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-openai-gpt-5-5-instant
    displayName: openai-gpt-5-5-instant pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-5-instant
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

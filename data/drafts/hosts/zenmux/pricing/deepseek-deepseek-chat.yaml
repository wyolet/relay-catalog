apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-deepseek-deepseek-chat
    displayName: deepseek-deepseek-chat pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-chat
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.28
        - meter: tokens.output
          unit: per_million
          amount: 0.42
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-google-gemini-2-5-flash
    displayName: google-gemini-2-5-flash pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-flash
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.07
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

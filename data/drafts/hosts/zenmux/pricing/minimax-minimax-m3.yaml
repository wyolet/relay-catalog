apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-minimax-minimax-m3
    displayName: minimax-minimax-m3 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-z-ai-glm-4-5-air
    displayName: z-ai-glm-4-5-air pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - z-ai-glm-4-5-air
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.11
        - meter: tokens.output
          unit: per_million
          amount: 0.56
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-openai-gpt-5-4
    displayName: openai-gpt-5-4 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.75
        - meter: tokens.output
          unit: per_million
          amount: 18.75
    enabled: true

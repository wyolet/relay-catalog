apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-tencent-hy3-preview
    displayName: tencent-hy3-preview pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - tencent-hy3-preview
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.058
        - meter: tokens.input
          unit: per_million
          amount: 0.172
        - meter: tokens.output
          unit: per_million
          amount: 0.572
    enabled: true

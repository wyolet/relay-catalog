apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-deepseek-deepseek-v3-2-exp
    displayName: deepseek-deepseek-v3-2-exp pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-2-exp
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.22
        - meter: tokens.output
          unit: per_million
          amount: 0.33
    enabled: true

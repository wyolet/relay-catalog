apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-x-ai-grok-4
    displayName: x-ai-grok-4 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - x-ai-grok-4
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.75
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

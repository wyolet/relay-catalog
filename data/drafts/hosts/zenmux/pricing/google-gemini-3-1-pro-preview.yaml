apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-google-gemini-3-1-pro-preview
    displayName: google-gemini-3-1-pro-preview pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - google-gemini-3-1-pro-preview
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 4.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 12
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-openai-gpt-5-2-codex
    displayName: openai-gpt-5-2-codex pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-2-codex
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.17
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-openai-gpt-5-4-pro
    displayName: openai-gpt-5-4-pro pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 45
        - meter: tokens.output
          unit: per_million
          amount: 225
    enabled: true

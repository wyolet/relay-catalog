apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-x-ai-grok-code-fast-1
    displayName: x-ai-grok-code-fast-1 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - x-ai-grok-code-fast-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-deepseek-deepseek-v3-2
    displayName: deepseek-deepseek-v3-2 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.28
        - meter: tokens.output
          unit: per_million
          amount: 0.43
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-x-ai-grok-4-1-fast-non-reasoning
    displayName: x-ai-grok-4-1-fast-non-reasoning pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - x-ai-grok-4-1-fast-non-reasoning
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

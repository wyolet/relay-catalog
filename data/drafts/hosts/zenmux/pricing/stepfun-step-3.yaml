apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-stepfun-step-3
    displayName: stepfun-step-3 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - stepfun-step-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 0.57
    enabled: true

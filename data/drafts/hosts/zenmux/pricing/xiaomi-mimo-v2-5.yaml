apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zenmux-xiaomi-mimo-v2-5
    displayName: xiaomi-mimo-v2-5 pricing
    owner:
        kind: host
        id: zenmux
spec:
    currency: USD
    targetModels:
        - xiaomi-mimo-v2-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.08
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.16
          aboveTokens: 256000
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.input
          unit: per_million
          amount: 0.8
          aboveTokens: 256000
        - meter: tokens.output
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 4
          aboveTokens: 256000
    enabled: true

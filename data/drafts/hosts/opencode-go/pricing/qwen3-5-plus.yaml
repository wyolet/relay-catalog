apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-go-qwen3-5-plus
    displayName: qwen3-5-plus pricing
    owner:
        kind: host
        id: opencode-go
spec:
    currency: USD
    targetModels:
        - qwen3-5-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

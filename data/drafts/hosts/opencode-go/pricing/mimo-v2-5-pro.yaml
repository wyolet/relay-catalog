apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-go-mimo-v2-5-pro
    displayName: mimo-v2-5-pro pricing
    owner:
        kind: host
        id: opencode-go
spec:
    currency: USD
    targetModels:
        - mimo-v2-5-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0145
        - meter: tokens.input
          unit: per_million
          amount: 1.74
        - meter: tokens.output
          unit: per_million
          amount: 3.48
    enabled: true

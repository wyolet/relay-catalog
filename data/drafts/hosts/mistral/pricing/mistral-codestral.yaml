apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-mistral-codestral
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - mistral-codestral
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3

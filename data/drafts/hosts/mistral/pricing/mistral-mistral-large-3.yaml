# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: mistral-mistral-mistral-large-3
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - mistral-mistral-large-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 1.5

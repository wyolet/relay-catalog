apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-mistral-embed
    displayName: mistral-embed pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - mistral-embed
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

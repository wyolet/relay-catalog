apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-open-mistral-7b
    displayName: open-mistral-7b pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - open-mistral-7b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.25
    enabled: true

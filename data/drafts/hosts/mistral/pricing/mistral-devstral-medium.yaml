# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-mistral-devstral-medium
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - mistral-devstral-medium
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.output
          unit: per_million
          amount: 2

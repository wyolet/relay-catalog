apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-pixtral-12b
    displayName: pixtral-12b pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - pixtral-12b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

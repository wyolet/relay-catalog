apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-magistral-medium
    displayName: magistral-medium pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - magistral-medium
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 5
    enabled: true

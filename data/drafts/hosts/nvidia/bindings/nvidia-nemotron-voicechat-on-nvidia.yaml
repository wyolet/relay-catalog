apiVersion: relay.wyolet.dev/v1alpha2
kind: HostBinding
metadata:
    name: nvidia-nemotron-voicechat-on-nvidia
    displayName: nvidia-nemotron-voicechat via nvidia
spec:
    model: nvidia-nemotron-voicechat
    host: nvidia
    adapter: openai
    enabled: true
    snapshots:
        - nvidia-nemotron-voicechat

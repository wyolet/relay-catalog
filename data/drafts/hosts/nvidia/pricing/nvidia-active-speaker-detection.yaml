apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nvidia-nvidia-active-speaker-detection
    displayName: nvidia-active-speaker-detection pricing
    owner:
        kind: host
        id: nvidia
spec:
    currency: USD
    targetModels:
        - nvidia-active-speaker-detection
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nvidia-meta-esmfold
    displayName: meta-esmfold pricing
    owner:
        kind: host
        id: nvidia
spec:
    currency: USD
    targetModels:
        - meta-esmfold
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

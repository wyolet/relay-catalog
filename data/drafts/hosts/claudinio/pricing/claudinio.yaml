apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: claudinio-claudinio
    displayName: claudinio pricing
    owner:
        kind: host
        id: claudinio
spec:
    currency: USD
    targetModels:
        - claudinio
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anyscale-anyscale-google-gemma-7b-it
    owner:
        kind: host
        id: anyscale
spec:
    currency: USD
    targetModels:
        - anyscale-google-gemma-7b-it
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.15

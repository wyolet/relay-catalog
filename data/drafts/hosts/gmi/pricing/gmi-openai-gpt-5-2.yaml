# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gmi-gmi-openai-gpt-5-2
    owner:
        kind: host
        id: gmi
spec:
    currency: USD
    targetModels:
        - gmi-openai-gpt-5-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14

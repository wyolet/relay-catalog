# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gmi-gmi-google-gemini-3-flash
    owner:
        kind: host
        id: gmi
spec:
    currency: USD
    targetModels:
        - gmi-google-gemini-3-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 3

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: minimax-minimax-minimax-m2-5-lightning
    owner:
        kind: host
        id: minimax
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-5-lightning
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.4
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

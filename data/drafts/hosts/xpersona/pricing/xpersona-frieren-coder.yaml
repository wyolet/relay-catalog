apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xpersona-xpersona-frieren-coder
    displayName: xpersona-frieren-coder pricing
    owner:
        kind: host
        id: xpersona
spec:
    currency: USD
    targetModels:
        - xpersona-frieren-coder
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 1.5
        - meter: tokens.output
          unit: per_million
          amount: 6
        - meter: tokens.reasoning
          unit: per_million
          amount: 6
    enabled: true

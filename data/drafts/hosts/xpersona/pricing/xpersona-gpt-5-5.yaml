apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xpersona-xpersona-gpt-5-5
    displayName: xpersona-gpt-5-5 pricing
    owner:
        kind: host
        id: xpersona
spec:
    currency: USD
    targetModels:
        - xpersona-gpt-5-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 18
        - meter: tokens.reasoning
          unit: per_million
          amount: 18
    enabled: true

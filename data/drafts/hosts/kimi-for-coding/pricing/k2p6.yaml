apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kimi-for-coding-k2p6
    displayName: k2p6 pricing
    owner:
        kind: host
        id: kimi-for-coding
spec:
    currency: USD
    targetModels:
        - k2p6
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

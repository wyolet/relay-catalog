apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xiaomi-mimo-v2-5-pro-ultraspeed
    displayName: mimo-v2-5-pro-ultraspeed pricing
    owner:
        kind: host
        id: xiaomi
spec:
    currency: USD
    targetModels:
        - mimo-v2-5-pro-ultraspeed
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0108
        - meter: tokens.input
          unit: per_million
          amount: 1.305
        - meter: tokens.output
          unit: per_million
          amount: 2.61
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: sambanova-sambanova-minimax-m2-7
    owner:
        kind: host
        id: sambanova
spec:
    currency: USD
    targetModels:
        - sambanova-minimax-m2-7
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2

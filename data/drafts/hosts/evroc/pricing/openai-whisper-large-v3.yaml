apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: evroc-openai-whisper-large-v3
    displayName: openai-whisper-large-v3 pricing
    owner:
        kind: host
        id: evroc
spec:
    currency: USD
    targetModels:
        - openai-whisper-large-v3
    rates:
        - meter: tokens.audio_output
          unit: per_million
          amount: 2.36
        - meter: tokens.input
          unit: per_million
          amount: 0.00236
        - meter: tokens.output
          unit: per_million
          amount: 0.00236
    enabled: true

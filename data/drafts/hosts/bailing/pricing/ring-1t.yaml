apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bailing-ring-1t
    displayName: ring-1t pricing
    owner:
        kind: host
        id: bailing
spec:
    currency: USD
    targetModels:
        - ring-1t
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.57
        - meter: tokens.output
          unit: per_million
          amount: 2.29
    enabled: true

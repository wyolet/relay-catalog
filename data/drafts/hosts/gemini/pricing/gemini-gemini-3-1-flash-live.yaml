apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gemini-gemini-gemini-3-1-flash-live
    owner:
        kind: host
        id: gemini
spec:
    currency: USD
    targetModels:
        - gemini-gemini-3-1-flash-live
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 4.5

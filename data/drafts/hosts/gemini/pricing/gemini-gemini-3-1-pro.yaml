# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gemini-gemini-gemini-3-1-pro
    owner:
        kind: host
        id: gemini
spec:
    currency: USD
    targetModels:
        - gemini-gemini-3-1-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 12
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.19999999999999998
        - meter: tokens.input
          unit: per_million
          amount: 4
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 18
          aboveTokens: 200000

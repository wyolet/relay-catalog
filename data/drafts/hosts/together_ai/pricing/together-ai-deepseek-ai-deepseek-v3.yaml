# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: together_ai-together-ai-deepseek-ai-deepseek-v3
    owner:
        kind: host
        id: together_ai
spec:
    currency: USD
    targetModels:
        - together-ai-deepseek-ai-deepseek-v3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 1.25

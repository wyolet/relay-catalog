apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: chutes-deepseek-ai-deepseek-v3-1-tee
    displayName: deepseek-ai-deepseek-v3-1-tee pricing
    owner:
        kind: host
        id: chutes
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-v3-1-tee
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.135
        - meter: tokens.input
          unit: per_million
          amount: 0.27
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

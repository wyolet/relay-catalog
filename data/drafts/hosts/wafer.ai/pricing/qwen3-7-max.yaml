apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: wafer.ai-qwen3-7-max
    displayName: qwen3-7-max pricing
    owner:
        kind: host
        id: wafer.ai
spec:
    currency: USD
    targetModels:
        - qwen3-7-max
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

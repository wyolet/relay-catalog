# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xai-xai-grok-code-fast-1
    owner:
        kind: host
        id: xai
spec:
    currency: USD
    targetModels:
        - xai-grok-code-fast-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.19999999999999998
        - meter: tokens.output
          unit: per_million
          amount: 1.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02

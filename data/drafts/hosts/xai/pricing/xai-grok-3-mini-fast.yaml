apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xai-xai-grok-3-mini-fast
    owner:
        kind: host
        id: xai
spec:
    currency: USD
    targetModels:
        - xai-grok-3-mini-fast
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 4
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

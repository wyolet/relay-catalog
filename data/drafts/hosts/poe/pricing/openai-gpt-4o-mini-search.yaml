apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-4o-mini-search
    displayName: openai-gpt-4o-mini-search pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-4o-mini-search
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 0.54
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-xai-grok-3-mini
    displayName: xai-grok-3-mini pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - xai-grok-3-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

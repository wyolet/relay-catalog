apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-4-turbo
    displayName: openai-gpt-4-turbo pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 9
        - meter: tokens.output
          unit: per_million
          amount: 27
    enabled: true

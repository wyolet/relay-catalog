apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-3-5-turbo
    displayName: openai-gpt-3-5-turbo pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-3-5-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.45
        - meter: tokens.output
          unit: per_million
          amount: 1.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-xai-grok-3
    displayName: xai-grok-3 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - xai-grok-3
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.75
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

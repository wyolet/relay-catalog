apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-4-1
    displayName: openai-gpt-4-1 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.45
        - meter: tokens.input
          unit: per_million
          amount: 1.8
        - meter: tokens.output
          unit: per_million
          amount: 7.2
    enabled: true

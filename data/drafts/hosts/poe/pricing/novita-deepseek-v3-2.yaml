apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-novita-deepseek-v3-2
    displayName: novita-deepseek-v3-2 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - novita-deepseek-v3-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.13
        - meter: tokens.input
          unit: per_million
          amount: 0.27
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

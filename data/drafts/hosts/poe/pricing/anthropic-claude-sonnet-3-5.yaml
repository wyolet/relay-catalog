apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-anthropic-claude-sonnet-3-5
    displayName: anthropic-claude-sonnet-3-5 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - anthropic-claude-sonnet-3-5
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.26
        - meter: tokens.input
          unit: per_million
          amount: 2.6
        - meter: tokens.output
          unit: per_million
          amount: 13
    enabled: true

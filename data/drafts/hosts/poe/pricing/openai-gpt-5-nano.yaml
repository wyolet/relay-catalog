apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-nano
    displayName: openai-gpt-5-nano pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-nano
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0045
        - meter: tokens.input
          unit: per_million
          amount: 0.045
        - meter: tokens.output
          unit: per_million
          amount: 0.36
    enabled: true

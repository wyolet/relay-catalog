apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-google-gemini-2-0-flash
    displayName: google-gemini-2-0-flash pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - google-gemini-2-0-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.42
    enabled: true

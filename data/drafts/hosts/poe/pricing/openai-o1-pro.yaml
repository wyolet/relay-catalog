apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o1-pro
    displayName: openai-o1-pro pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o1-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 140
        - meter: tokens.output
          unit: per_million
          amount: 540
    enabled: true

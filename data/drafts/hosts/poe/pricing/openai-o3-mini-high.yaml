apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o3-mini-high
    displayName: openai-o3-mini-high pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o3-mini-high
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.99
        - meter: tokens.output
          unit: per_million
          amount: 4
    enabled: true

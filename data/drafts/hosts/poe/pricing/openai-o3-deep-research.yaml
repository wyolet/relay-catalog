apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o3-deep-research
    displayName: openai-o3-deep-research pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o3-deep-research
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 2.2
        - meter: tokens.input
          unit: per_million
          amount: 9
        - meter: tokens.output
          unit: per_million
          amount: 36
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-1
    displayName: openai-gpt-5-1 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.11
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 9
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-google-gemini-2-5-pro
    displayName: google-gemini-2-5-pro pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.087
        - meter: tokens.input
          unit: per_million
          amount: 0.87
        - meter: tokens.output
          unit: per_million
          amount: 7
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-google-gemini-3-1-pro
    displayName: google-gemini-3-1-pro pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - google-gemini-3-1-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 12
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-4-classic
    displayName: openai-gpt-4-classic pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-classic
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 27
        - meter: tokens.output
          unit: per_million
          amount: 54
    enabled: true

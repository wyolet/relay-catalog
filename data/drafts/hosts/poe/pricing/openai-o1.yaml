apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o1
    displayName: openai-o1 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 14
        - meter: tokens.output
          unit: per_million
          amount: 54
    enabled: true

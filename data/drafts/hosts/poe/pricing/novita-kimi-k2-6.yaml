apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-novita-kimi-k2-6
    displayName: novita-kimi-k2-6 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - novita-kimi-k2-6
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.16
        - meter: tokens.input
          unit: per_million
          amount: 0.96
        - meter: tokens.output
          unit: per_million
          amount: 4.04
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-chatgpt-4o
    displayName: openai-chatgpt-4o pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-chatgpt-4o
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4.5
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-google-gemini-3-flash
    displayName: google-gemini-3-flash pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - google-gemini-3-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.04
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2.4
    enabled: true

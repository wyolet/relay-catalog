apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-4-1-mini
    displayName: openai-gpt-4-1-mini pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-1-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.09
        - meter: tokens.input
          unit: per_million
          amount: 0.36
        - meter: tokens.output
          unit: per_million
          amount: 1.4
    enabled: true

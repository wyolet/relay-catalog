apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-anthropic-claude-haiku-3-5
    displayName: anthropic-claude-haiku-3-5 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - anthropic-claude-haiku-3-5
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.85
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.068
        - meter: tokens.input
          unit: per_million
          amount: 0.68
        - meter: tokens.output
          unit: per_million
          amount: 3.4
    enabled: true

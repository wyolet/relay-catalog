apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-5
    displayName: openai-gpt-5-5 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4545
        - meter: tokens.input
          unit: per_million
          amount: 4.5455
        - meter: tokens.output
          unit: per_million
          amount: 27.2727
    enabled: true

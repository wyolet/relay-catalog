apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-3-codex
    displayName: openai-gpt-5-3-codex pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-3-codex
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.16
        - meter: tokens.input
          unit: per_million
          amount: 1.6
        - meter: tokens.output
          unit: per_million
          amount: 13
    enabled: true

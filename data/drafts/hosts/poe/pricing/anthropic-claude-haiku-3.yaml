apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-anthropic-claude-haiku-3
    displayName: anthropic-claude-haiku-3 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - anthropic-claude-haiku-3
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.26
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.021
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

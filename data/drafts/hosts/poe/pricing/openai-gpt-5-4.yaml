apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-4
    displayName: openai-gpt-5-4 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.22
        - meter: tokens.input
          unit: per_million
          amount: 2.2
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

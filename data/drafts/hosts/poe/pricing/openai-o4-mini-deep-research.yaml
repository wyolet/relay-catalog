apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o4-mini-deep-research
    displayName: openai-o4-mini-deep-research pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o4-mini-deep-research
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.45
        - meter: tokens.input
          unit: per_million
          amount: 1.8
        - meter: tokens.output
          unit: per_million
          amount: 7.2
    enabled: true

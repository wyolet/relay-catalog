apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-novita-glm-5
    displayName: novita-glm-5 pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - novita-glm-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-google-gemini-2-5-flash
    displayName: google-gemini-2-5-flash pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.021
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 1.8
    enabled: true

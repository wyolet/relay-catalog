apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-o3-pro
    displayName: openai-o3-pro pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-o3-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 18
        - meter: tokens.output
          unit: per_million
          amount: 72
    enabled: true

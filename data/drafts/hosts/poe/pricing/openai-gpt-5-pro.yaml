apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-openai-gpt-5-pro
    displayName: openai-gpt-5-pro pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 14
        - meter: tokens.output
          unit: per_million
          amount: 110
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poe-xai-grok-4-fast-reasoning
    displayName: xai-grok-4-fast-reasoning pricing
    owner:
        kind: host
        id: poe
spec:
    currency: USD
    targetModels:
        - xai-grok-4-fast-reasoning
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

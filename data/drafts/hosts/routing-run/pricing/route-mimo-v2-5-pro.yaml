apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: routing-run-route-mimo-v2-5-pro
    displayName: route-mimo-v2-5-pro pricing
    owner:
        kind: host
        id: routing-run
spec:
    currency: USD
    targetModels:
        - route-mimo-v2-5-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 256000
        - meter: tokens.input
          unit: per_million
          amount: 0.45
        - meter: tokens.input
          unit: per_million
          amount: 2
          aboveTokens: 256000
        - meter: tokens.output
          unit: per_million
          amount: 1.35
        - meter: tokens.output
          unit: per_million
          amount: 6
          aboveTokens: 256000
    enabled: true

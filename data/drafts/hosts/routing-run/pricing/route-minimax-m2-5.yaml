apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: routing-run-route-minimax-m2-5
    displayName: route-minimax-m2-5 pricing
    owner:
        kind: host
        id: routing-run
spec:
    currency: USD
    targetModels:
        - route-minimax-m2-5
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.193
        - meter: tokens.output
          unit: per_million
          amount: 1.238
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: routing-run-route-minimax-m2-7-highspeed
    displayName: route-minimax-m2-7-highspeed pricing
    owner:
        kind: host
        id: routing-run
spec:
    currency: USD
    targetModels:
        - route-minimax-m2-7-highspeed
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.33
        - meter: tokens.output
          unit: per_million
          amount: 1.32
    enabled: true

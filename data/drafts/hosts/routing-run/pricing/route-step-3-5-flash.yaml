apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: routing-run-route-step-3-5-flash
    displayName: route-step-3-5-flash pricing
    owner:
        kind: host
        id: routing-run
spec:
    currency: USD
    targetModels:
        - route-step-3-5-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.019
        - meter: tokens.input
          unit: per_million
          amount: 0.096
        - meter: tokens.output
          unit: per_million
          amount: 0.288
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: routing-run-route-deepseek-v3-2
    displayName: route-deepseek-v3-2 pricing
    owner:
        kind: host
        id: routing-run
spec:
    currency: USD
    targetModels:
        - route-deepseek-v3-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4928
        - meter: tokens.output
          unit: per_million
          amount: 0.7392
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: minimax-cn-coding-plan-minimax-m3
    displayName: minimax-m3 pricing
    owner:
        kind: host
        id: minimax-cn-coding-plan
spec:
    currency: USD
    targetModels:
        - minimax-m3
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

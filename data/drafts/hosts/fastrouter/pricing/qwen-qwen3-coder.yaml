apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: fastrouter-qwen-qwen3-coder
    displayName: qwen-qwen3-coder pricing
    owner:
        kind: host
        id: fastrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-coder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

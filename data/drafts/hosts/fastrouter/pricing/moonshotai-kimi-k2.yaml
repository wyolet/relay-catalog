apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: fastrouter-moonshotai-kimi-k2
    displayName: moonshotai-kimi-k2 pricing
    owner:
        kind: host
        id: fastrouter
spec:
    currency: USD
    targetModels:
        - moonshotai-kimi-k2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 2.2
    enabled: true

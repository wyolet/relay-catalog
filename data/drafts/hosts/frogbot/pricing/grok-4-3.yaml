apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: frogbot-grok-4-3
    displayName: grok-4-3 pricing
    owner:
        kind: host
        id: frogbot
spec:
    currency: USD
    targetModels:
        - grok-4-3
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

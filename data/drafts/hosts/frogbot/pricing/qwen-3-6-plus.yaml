apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: frogbot-qwen-3-6-plus
    displayName: qwen-3-6-plus pricing
    owner:
        kind: host
        id: frogbot
spec:
    currency: USD
    targetModels:
        - qwen-3-6-plus
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.1
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: replicate-replicate-openai-o1-mini
    owner:
        kind: host
        id: replicate
spec:
    currency: USD
    targetModels:
        - replicate-openai-o1-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.4
        - meter: tokens.reasoning
          unit: per_million
          amount: 4.4

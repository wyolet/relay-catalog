# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: replicate-replicate-deepseek-ai-deepseek-r1
    owner:
        kind: host
        id: replicate
spec:
    currency: USD
    targetModels:
        - replicate-deepseek-ai-deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.75
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.reasoning
          unit: per_million
          amount: 10

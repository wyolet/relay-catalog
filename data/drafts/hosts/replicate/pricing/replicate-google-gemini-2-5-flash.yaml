# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: replicate-replicate-google-gemini-2-5-flash
    owner:
        kind: host
        id: replicate
spec:
    currency: USD
    targetModels:
        - replicate-google-gemini-2-5-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 2.5

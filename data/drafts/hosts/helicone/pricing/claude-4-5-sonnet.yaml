apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-claude-4-5-sonnet
    displayName: claude-4-5-sonnet pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - claude-4-5-sonnet
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.30000000000000004
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

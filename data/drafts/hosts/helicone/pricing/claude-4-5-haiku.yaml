apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-claude-4-5-haiku
    displayName: claude-4-5-haiku pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - claude-4-5-haiku
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.09999999999999999
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-sonar-reasoning
    displayName: sonar-reasoning pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - sonar-reasoning
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-gpt-5-1-codex-mini
    displayName: gpt-5-1-codex-mini pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - gpt-5-1-codex-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.024999999999999998
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

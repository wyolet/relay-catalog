apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-gemini-3-pro-preview
    displayName: gemini-3-pro-preview pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - gemini-3-pro-preview
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.19999999999999998
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 12
    enabled: true

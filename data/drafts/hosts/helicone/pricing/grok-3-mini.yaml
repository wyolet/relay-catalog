apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-grok-3-mini
    displayName: grok-3-mini pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - grok-3-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

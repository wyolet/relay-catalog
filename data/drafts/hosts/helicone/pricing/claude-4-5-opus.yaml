apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-claude-4-5-opus
    displayName: claude-4-5-opus pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - claude-4-5-opus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 6.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 25
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-llama-4-scout
    displayName: llama-4-scout pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - llama-4-scout
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.08
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

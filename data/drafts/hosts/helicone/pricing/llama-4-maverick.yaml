apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-llama-4-maverick
    displayName: llama-4-maverick pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - llama-4-maverick
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.6
    enabled: true

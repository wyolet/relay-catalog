apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-qwen3-coder
    displayName: qwen3-coder pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - qwen3-coder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.22
        - meter: tokens.output
          unit: per_million
          amount: 0.95
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-o1-mini
    displayName: o1-mini pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - o1-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.55
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: helicone-gpt-5-1-codex
    displayName: gpt-5-1-codex pricing
    owner:
        kind: host
        id: helicone
spec:
    currency: USD
    targetModels:
        - gpt-5-1-codex
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.12500000000000003
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

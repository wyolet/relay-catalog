apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-o4-mini-deep-research
    displayName: o4-mini-deep-research pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - o4-mini-deep-research
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 8
    enabled: true

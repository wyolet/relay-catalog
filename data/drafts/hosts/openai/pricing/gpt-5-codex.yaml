apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-5-codex
    displayName: gpt-5-codex pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-5-codex
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

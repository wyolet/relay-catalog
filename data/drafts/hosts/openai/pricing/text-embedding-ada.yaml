apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-text-embedding-ada
    displayName: text-embedding-ada pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - text-embedding-ada
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-5-4-pro
    displayName: gpt-5-4-pro pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-5-4-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.input
          unit: per_million
          amount: 60
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 180
        - meter: tokens.output
          unit: per_million
          amount: 270
          aboveTokens: 272000
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-o1-pro
    displayName: o1-pro pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - o1-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 150
        - meter: tokens.output
          unit: per_million
          amount: 600
    enabled: true

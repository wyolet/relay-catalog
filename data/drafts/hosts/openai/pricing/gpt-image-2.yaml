apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-image-2
    displayName: gpt-image-2 pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-image-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.25
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

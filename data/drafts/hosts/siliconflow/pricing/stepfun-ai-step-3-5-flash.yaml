apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: siliconflow-stepfun-ai-step-3-5-flash
    displayName: stepfun-ai-step-3-5-flash pricing
    owner:
        kind: host
        id: siliconflow
spec:
    currency: USD
    targetModels:
        - stepfun-ai-step-3-5-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

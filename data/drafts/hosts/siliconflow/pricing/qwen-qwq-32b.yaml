apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: siliconflow-qwen-qwq-32b
    displayName: qwen-qwq-32b pricing
    owner:
        kind: host
        id: siliconflow
spec:
    currency: USD
    targetModels:
        - qwen-qwq-32b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.58
    enabled: true

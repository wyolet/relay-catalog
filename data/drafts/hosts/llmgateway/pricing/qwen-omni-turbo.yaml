apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen-omni-turbo
    displayName: qwen-omni-turbo pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen-omni-turbo
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 4.44
        - meter: tokens.audio_output
          unit: per_million
          amount: 8.89
        - meter: tokens.input
          unit: per_million
          amount: 0.07
        - meter: tokens.output
          unit: per_million
          amount: 0.27
    enabled: true

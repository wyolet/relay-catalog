apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-gpt-5-4-pro
    displayName: gpt-5-4-pro pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - gpt-5-4-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.output
          unit: per_million
          amount: 180
    enabled: true

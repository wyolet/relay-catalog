apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen3-vl-plus
    displayName: qwen3-vl-plus pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen3-vl-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.6
        - meter: tokens.reasoning
          unit: per_million
          amount: 4.8
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-seed-1-6
    displayName: seed-1-6 pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - seed-1-6
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

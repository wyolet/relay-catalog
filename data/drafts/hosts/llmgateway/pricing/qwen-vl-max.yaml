apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen-vl-max
    displayName: qwen-vl-max pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen-vl-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.8
        - meter: tokens.output
          unit: per_million
          amount: 3.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-minimax-text-01
    displayName: minimax-text-01 pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - minimax-text-01
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-gpt-4o-search-preview
    displayName: gpt-4o-search-preview pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - gpt-4o-search-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

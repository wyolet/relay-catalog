apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-grok-4-20-non-reasoning
    displayName: grok-4-20-non-reasoning pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - grok-4-20-non-reasoning
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 200000
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.input
          unit: per_million
          amount: 2.5
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 5
          aboveTokens: 200000
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen-vl-plus
    displayName: qwen-vl-plus pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen-vl-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 0.63
    enabled: true

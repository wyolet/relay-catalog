apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen3-7-max
    displayName: qwen3-7-max pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen3-7-max
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.125
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 7.5
    enabled: true

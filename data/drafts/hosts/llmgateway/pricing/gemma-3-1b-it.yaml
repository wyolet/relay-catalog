apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-gemma-3-1b-it
    displayName: gemma-3-1b-it pricing
    owner:
        kind: host
        id: llmgateway
spec:

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-custom
    displayName: custom pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - custom
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

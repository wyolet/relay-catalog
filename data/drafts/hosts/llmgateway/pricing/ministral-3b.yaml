apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-ministral-3b
    displayName: ministral-3b pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - ministral-3b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.1
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-seed-1-6-flash
    displayName: seed-1-6-flash pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - seed-1-6-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.07
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

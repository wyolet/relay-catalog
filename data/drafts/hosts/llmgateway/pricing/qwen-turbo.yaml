apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen-turbo
    displayName: qwen-turbo pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.05
        - meter: tokens.output
          unit: per_million
          amount: 0.2
        - meter: tokens.reasoning
          unit: per_million
          amount: 0.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-qwen-coder-plus
    displayName: qwen-coder-plus pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - qwen-coder-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.502
        - meter: tokens.output
          unit: per_million
          amount: 1.004
    enabled: true

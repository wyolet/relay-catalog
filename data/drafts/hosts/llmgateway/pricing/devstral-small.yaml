apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-devstral-small
    displayName: devstral-small pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - devstral-small
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

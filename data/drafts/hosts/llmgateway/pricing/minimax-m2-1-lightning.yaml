apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-minimax-m2-1-lightning
    displayName: minimax-m2-1-lightning pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - minimax-m2-1-lightning
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.12
        - meter: tokens.output
          unit: per_million
          amount: 0.48
    enabled: true

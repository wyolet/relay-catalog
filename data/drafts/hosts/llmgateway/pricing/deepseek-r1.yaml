apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-deepseek-r1
    displayName: deepseek-r1 pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 2.19
    enabled: true

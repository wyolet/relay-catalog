apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: llmgateway-glm-4-5-airx
    displayName: glm-4-5-airx pricing
    owner:
        kind: host
        id: llmgateway
spec:
    currency: USD
    targetModels:
        - glm-4-5-airx
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.22
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.5
    enabled: true

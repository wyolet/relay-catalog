# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: morph-morph-morph-v3-fast
    owner:
        kind: host
        id: morph
spec:
    currency: USD
    targetModels:
        - morph-morph-v3-fast
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.7999999999999999
        - meter: tokens.output
          unit: per_million
          amount: 1.2

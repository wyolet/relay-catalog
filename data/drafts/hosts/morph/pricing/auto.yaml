apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: morph-auto
    displayName: auto pricing
    owner:
        kind: host
        id: morph
spec:
    currency: USD
    targetModels:
        - auto
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.85
        - meter: tokens.output
          unit: per_million
          amount: 1.55
    enabled: true

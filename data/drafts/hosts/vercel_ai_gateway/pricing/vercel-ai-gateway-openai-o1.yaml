apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vercel_ai_gateway-vercel-ai-gateway-openai-o1
    owner:
        kind: host
        id: vercel_ai_gateway
spec:
    currency: USD
    targetModels:
        - vercel-ai-gateway-openai-o1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 60
        - meter: tokens.cache_read
          unit: per_million
          amount: 7.5

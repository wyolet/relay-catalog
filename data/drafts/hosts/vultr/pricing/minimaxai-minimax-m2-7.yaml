apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vultr-minimaxai-minimax-m2-7
    displayName: minimaxai-minimax-m2-7 pricing
    owner:
        kind: host
        id: vultr
spec:
    currency: USD
    targetModels:
        - minimaxai-minimax-m2-7
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: poolside-poolside-laguna-m-1
    displayName: poolside-laguna-m-1 pricing
    owner:
        kind: host
        id: poolside
spec:
    currency: USD
    targetModels:
        - poolside-laguna-m-1
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

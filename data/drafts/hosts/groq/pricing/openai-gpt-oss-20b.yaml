apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: groq-openai-gpt-oss-20b
    displayName: openai-gpt-oss-20b pricing
    owner:
        kind: host
        id: groq
spec:
    currency: USD
    targetModels:
        - openai-gpt-oss-20b
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0375
        - meter: tokens.input
          unit: per_million
          amount: 0.075
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

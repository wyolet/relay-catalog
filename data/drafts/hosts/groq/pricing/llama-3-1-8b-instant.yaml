apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: groq-llama-3-1-8b-instant
    displayName: llama-3-1-8b-instant pricing
    owner:
        kind: host
        id: groq
spec:
    currency: USD
    targetModels:
        - llama-3-1-8b-instant
    rates:

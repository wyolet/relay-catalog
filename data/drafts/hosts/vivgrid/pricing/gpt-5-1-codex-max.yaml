apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vivgrid-gpt-5-1-codex-max
    displayName: gpt-5-1-codex-max pricing
    owner:
        kind: host
        id: vivgrid
spec:
    currency: USD
    targetModels:
        - gpt-5-1-codex-max
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

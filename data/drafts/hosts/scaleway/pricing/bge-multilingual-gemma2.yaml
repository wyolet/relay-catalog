apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: scaleway-bge-multilingual-gemma2
    displayName: bge-multilingual-gemma2 pricing
    owner:
        kind: host
        id: scaleway
spec:
    currency: USD
    targetModels:
        - bge-multilingual-gemma2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

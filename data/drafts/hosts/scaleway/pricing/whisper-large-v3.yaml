apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: scaleway-whisper-large-v3
    displayName: whisper-large-v3 pricing
    owner:
        kind: host
        id: scaleway
spec:
    currency: USD
    targetModels:
        - whisper-large-v3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.003
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

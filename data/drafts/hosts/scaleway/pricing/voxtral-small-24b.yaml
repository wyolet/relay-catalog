apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: scaleway-voxtral-small-24b
    displayName: voxtral-small-24b pricing
    owner:
        kind: host
        id: scaleway
spec:
    currency: USD
    targetModels:
        - voxtral-small-24b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.35
    enabled: true

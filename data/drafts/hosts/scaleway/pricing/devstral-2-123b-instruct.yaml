apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: scaleway-devstral-2-123b-instruct
    displayName: devstral-2-123b-instruct pricing
    owner:
        kind: host
        id: scaleway
spec:
    currency: USD
    targetModels:
        - devstral-2-123b-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-bedrock-us-gov-east-1-amazon-titan-text-lite-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - bedrock-us-gov-east-1-amazon-titan-text-lite-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-bedrock-us-east-2-minimax-minimax-m2-1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - bedrock-us-east-2-minimax-minimax-m2-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-bedrock-us-gov-west-1-amazon-titan-text-express-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - bedrock-us-gov-west-1-amazon-titan-text-express-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.3
        - meter: tokens.output
          unit: per_million
          amount: 1.7

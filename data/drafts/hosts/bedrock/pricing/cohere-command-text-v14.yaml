# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-cohere-command-text-v14
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - cohere-command-text-v14
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.5
        - meter: tokens.output
          unit: per_million
          amount: 2

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-ai21-j2-mid-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - ai21-j2-mid-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 12.5
        - meter: tokens.output
          unit: per_million
          amount: 12.5

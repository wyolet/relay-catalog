# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-amazon-titan-text-premier-v1-0
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - amazon-titan-text-premier-v1-0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 1.5

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-meta-llama2-13b-chat-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - meta-llama2-13b-chat-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 1

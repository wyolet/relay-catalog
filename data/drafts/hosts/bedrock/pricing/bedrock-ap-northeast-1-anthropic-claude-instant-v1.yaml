# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-bedrock-ap-northeast-1-anthropic-claude-instant-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - bedrock-ap-northeast-1-anthropic-claude-instant-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.23
        - meter: tokens.output
          unit: per_million
          amount: 7.55

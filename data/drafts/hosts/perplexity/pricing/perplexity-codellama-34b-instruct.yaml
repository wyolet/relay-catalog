# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-perplexity-codellama-34b-instruct
    owner:
        kind: host
        id: perplexity
spec:
    currency: USD
    targetModels:
        - perplexity-codellama-34b-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.35
        - meter: tokens.output
          unit: per_million
          amount: 1.4

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-perplexity-sonar-reasoning
    owner:
        kind: host
        id: perplexity
spec:
    currency: USD
    targetModels:
        - perplexity-sonar-reasoning
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5

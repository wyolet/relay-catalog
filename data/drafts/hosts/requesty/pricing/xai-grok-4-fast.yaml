apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: requesty-xai-grok-4-fast
    displayName: xai-grok-4-fast pricing
    owner:
        kind: host
        id: requesty
spec:
    currency: USD
    targetModels:
        - xai-grok-4-fast
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

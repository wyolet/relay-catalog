apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: requesty-openai-gpt-5-2-chat
    displayName: openai-gpt-5-2-chat pricing
    owner:
        kind: host
        id: requesty
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-2-chat
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.175
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: drun-public-deepseek-r1
    displayName: public-deepseek-r1 pricing
    owner:
        kind: host
        id: drun
spec:
    currency: USD
    targetModels:
        - public-deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 2.2
    enabled: true

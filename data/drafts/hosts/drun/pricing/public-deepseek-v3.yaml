apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: drun-public-deepseek-v3
    displayName: public-deepseek-v3 pricing
    owner:
        kind: host
        id: drun
spec:
    currency: USD
    targetModels:
        - public-deepseek-v3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.28
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: drun-public-minimax-m25
    displayName: public-minimax-m25 pricing
    owner:
        kind: host
        id: drun
spec:
    currency: USD
    targetModels:
        - public-minimax-m25
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.29
        - meter: tokens.output
          unit: per_million
          amount: 1.16
    enabled: true

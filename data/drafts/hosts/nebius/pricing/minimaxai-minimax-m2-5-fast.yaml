apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-minimaxai-minimax-m2-5-fast
    displayName: minimaxai-minimax-m2-5-fast pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - minimaxai-minimax-m2-5-fast
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

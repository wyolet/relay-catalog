apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-openai-gpt-oss-120b-fast
    displayName: openai-gpt-oss-120b-fast pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - openai-gpt-oss-120b-fast
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.125
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.5
    enabled: true

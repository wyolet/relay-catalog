apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-primeintellect-intellect-3
    displayName: primeintellect-intellect-3 pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - primeintellect-intellect-3
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

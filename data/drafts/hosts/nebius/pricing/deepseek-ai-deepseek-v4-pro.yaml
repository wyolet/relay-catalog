apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-deepseek-ai-deepseek-v4-pro
    displayName: deepseek-ai-deepseek-v4-pro pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-v4-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 3.5
    enabled: true

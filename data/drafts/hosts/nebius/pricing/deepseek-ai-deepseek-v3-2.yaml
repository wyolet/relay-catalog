apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-deepseek-ai-deepseek-v3-2
    displayName: deepseek-ai-deepseek-v3-2 pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-v3-2
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.45
        - meter: tokens.reasoning
          unit: per_million
          amount: 0.45
    enabled: true

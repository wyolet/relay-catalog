apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-google-gemma-3-27b-it
    displayName: google-gemma-3-27b-it pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - google-gemma-3-27b-it
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.125
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-google-gemma-2-2b-it
    displayName: google-gemma-2-2b-it pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - google-gemma-2-2b-it
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.025
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.002
        - meter: tokens.input
          unit: per_million
          amount: 0.02
        - meter: tokens.output
          unit: per_million
          amount: 0.06
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nebius-openai-gpt-oss-120b
    displayName: openai-gpt-oss-120b pricing
    owner:
        kind: host
        id: nebius
spec:
    currency: USD
    targetModels:
        - openai-gpt-oss-120b
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.18
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.6
        - meter: tokens.reasoning
          unit: per_million
          amount: 0.6
    enabled: true

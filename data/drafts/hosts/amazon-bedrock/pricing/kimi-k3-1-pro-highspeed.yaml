# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: amazon-bedrock-kimi-k3-1-pro-highspeed
    displayName: Kimi K3.1 Pro Highspeed pricing
    description: "Global cross-Region inference rates, Standard tier; cache write is the 30-minute rate. Geo profiles (us., in.) cost 10% more. Source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3-1-highspeed.html, read 2026-11-24."
    owner:
        kind: host
        id: amazon-bedrock
spec:
    currency: USD
    targetModels:
        - kimi-k3-1-pro-highspeed
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4
        - meter: tokens.output
          unit: per_million
          amount: 20
        - meter: tokens.cache_creation
          unit: per_million
          amount: 5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2

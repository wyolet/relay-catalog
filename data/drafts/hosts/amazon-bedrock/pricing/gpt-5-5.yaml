# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: amazon-bedrock-gpt-5-5
    displayName: GPT-5.5 pricing
    description: "US geo cross-Region and in-Region rates, Standard tier: AWS publishes no Global rate and no cache-write rate for this model. Requests over 272,000 input tokens bill wholly at the long-context rates. Source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-55.html and https://aws.amazon.com/bedrock/pricing/ (In-Region Inference & Geo Cross Region Inference table), read 2026-11-24."
    owner:
        kind: host
        id: amazon-bedrock
spec:
    currency: USD
    targetModels:
        - gpt-5-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 5.5
        - meter: tokens.input
          unit: per_million
          amount: 11
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 33
        - meter: tokens.output
          unit: per_million
          amount: 49.5
          aboveTokens: 272000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.55
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.1
          aboveTokens: 272000

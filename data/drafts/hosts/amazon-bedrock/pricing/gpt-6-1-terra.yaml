# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: amazon-bedrock-gpt-6-1-terra
    displayName: GPT-6.1 Terra pricing
    description: "Global cross-Region inference rates, Standard tier; cache write is the 30-minute rate. The us. geo profile costs 10% more. Requests over 272,000 input tokens bill wholly at the long-context rates. Source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-1-terra.html, read 2026-11-24."
    owner:
        kind: host
        id: amazon-bedrock
spec:
    currency: USD
    targetModels:
        - gpt-6-1-terra
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.input
          unit: per_million
          amount: 2
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 7.5
          aboveTokens: 272000
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.25
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2.5
          aboveTokens: 272000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.1
          aboveTokens: 272000

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: amazon-bedrock-glm-5-3
    displayName: GLM-5.3 pricing
    description: "Global cross-Region inference rates, Standard tier; cache write is the 30-minute rate. Geo profiles (us.) cost 10% more. Source: https://aws.amazon.com/bedrock/pricing/ (Z AI, GLM 5.3), read 2026-11-24."
    owner:
        kind: host
        id: amazon-bedrock
spec:
    currency: USD
    targetModels:
        - glm-5-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.68
        - meter: tokens.output
          unit: per_million
          amount: 5.28
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2.1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.312

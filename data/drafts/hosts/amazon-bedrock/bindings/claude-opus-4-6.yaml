# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: claude-opus-4-6-on-amazon-bedrock
    displayName: "Claude Opus 4.6 via amazon-bedrock"
spec:
    model: claude-opus-4-6
    host: amazon-bedrock
    adapter: bedrock_anthropic
    enabled: false
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us., eu., au.) bill 10% more. Foundation model id: anthropic.claude-opus-4-6-v1
    upstreamName: global.anthropic.claude-opus-4-6-v1
    pricing: amazon-bedrock-claude-opus-4-6
    snapshots: [claude-opus-4-6]

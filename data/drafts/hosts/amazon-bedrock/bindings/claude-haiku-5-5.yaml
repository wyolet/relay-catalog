# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: claude-haiku-5-5-on-amazon-bedrock
    displayName: "Claude Haiku 5.5 via amazon-bedrock"
spec:
    model: claude-haiku-5-5
    host: amazon-bedrock
    adapter: anthropic
    # inference profile: global.anthropic.claude-haiku-5-5 (us., ca., eu., au., jp. also exist); bedrock-runtime has no in-Region on-demand for the plain id
    upstreamName: anthropic.claude-haiku-5-5
    pricing: amazon-bedrock-claude-haiku-5-5

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: gpt-6-2-astra-on-amazon-bedrock
    displayName: "GPT-6.2 Astra via amazon-bedrock"
spec:
    model: gpt-6-2-astra
    host: amazon-bedrock
    adapter: openai_responses
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us.) bill 10% more. Foundation model id: openai.gpt-6.2-astra
    upstreamName: global.openai.gpt-6.2-astra
    pricing: amazon-bedrock-gpt-6-2-astra

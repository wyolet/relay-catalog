# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: claude-sonnet-5-on-amazon-bedrock
    displayName: "Claude Sonnet 5 via amazon-bedrock"
spec:
    model: claude-sonnet-5
    host: amazon-bedrock
    adapter: anthropic
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us., eu., au., in.) bill 10% more. Foundation model id: anthropic.claude-sonnet-5
    upstreamName: global.anthropic.claude-sonnet-5
    pricing: amazon-bedrock-claude-sonnet-5
    snapshots: [claude-sonnet-5]

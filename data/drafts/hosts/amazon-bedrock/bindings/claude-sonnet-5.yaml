# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: claude-sonnet-5-on-amazon-bedrock
    displayName: "Claude Sonnet 5 via amazon-bedrock"
spec:
    model: claude-sonnet-5
    host: amazon-bedrock
    adapter: anthropic
    # inference profile: global.anthropic.claude-sonnet-5 (us., eu., au., in. also exist); bedrock-runtime has no in-Region on-demand for the plain id
    upstreamName: anthropic.claude-sonnet-5
    pricing: amazon-bedrock-claude-sonnet-5

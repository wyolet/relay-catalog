# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: gpt-5-5-on-amazon-bedrock
    displayName: "GPT-5.5 via amazon-bedrock"
spec:
    model: gpt-5-5
    host: amazon-bedrock
    adapter: openai_responses
    enabled: false
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us.) bill 10% more. Foundation model id: openai.gpt-5.5
    upstreamName: global.openai.gpt-5.5
    pricing: amazon-bedrock-gpt-5-5
    snapshots: [gpt-5-5]

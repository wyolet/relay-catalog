# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: kimi-k3-on-amazon-bedrock
    displayName: "Kimi K3 via amazon-bedrock"
spec:
    model: kimi-k3
    host: amazon-bedrock
    adapter: openai
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us., in.) bill 10% more. Foundation model id: moonshotai.kimi-k3
    upstreamName: global.moonshotai.kimi-k3
    pricing: amazon-bedrock-kimi-k3

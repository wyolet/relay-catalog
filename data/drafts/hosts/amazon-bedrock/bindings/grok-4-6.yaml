# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: grok-4-6-on-amazon-bedrock
    displayName: "Grok 4.6 via amazon-bedrock"
spec:
    model: grok-4-6
    host: amazon-bedrock
    adapter: openai
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us.) bill 10% more. Foundation model id: xai.grok-4.6
    upstreamName: global.xai.grok-4.6
    pricing: amazon-bedrock-grok-4-6

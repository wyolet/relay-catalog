# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: gpt-5-6-sol-on-amazon-bedrock
    displayName: "GPT-5.6 Sol via amazon-bedrock"
spec:
    model: gpt-5-6-sol
    host: amazon-bedrock
    adapter: openai_responses
    # Global inference profile; on-demand use needs a profile id. Geo profiles (us.) bill 10% more. Foundation model id: openai.gpt-5.6-sol
    upstreamName: global.openai.gpt-5.6-sol
    pricing: amazon-bedrock-gpt-5-6-sol
    snapshots: [gpt-5-6-sol]

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: nemotron-3-nano-30b-on-amazon-bedrock
    displayName: "Nemotron 3 Nano 30B via amazon-bedrock"
spec:
    model: nemotron-3-nano-30b
    host: amazon-bedrock
    adapter: openai
    upstreamName: nvidia.nemotron-nano-3-30b
    pricing: amazon-bedrock-nemotron-3-nano-30b
    snapshots: [nemotron-3-nano-30b]

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: grok-4-7-on-amazon-bedrock
    displayName: "Grok 4.7 via amazon-bedrock"
spec:
    model: grok-4-7
    host: amazon-bedrock
    adapter: openai
    # inference profile: global.xai.grok-4.7 (us. also exists); bedrock-runtime has no in-Region on-demand for the plain id
    upstreamName: xai.grok-4.7
    pricing: amazon-bedrock-grok-4-7

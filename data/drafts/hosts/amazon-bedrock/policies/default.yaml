# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Policy.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: bedrock-default
  displayName: Amazon Bedrock (default)
  description: "Placeholder upstream policy. No relay-side caps — Bedrock service quotas are per-(account, region, model) and the upstream's own quota response governs. Operators with a known quota should clone this and attach a host-owned RateLimit."

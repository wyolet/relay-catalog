apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
  name: amazon-bedrock-default
  displayName: Amazon Bedrock default
  description: "Bedrock quotas are per AWS account, Region and model (tokens per minute, and requests per minute for some models), and are viewed and raised in AWS Service Quotas. Anchor policy without relay-side caps — set your own after checking your account's quotas. Per docs.aws.amazon.com/bedrock/latest/userguide/quotas-runtime.html, 2026-11-24."
  owner:
    kind: host
    name: amazon-bedrock
spec: {}

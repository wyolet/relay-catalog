# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Host.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Host
metadata:
    name: amazon-bedrock
    displayName: Amazon Bedrock
    description: "AWS's managed model endpoint (bedrock-runtime), one per Region; baseURL and backend.region name US East (N. Virginia). Serves Claude in the Anthropic Messages body through InvokeModel, and OpenAI, Mistral, Qwen, Moonshot, xAI, Z.AI and NVIDIA models in an OpenAI-compatible shape under /openai/v1. Requests are signed with AWS SigV4 or carry a Bedrock API key. Most models are invoked on demand only through a cross-Region inference profile id (global. or a geo prefix such as us.)."
spec:
    baseURL: https://bedrock-runtime.us-east-1.amazonaws.com
    paths:
        anthropic: /anthropic/v1/messages
        openai: /openai/v1/chat/completions
        openai_responses: /openai/v1/responses
    backend:
        region: us-east-1
    pricingStrategies:
        - api
    homepageURL: https://aws.amazon.com/bedrock/
    docsURL: https://docs.aws.amazon.com/bedrock/latest/userguide/
    consoleURL: https://console.aws.amazon.com/bedrock/
    statusPageURL: https://health.aws.amazon.com/health/status
    icon:
        path: /provider/amazon-bedrock.png

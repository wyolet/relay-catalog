apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: jiekou-gemini-3-pro-preview
    displayName: gemini-3-pro-preview pricing
    owner:
        kind: host
        id: jiekou
spec:
    currency: USD
    targetModels:
        - gemini-3-pro-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.8
        - meter: tokens.output
          unit: per_million
          amount: 10.8
    enabled: true

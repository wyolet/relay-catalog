apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: jiekou-gpt-5-1-codex-max
    displayName: gpt-5-1-codex-max pricing
    owner:
        kind: host
        id: jiekou
spec:
    currency: USD
    targetModels:
        - gpt-5-1-codex-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.125
        - meter: tokens.output
          unit: per_million
          amount: 9
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: jiekou-grok-code-fast-1
    displayName: grok-code-fast-1 pricing
    owner:
        kind: host
        id: jiekou
spec:
    currency: USD
    targetModels:
        - grok-code-fast-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.18
        - meter: tokens.output
          unit: per_million
          amount: 1.35
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: jiekou-deepseek-deepseek-v3
    displayName: deepseek-deepseek-v3 pricing
    owner:
        kind: host
        id: jiekou
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.28
        - meter: tokens.output
          unit: per_million
          amount: 1.14
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: inceptron-minimaxai-minimax-m2-5
    displayName: minimaxai-minimax-m2-5 pricing
    owner:
        kind: host
        id: inceptron
spec:
    currency: USD
    targetModels:
        - minimaxai-minimax-m2-5
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.24
        - meter: tokens.output
          unit: per_million
          amount: 0.9
    enabled: true

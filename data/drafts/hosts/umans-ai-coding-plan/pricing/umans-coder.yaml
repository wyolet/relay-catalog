apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: umans-ai-coding-plan-umans-coder
    displayName: umans-coder pricing
    owner:
        kind: host
        id: umans-ai-coding-plan
spec:
    currency: USD
    targetModels:
        - umans-coder
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

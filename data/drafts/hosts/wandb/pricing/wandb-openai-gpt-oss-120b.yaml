# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: wandb-wandb-openai-gpt-oss-120b
    owner:
        kind: host
        id: wandb
spec:
    currency: USD
    targetModels:
        - wandb-openai-gpt-oss-120b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15000
        - meter: tokens.output
          unit: per_million
          amount: 60000

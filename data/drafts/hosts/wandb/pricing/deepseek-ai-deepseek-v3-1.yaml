apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: wandb-deepseek-ai-deepseek-v3-1
    displayName: deepseek-ai-deepseek-v3-1 pricing
    owner:
        kind: host
        id: wandb
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-v3-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 1.65
    enabled: true

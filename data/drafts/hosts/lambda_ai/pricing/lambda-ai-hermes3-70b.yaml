# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: lambda_ai-lambda-ai-hermes3-70b
    owner:
        kind: host
        id: lambda_ai
spec:
    currency: USD
    targetModels:
        - lambda-ai-hermes3-70b
    rates:

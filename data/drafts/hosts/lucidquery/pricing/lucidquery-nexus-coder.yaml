apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: lucidquery-lucidquery-nexus-coder
    displayName: lucidquery-nexus-coder pricing
    owner:
        kind: host
        id: lucidquery
spec:
    currency: USD
    targetModels:
        - lucidquery-nexus-coder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 5
    enabled: true

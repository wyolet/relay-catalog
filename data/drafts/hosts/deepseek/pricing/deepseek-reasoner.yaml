# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: deepseek-deepseek-reasoner
    owner:
        kind: host
        id: deepseek
spec:
    currency: USD
    targetModels:
        - deepseek-reasoner
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.28
        - meter: tokens.output
          unit: per_million
          amount: 0.42
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.028

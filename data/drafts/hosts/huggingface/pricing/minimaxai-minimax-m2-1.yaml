apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: huggingface-minimaxai-minimax-m2-1
    displayName: minimaxai-minimax-m2-1 pricing
    owner:
        kind: host
        id: huggingface
spec:
    currency: USD
    targetModels:
        - minimaxai-minimax-m2-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: huggingface-deepseek-ai-deepseek-v4-pro
    displayName: deepseek-ai-deepseek-v4-pro pricing
    owner:
        kind: host
        id: huggingface
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-v4-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.003625
        - meter: tokens.input
          unit: per_million
          amount: 0.435
        - meter: tokens.output
          unit: per_million
          amount: 0.87
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: huggingface-zai-org-glm-5-1
    displayName: zai-org-glm-5-1 pricing
    owner:
        kind: host
        id: huggingface
spec:
    currency: USD
    targetModels:
        - zai-org-glm-5-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3.2
    enabled: true

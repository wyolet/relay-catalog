apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: huggingface-moonshotai-kimi-k2-thinking
    displayName: moonshotai-kimi-k2-thinking pricing
    owner:
        kind: host
        id: huggingface
spec:
    currency: USD
    targetModels:
        - moonshotai-kimi-k2-thinking
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zai-glm-4-5v
    displayName: glm-4-5v pricing
    owner:
        kind: host
        id: zai
spec:
    currency: USD
    targetModels:
        - glm-4-5v
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 1.8
    enabled: true

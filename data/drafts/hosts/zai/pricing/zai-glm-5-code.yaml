apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zai-zai-glm-5-code
    owner:
        kind: host
        id: zai
spec:
    currency: USD
    targetModels:
        - zai-glm-5-code
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.2
        - meter: tokens.output
          unit: per_million
          amount: 5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3

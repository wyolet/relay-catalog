# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zai-zai-glm-4-5-airx
    owner:
        kind: host
        id: zai
spec:
    currency: USD
    targetModels:
        - zai-glm-4-5-airx
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.5

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: upstage-solar-mini
    displayName: solar-mini pricing
    owner:
        kind: host
        id: upstage
spec:
    currency: USD
    targetModels:
        - solar-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

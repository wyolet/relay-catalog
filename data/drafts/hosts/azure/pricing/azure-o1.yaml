apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-o1
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-o1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 60
        - meter: tokens.cache_read
          unit: per_million
          amount: 7.5

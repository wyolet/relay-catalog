# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-eu-gpt-5-nano
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-eu-gpt-5-nano
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.055
        - meter: tokens.output
          unit: per_million
          amount: 0.44
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0055

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-gpt-4-1-mini
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-gpt-4-1-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.output
          unit: per_million
          amount: 1.5999999999999999
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.09999999999999999

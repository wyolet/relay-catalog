apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-eu-o1-mini
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-eu-o1-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.21
        - meter: tokens.output
          unit: per_million
          amount: 4.84
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.605

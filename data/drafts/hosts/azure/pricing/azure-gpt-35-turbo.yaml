apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-gpt-35-turbo
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-gpt-35-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 1.5

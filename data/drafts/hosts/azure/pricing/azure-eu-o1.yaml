apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-eu-o1
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-eu-o1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 16.5
        - meter: tokens.output
          unit: per_million
          amount: 66
        - meter: tokens.cache_read
          unit: per_million
          amount: 8.25

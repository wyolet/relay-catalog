# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-us-gpt-4o-mini-realtime
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-us-gpt-4o-mini-realtime
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.66
        - meter: tokens.output
          unit: per_million
          amount: 2.64
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.33

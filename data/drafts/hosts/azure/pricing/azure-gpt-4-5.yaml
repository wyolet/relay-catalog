# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-gpt-4-5
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-gpt-4-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 75
        - meter: tokens.output
          unit: per_million
          amount: 150
        - meter: tokens.cache_read
          unit: per_million
          amount: 37.5

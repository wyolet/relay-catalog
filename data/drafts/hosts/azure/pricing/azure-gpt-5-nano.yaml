apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure-gpt-5-nano
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure-gpt-5-nano
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.049999999999999996
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.005

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-deepseek-v3-2
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:
        - deepseek-v3-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.62
        - meter: tokens.output
          unit: per_million
          amount: 1.85

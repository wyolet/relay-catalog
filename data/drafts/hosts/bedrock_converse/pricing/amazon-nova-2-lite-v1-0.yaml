apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-amazon-nova-2-lite-v1-0
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:
        - amazon-nova-2-lite-v1-0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075

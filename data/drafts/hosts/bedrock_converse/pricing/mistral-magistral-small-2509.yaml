# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-mistral-magistral-small-2509
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:

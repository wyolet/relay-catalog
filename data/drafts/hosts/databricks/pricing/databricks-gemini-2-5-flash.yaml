apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: databricks-databricks-gemini-2-5-flash
    displayName: databricks-gemini-2-5-flash pricing
    owner:
        kind: host
        id: databricks
spec:
    currency: USD
    targetModels:
        - databricks-gemini-2-5-flash
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: databricks-databricks-gpt-5-1
    displayName: databricks-gpt-5-1 pricing
    owner:
        kind: host
        id: databricks
spec:
    currency: USD
    targetModels:
        - databricks-gpt-5-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: databricks-databricks-gpt-oss-20b
    displayName: databricks-gpt-oss-20b pricing
    owner:
        kind: host
        id: databricks
spec:
    currency: USD
    targetModels:
        - databricks-gpt-oss-20b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.05
        - meter: tokens.output
          unit: per_million
          amount: 0.2
    enabled: true

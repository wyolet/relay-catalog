apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-route-llm
    displayName: route-llm pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - route-llm
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-deepseek-deepseek-v3-1
    displayName: deepseek-deepseek-v3-1 pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 1.66
    enabled: true

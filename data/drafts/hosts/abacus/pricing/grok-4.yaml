apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-grok-4
    displayName: grok-4 pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - grok-4
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

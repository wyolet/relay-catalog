apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-gpt-5-codex
    displayName: gpt-5-codex pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - gpt-5-codex
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

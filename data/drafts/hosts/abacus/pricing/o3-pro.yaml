apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-o3-pro
    displayName: o3-pro pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - o3-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 20
        - meter: tokens.output
          unit: per_million
          amount: 40
    enabled: true

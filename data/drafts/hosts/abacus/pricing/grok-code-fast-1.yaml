apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-grok-code-fast-1
    displayName: grok-code-fast-1 pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - grok-code-fast-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.5
    enabled: true

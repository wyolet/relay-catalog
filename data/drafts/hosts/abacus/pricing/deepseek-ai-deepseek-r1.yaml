apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-deepseek-ai-deepseek-r1
    displayName: deepseek-ai-deepseek-r1 pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-r1
    rates:

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: abacus-gpt-5-3-codex-xhigh
    displayName: gpt-5-3-codex-xhigh pricing
    owner:
        kind: host
        id: abacus
spec:
    currency: USD
    targetModels:
        - gpt-5-3-codex-xhigh
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

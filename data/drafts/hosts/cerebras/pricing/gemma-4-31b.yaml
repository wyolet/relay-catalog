apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cerebras-gemma-4-31b
    displayName: gemma-4-31b pricing
    owner:
        kind: host
        id: cerebras
spec:
    currency: USD
    targetModels:
        - gemma-4-31b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.99
        - meter: tokens.output
          unit: per_million
          amount: 1.49
    enabled: true

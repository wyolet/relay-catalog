apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-cohere-command-r
    displayName: cohere-command-r pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - cohere-command-r
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.476
        - meter: tokens.output
          unit: per_million
          amount: 1.428
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-qwen3-max
    displayName: qwen3-max pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - qwen3-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.2002
        - meter: tokens.output
          unit: per_million
          amount: 6.001
    enabled: true

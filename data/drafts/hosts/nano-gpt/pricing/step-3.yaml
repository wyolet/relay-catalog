apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-step-3
    displayName: step-3 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - step-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2499
        - meter: tokens.output
          unit: per_million
          amount: 0.6494
    enabled: true

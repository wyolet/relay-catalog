apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-glm-4-long
    displayName: glm-4-long pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - glm-4-long
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2006
        - meter: tokens.output
          unit: per_million
          amount: 0.2006
    enabled: true

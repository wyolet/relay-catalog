apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-jamba-mini
    displayName: jamba-mini pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - jamba-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1989
        - meter: tokens.output
          unit: per_million
          amount: 0.408
    enabled: true

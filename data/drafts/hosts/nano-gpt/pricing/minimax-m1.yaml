apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-minimax-m1
    displayName: minimax-m1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - minimax-m1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1394
        - meter: tokens.output
          unit: per_million
          amount: 1.3328
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-gemini-exp
    displayName: gemini-exp pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - gemini-exp
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.258
        - meter: tokens.output
          unit: per_million
          amount: 4.998
    enabled: true

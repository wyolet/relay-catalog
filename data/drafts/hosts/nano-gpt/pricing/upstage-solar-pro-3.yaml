apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-upstage-solar-pro-3
    displayName: upstage-solar-pro-3 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - upstage-solar-pro-3
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.6
    enabled: true

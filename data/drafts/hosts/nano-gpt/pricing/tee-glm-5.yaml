apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-tee-glm-5
    displayName: tee-glm-5 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - tee-glm-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.2
        - meter: tokens.output
          unit: per_million
          amount: 3.5
    enabled: true

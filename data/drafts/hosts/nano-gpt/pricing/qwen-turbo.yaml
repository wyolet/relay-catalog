apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-qwen-turbo
    displayName: qwen-turbo pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - qwen-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.04998
        - meter: tokens.output
          unit: per_million
          amount: 0.2006
    enabled: true

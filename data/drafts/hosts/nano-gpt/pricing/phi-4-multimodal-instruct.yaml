apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-phi-4-multimodal-instruct
    displayName: phi-4-multimodal-instruct pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - phi-4-multimodal-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.07
        - meter: tokens.output
          unit: per_million
          amount: 0.11
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-qvq-max
    displayName: qvq-max pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - qvq-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.4
        - meter: tokens.output
          unit: per_million
          amount: 5.3
    enabled: true

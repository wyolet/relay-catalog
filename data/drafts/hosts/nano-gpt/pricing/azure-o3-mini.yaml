apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-azure-o3-mini
    displayName: azure-o3-mini pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - azure-o3-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.088
        - meter: tokens.output
          unit: per_million
          amount: 4.3996
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-amazon-nova-pro-v1
    displayName: amazon-nova-pro-v1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - amazon-nova-pro-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.7989999999999999
        - meter: tokens.output
          unit: per_million
          amount: 3.1959999999999997
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-perceptron-perceptron-mk1
    displayName: perceptron-perceptron-mk1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - perceptron-perceptron-mk1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 1.5
    enabled: true

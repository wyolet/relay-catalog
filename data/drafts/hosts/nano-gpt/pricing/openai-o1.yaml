apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-openai-o1
    displayName: openai-o1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - openai-o1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 14.993999999999998
        - meter: tokens.output
          unit: per_million
          amount: 59.993
    enabled: true

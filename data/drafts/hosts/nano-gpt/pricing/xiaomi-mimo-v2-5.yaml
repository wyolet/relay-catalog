apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-xiaomi-mimo-v2-5
    displayName: xiaomi-mimo-v2-5 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - xiaomi-mimo-v2-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0028
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 0.28
    enabled: true

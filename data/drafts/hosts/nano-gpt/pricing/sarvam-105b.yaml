apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sarvam-105b
    displayName: sarvam-105b pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sarvam-105b
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.028
        - meter: tokens.input
          unit: per_million
          amount: 0.045
        - meter: tokens.output
          unit: per_million
          amount: 0.177
    enabled: true

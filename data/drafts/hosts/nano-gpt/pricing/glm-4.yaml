apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-glm-4
    displayName: glm-4 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - glm-4
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 14.994
        - meter: tokens.output
          unit: per_million
          amount: 14.994
    enabled: true

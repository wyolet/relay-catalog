apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sonar-deep-research
    displayName: sonar-deep-research pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sonar-deep-research
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.4
        - meter: tokens.output
          unit: per_million
          amount: 13.6
    enabled: true

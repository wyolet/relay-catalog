apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-ernie-5-1
    displayName: ernie-5-1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - ernie-5-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.75
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

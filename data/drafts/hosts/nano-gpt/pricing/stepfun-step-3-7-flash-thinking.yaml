apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-stepfun-step-3-7-flash-thinking
    displayName: stepfun-step-3-7-flash-thinking pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - stepfun-step-3-7-flash-thinking
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.04
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.15
    enabled: true

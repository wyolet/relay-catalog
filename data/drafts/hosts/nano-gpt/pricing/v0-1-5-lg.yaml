apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-v0-1-5-lg
    displayName: v0-1-5-lg pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - v0-1-5-lg
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 75
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-deepseek-chat-cheaper
    displayName: deepseek-chat-cheaper pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - deepseek-chat-cheaper
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.7
    enabled: true

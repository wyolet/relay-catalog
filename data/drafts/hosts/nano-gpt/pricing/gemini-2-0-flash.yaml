apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-gemini-2-0-flash
    displayName: gemini-2-0-flash pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - gemini-2-0-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1003
        - meter: tokens.output
          unit: per_million
          amount: 0.408
    enabled: true

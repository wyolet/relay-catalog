apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-amazon-nova-2-lite-v1
    displayName: amazon-nova-2-lite-v1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - amazon-nova-2-lite-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5099999999999999
        - meter: tokens.output
          unit: per_million
          amount: 4.25
    enabled: true

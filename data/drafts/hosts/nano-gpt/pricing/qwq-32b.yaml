apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-qwq-32b
    displayName: qwq-32b pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - qwq-32b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25599999
        - meter: tokens.output
          unit: per_million
          amount: 0.30499999
    enabled: true

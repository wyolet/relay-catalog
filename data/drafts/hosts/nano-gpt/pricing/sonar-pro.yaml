apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sonar-pro
    displayName: sonar-pro pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sonar-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.992
        - meter: tokens.output
          unit: per_million
          amount: 14.994
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-mistral-code-agent
    displayName: mistral-code-agent pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - mistral-code-agent
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

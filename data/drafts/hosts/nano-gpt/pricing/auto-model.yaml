apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-auto-model
    displayName: auto-model pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - auto-model
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

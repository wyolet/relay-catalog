apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-glm-z1-air
    displayName: glm-z1-air pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - glm-z1-air
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.07
        - meter: tokens.output
          unit: per_million
          amount: 0.07
    enabled: true

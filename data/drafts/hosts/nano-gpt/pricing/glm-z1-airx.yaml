apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-glm-z1-airx
    displayName: glm-z1-airx pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - glm-z1-airx
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.7
        - meter: tokens.output
          unit: per_million
          amount: 0.7
    enabled: true

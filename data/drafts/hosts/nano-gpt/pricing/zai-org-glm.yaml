apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-zai-org-glm
    displayName: zai-org-glm pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - zai-org-glm
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 2.6
    enabled: true

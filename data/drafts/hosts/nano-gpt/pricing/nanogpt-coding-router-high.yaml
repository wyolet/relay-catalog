apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-nanogpt-coding-router-high
    displayName: nanogpt-coding-router-high pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - nanogpt-coding-router-high
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.11
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 2.2
    enabled: true

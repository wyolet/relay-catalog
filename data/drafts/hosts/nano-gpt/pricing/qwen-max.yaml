apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-qwen-max
    displayName: qwen-max pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - qwen-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.5997
        - meter: tokens.output
          unit: per_million
          amount: 6.392
    enabled: true

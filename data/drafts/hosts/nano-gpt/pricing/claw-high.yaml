apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-claw-high
    displayName: claw-high pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - claw-high
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4.998
        - meter: tokens.output
          unit: per_million
          amount: 25.007
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-openai-gpt-5-4-pro
    displayName: openai-gpt-5-4-pro pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 3
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.output
          unit: per_million
          amount: 180
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sonar-reasoning-pro
    displayName: sonar-reasoning-pro pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sonar-reasoning-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.006
        - meter: tokens.output
          unit: per_million
          amount: 7.9985
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-tee-kimi-k2-6
    displayName: tee-kimi-k2-6 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - tee-kimi-k2-6
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.375
        - meter: tokens.input
          unit: per_million
          amount: 1.5
        - meter: tokens.output
          unit: per_million
          amount: 5.25
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-zai-org-glm-5-original
    displayName: zai-org-glm-5-original pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - zai-org-glm-5-original
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3.2
    enabled: true

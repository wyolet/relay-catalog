apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-azure-gpt-4-turbo
    displayName: azure-gpt-4-turbo pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - azure-gpt-4-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 9.996
        - meter: tokens.output
          unit: per_million
          amount: 30.005
    enabled: true

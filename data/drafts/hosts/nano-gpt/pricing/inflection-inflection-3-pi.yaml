apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-inflection-inflection-3-pi
    displayName: inflection-inflection-3-pi pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - inflection-inflection-3-pi
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.499
        - meter: tokens.output
          unit: per_million
          amount: 9.996
    enabled: true

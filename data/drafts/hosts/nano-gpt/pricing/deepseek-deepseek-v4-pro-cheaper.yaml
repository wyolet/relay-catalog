apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-deepseek-deepseek-v4-pro-cheaper
    displayName: deepseek-deepseek-v4-pro-cheaper pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v4-pro-cheaper
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.003625
        - meter: tokens.input
          unit: per_million
          amount: 0.435
        - meter: tokens.output
          unit: per_million
          amount: 0.87
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-step-2-mini
    displayName: step-2-mini pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - step-2-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2006
        - meter: tokens.output
          unit: per_million
          amount: 0.408
    enabled: true

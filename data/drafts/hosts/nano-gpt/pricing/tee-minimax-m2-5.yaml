apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-tee-minimax-m2-5
    displayName: tee-minimax-m2-5 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - tee-minimax-m2-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.38
    enabled: true

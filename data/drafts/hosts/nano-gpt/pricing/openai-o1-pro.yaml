apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-openai-o1-pro
    displayName: openai-o1-pro pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - openai-o1-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 150
        - meter: tokens.output
          unit: per_million
          amount: 600
    enabled: true

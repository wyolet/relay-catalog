apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-baichuan-m2
    displayName: baichuan-m2 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - baichuan-m2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15.73
        - meter: tokens.output
          unit: per_million
          amount: 15.73
    enabled: true

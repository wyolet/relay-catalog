apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-glm-4-flash
    displayName: glm-4-flash pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - glm-4-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1003
        - meter: tokens.output
          unit: per_million
          amount: 0.1003
    enabled: true

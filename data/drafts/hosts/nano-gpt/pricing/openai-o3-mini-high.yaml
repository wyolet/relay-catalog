apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-openai-o3-mini-high
    displayName: openai-o3-mini-high pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - openai-o3-mini-high
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.64
        - meter: tokens.output
          unit: per_million
          amount: 2.588
    enabled: true

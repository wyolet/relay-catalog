apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-jamba-large
    displayName: jamba-large pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - jamba-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.989
        - meter: tokens.output
          unit: per_million
          amount: 7.99
    enabled: true

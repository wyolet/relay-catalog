apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-azure-gpt-4o-mini
    displayName: azure-gpt-4o-mini pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - azure-gpt-4o-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1496
        - meter: tokens.output
          unit: per_million
          amount: 0.595
    enabled: true

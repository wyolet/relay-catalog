apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-azure-gpt-4o
    displayName: azure-gpt-4o pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - azure-gpt-4o
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.499
        - meter: tokens.output
          unit: per_million
          amount: 9.996
    enabled: true

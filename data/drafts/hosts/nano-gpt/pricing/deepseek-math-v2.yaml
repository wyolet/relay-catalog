apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-deepseek-math-v2
    displayName: deepseek-math-v2 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - deepseek-math-v2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.2
    enabled: true

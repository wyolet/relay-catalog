apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sonar
    displayName: sonar pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sonar
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.003
        - meter: tokens.output
          unit: per_million
          amount: 1.003
    enabled: true

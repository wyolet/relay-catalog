apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-yi-medium-200k
    displayName: yi-medium-200k pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - yi-medium-200k
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.499
        - meter: tokens.output
          unit: per_million
          amount: 2.499
    enabled: true

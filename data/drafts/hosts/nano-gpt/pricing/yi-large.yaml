apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-yi-large
    displayName: yi-large pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - yi-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.196
        - meter: tokens.output
          unit: per_million
          amount: 3.196
    enabled: true

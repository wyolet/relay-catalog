apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-openai-gpt-5-2
    displayName: openai-gpt-5-2 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

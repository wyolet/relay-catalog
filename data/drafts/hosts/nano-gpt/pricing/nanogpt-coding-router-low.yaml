apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-nanogpt-coding-router-low
    displayName: nanogpt-coding-router-low pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - nanogpt-coding-router-low
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.028
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 0.28
    enabled: true

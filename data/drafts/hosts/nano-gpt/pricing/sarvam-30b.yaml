apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-sarvam-30b
    displayName: sarvam-30b pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - sarvam-30b
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.017
        - meter: tokens.input
          unit: per_million
          amount: 0.028
        - meter: tokens.output
          unit: per_million
          amount: 0.111
    enabled: true

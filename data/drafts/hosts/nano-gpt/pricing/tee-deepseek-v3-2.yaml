apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-tee-deepseek-v3-2
    displayName: tee-deepseek-v3-2 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - tee-deepseek-v3-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

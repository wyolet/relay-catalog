apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-x-ai-grok
    displayName: x-ai-grok pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - x-ai-grok
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

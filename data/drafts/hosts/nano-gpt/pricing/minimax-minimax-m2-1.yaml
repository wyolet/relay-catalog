apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nano-gpt-minimax-minimax-m2-1
    displayName: minimax-minimax-m2-1 pricing
    owner:
        kind: host
        id: nano-gpt
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.33
        - meter: tokens.output
          unit: per_million
          amount: 1.32
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nearai-openai-gpt-5-mini
    displayName: openai-gpt-5-mini pricing
    owner:
        kind: host
        id: nearai
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.025
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

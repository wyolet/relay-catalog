apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nearai-openai-gpt-5-2
    displayName: openai-gpt-5-2 pricing
    owner:
        kind: host
        id: nearai
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.18
        - meter: tokens.input
          unit: per_million
          amount: 1.8
        - meter: tokens.output
          unit: per_million
          amount: 15.5
    enabled: true

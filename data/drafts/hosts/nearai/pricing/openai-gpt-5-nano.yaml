apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nearai-openai-gpt-5-nano
    displayName: openai-gpt-5-nano pricing
    owner:
        kind: host
        id: nearai
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-nano
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.005
        - meter: tokens.input
          unit: per_million
          amount: 0.05
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

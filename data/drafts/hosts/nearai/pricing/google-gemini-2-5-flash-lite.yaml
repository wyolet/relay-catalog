apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: nearai-google-gemini-2-5-flash-lite
    displayName: google-gemini-2-5-flash-lite pricing
    owner:
        kind: host
        id: nearai
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-flash-lite
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-kimi-k2-instruct
    displayName: kimi-k2-instruct pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - kimi-k2-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.551
        - meter: tokens.output
          unit: per_million
          amount: 2.646
    enabled: true

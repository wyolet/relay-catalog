apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-nova-pro-v1
    displayName: nova-pro-v1 pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - nova-pro-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.016
        - meter: tokens.output
          unit: per_million
          amount: 4.061
    enabled: true

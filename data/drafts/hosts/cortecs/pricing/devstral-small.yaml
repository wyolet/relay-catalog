apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-devstral-small
    displayName: devstral-small pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - devstral-small
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-claude-opus4-7
    displayName: claude-opus4-7 pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - claude-opus4-7
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 6.99
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.56
        - meter: tokens.input
          unit: per_million
          amount: 5.6
        - meter: tokens.output
          unit: per_million
          amount: 27.99
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-deepseek-r1
    displayName: deepseek-r1 pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.585
        - meter: tokens.output
          unit: per_million
          amount: 2.307
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: cortecs-intellect-3
    displayName: intellect-3 pricing
    owner:
        kind: host
        id: cortecs
spec:
    currency: USD
    targetModels:
        - intellect-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.219
        - meter: tokens.output
          unit: per_million
          amount: 1.202
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-3-sonnet
    displayName: claude-3-sonnet pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-3-sonnet
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

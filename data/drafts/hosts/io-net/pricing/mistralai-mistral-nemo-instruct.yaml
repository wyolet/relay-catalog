apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: io-net-mistralai-mistral-nemo-instruct
    displayName: mistralai-mistral-nemo-instruct pricing
    owner:
        kind: host
        id: io-net
spec:
    currency: USD
    targetModels:
        - mistralai-mistral-nemo-instruct
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.04
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.02
        - meter: tokens.output
          unit: per_million
          amount: 0.04
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: io-net-deepseek-ai-deepseek-r1
    displayName: deepseek-ai-deepseek-r1 pricing
    owner:
        kind: host
        id: io-net
spec:
    currency: USD
    targetModels:
        - deepseek-ai-deepseek-r1
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 4
        - meter: tokens.cache_read
          unit: per_million
          amount: 1
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 8.75
    enabled: true

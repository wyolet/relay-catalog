apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: io-net-moonshotai-kimi-k2-thinking
    displayName: moonshotai-kimi-k2-thinking pricing
    owner:
        kind: host
        id: io-net
spec:
    currency: USD
    targetModels:
        - moonshotai-kimi-k2-thinking
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.275
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 2.25
    enabled: true

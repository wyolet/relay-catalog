apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: io-net-openai-gpt-oss-120b
    displayName: openai-gpt-oss-120b pricing
    owner:
        kind: host
        id: io-net
spec:
    currency: USD
    targetModels:
        - openai-gpt-oss-120b
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.08
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.04
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

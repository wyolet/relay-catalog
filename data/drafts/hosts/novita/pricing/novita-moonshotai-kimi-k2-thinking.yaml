# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-novita-moonshotai-kimi-k2-thinking
    owner:
        kind: host
        id: novita
spec:
    currency: USD
    targetModels:
        - novita-moonshotai-kimi-k2-thinking
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.5

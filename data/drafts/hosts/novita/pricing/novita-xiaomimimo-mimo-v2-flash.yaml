# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-novita-xiaomimimo-mimo-v2-flash
    owner:
        kind: host
        id: novita
spec:
    currency: USD
    targetModels:
        - novita-xiaomimimo-mimo-v2-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.09999999999999999
        - meter: tokens.output
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-novita-minimaxai-minimax-m1-80k
    owner:
        kind: host
        id: novita
spec:
    currency: USD
    targetModels:
        - novita-minimaxai-minimax-m1-80k
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 2.2

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-openai-gpt-4o-mini
    displayName: openai-gpt-4o-mini pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - openai-gpt-4o-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.6
    enabled: true

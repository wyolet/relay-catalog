apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-qwen3-coder-flash
    displayName: qwen3-coder-flash pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - qwen3-coder-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.45
        - meter: tokens.output
          unit: per_million
          amount: 1.7
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-multi-qa-mpnet-base-dot-v1
    displayName: multi-qa-mpnet-base-dot-v1 pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - multi-qa-mpnet-base-dot-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.009
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

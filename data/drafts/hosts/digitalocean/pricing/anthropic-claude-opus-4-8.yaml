apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-anthropic-claude-opus-4-8
    displayName: anthropic-claude-opus-4-8 pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - anthropic-claude-opus-4-8
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 6.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 25
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-nemotron-3-nano-omni
    displayName: nemotron-3-nano-omni pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - nemotron-3-nano-omni
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 0.9
    enabled: true

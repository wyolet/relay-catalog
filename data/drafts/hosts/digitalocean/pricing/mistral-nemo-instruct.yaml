apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-mistral-nemo-instruct
    displayName: mistral-nemo-instruct pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - mistral-nemo-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

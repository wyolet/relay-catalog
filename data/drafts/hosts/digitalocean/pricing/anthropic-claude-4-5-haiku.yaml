apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-anthropic-claude-4-5-haiku
    displayName: anthropic-claude-4-5-haiku pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - anthropic-claude-4-5-haiku
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 1
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5
    enabled: true

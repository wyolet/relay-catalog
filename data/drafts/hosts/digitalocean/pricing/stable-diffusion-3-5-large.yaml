apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-stable-diffusion-3-5-large
    displayName: stable-diffusion-3-5-large pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - stable-diffusion-3-5-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.08
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-llama-4-maverick
    displayName: llama-4-maverick pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - llama-4-maverick
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.87
    enabled: true

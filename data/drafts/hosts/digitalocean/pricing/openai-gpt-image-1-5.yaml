apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-openai-gpt-image-1-5
    displayName: openai-gpt-image-1-5 pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - openai-gpt-image-1-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 1
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: digitalocean-arcee-trinity-large-thinking
    displayName: arcee-trinity-large-thinking pricing
    owner:
        kind: host
        id: digitalocean
spec:
    currency: USD
    targetModels:
        - arcee-trinity-large-thinking
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.9
    enabled: true

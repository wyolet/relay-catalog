apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: github-copilot-raptor-mini
    displayName: raptor-mini pricing
    owner:
        kind: host
        id: github-copilot
spec:
    currency: USD
    targetModels:
        - raptor-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.025
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

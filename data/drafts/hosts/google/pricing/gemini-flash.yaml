apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-flash
    displayName: gemini-flash pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-flash
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

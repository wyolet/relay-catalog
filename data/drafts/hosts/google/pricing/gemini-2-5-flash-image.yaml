apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-2-5-flash-image
    displayName: gemini-2-5-flash-image pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-2-5-flash-image
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

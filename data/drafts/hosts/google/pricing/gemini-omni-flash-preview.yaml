apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-omni-flash-preview
    displayName: gemini-omni-flash-preview pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-omni-flash-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.5
        - meter: tokens.output
          unit: per_million
          amount: 17.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-3-pro-preview
    displayName: gemini-3-pro-preview pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-3-pro-preview
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 200000
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.input
          unit: per_million
          amount: 4
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 12
        - meter: tokens.output
          unit: per_million
          amount: 18
          aboveTokens: 200000
    enabled: true

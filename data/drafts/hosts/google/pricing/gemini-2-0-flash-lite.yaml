apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-2-0-flash-lite
    displayName: gemini-2-0-flash-lite pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-2-0-flash-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.075
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

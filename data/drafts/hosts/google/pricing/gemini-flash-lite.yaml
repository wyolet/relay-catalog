apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-flash-lite
    displayName: gemini-flash-lite pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-flash-lite
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.025
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: deepinfra-deepinfra-deepseek-ai-deepseek-r1-turbo
    owner:
        kind: host
        id: deepinfra
spec:
    currency: USD
    targetModels:
        - deepinfra-deepseek-ai-deepseek-r1-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3

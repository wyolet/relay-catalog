# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: deepinfra-deepinfra-google-gemini-2-5-flash
    owner:
        kind: host
        id: deepinfra
spec:
    currency: USD
    targetModels:
        - deepinfra-google-gemini-2-5-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5

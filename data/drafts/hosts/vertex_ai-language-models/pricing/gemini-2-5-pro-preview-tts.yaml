apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vertex_ai-language-models-gemini-2-5-pro-preview-tts
    owner:
        kind: host
        id: vertex_ai-language-models
spec:
    currency: USD
    targetModels:
        - gemini-2-5-pro-preview-tts
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 2.5
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 15
          aboveTokens: 200000

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vertex_ai-language-models-gemini-2-5-flash-lite
    owner:
        kind: host
        id: vertex_ai-language-models
spec:
    currency: USD
    targetModels:
        - gemini-2-5-flash-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.09999999999999999
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.reasoning
          unit: per_million
          amount: 0.39999999999999997

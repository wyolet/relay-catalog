# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vertex_ai-language-models-gemini-2-5-flash-preview-09-2025
    owner:
        kind: host
        id: vertex_ai-language-models
spec:
    currency: USD
    targetModels:
        - gemini-2-5-flash-preview-09-2025
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.reasoning
          unit: per_million
          amount: 2.5

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-deepseek-deepseek-chat
    displayName: deepseek-deepseek-chat pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-chat
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2002
        - meter: tokens.output
          unit: per_million
          amount: 0.8001
    enabled: true

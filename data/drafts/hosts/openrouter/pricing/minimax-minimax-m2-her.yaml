apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-minimax-minimax-m2-her
    displayName: minimax-minimax-m2-her pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-her
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-relace-relace-search
    displayName: relace-relace-search pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - relace-relace-search
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

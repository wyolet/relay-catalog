apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-inclusionai-ling-2-6-flash
    displayName: inclusionai-ling-2-6-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - inclusionai-ling-2-6-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.002
        - meter: tokens.input
          unit: per_million
          amount: 0.01
        - meter: tokens.output
          unit: per_million
          amount: 0.03
    enabled: true

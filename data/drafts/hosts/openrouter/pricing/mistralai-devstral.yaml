apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-mistralai-devstral
    displayName: mistralai-devstral pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - mistralai-devstral
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.04
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

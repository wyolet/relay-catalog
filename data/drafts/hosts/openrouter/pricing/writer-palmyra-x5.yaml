apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-writer-palmyra-x5
    displayName: writer-palmyra-x5 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - writer-palmyra-x5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 6
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: openrouter-openrouter-qwen-qwen-vl-plus
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter-qwen-qwen-vl-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 0.63

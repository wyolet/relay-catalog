apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-perplexity-sonar-pro
    displayName: perplexity-sonar-pro pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - perplexity-sonar-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

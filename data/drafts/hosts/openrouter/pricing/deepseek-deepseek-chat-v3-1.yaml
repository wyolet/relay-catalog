apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-deepseek-deepseek-chat-v3-1
    displayName: deepseek-deepseek-chat-v3-1 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-chat-v3-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.13
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 0.79
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen3-coder-next
    displayName: qwen-qwen3-coder-next pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-coder-next
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.07
        - meter: tokens.input
          unit: per_million
          amount: 0.11
        - meter: tokens.output
          unit: per_million
          amount: 0.8
    enabled: true

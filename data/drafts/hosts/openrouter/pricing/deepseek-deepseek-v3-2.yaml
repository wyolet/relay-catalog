apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-deepseek-deepseek-v3-2
    displayName: deepseek-deepseek-v3-2 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2288
        - meter: tokens.output
          unit: per_million
          amount: 0.3432
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-z-ai-glm-5
    displayName: z-ai-glm-5 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - z-ai-glm-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.12
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 1.92
    enabled: true

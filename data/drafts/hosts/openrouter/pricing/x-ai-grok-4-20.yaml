apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-x-ai-grok-4-20
    displayName: x-ai-grok-4-20 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - x-ai-grok-4-20
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-arcee-ai-virtuoso-large
    displayName: arcee-ai-virtuoso-large pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - arcee-ai-virtuoso-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

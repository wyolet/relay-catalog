apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-google-gemini-3-pro-image-preview
    displayName: google-gemini-3-pro-image-preview pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - google-gemini-3-pro-image-preview
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 12
        - meter: tokens.reasoning
          unit: per_million
          amount: 12
    enabled: true

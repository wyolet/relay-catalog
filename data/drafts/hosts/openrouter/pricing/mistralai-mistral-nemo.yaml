apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-mistralai-mistral-nemo
    displayName: mistralai-mistral-nemo pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - mistralai-mistral-nemo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.02
        - meter: tokens.output
          unit: per_million
          amount: 0.03
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openai-gpt-5-5-pro
    displayName: openai-gpt-5-5-pro pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-5-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.output
          unit: per_million
          amount: 180
    enabled: true

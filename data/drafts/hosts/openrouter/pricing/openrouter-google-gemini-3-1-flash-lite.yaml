# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openrouter-google-gemini-3-1-flash-lite
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter-google-gemini-3-1-flash-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 1.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.024999999999999998
        - meter: tokens.reasoning
          unit: per_million
          amount: 1.5

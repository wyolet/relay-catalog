apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-anthropic-claude-sonnet-4
    displayName: anthropic-claude-sonnet-4 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - anthropic-claude-sonnet-4
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.75
        - meter: tokens.cache_creation
          unit: per_million
          amount: 7.5
          aboveTokens: 200000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.6
          aboveTokens: 200000
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.input
          unit: per_million
          amount: 6
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 22.5
          aboveTokens: 200000
    enabled: true

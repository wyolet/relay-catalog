apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-minimax-minimax-m1
    displayName: minimax-minimax-m1 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2.2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-z-ai-glm-5v-turbo
    displayName: z-ai-glm-5v-turbo pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - z-ai-glm-5v-turbo
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.24
        - meter: tokens.input
          unit: per_million
          amount: 1.2
        - meter: tokens.output
          unit: per_million
          amount: 4
    enabled: true

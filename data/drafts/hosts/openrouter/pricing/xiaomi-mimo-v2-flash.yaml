apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-xiaomi-mimo-v2-flash
    displayName: xiaomi-mimo-v2-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - xiaomi-mimo-v2-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

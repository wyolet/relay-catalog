apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-cohere-command-r-08
    displayName: cohere-command-r-08 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - cohere-command-r-08
    rates:

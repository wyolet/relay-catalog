apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-thedrummer-rocinante-12b
    displayName: thedrummer-rocinante-12b pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - thedrummer-rocinante-12b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-minimax-minimax-m2-5
    displayName: minimax-minimax-m2-5 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 1.15
    enabled: true

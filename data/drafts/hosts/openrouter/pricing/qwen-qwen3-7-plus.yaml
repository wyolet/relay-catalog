apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen3-7-plus
    displayName: qwen-qwen3-7-plus pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-7-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.08
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 1.6
    enabled: true

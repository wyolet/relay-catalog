apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-bytedance-seed-seed-2-0-mini
    displayName: bytedance-seed-seed-2-0-mini pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - bytedance-seed-seed-2-0-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

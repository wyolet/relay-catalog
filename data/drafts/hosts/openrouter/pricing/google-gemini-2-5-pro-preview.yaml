apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-google-gemini-2-5-pro-preview
    displayName: google-gemini-2-5-pro-preview pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-pro-preview
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.reasoning
          unit: per_million
          amount: 10
    enabled: true

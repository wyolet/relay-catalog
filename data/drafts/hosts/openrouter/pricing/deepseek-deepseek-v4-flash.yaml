apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-deepseek-deepseek-v4-flash
    displayName: deepseek-deepseek-v4-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v4-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0197
        - meter: tokens.input
          unit: per_million
          amount: 0.0983
        - meter: tokens.output
          unit: per_million
          amount: 0.1966
    enabled: true

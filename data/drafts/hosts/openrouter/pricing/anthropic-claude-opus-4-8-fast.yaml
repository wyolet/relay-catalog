apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-anthropic-claude-opus-4-8-fast
    displayName: anthropic-claude-opus-4-8-fast pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - anthropic-claude-opus-4-8-fast
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 12.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 1
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 50
    enabled: true

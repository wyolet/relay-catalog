apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen3-coder-plus
    displayName: qwen-qwen3-coder-plus pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-coder-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.8125
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.13
        - meter: tokens.input
          unit: per_million
          amount: 0.65
        - meter: tokens.output
          unit: per_million
          amount: 3.25
    enabled: true

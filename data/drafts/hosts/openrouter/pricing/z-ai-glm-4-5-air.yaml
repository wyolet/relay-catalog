apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-z-ai-glm-4-5-air
    displayName: z-ai-glm-4-5-air pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - z-ai-glm-4-5-air
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.125
        - meter: tokens.output
          unit: per_million
          amount: 0.85
    enabled: true

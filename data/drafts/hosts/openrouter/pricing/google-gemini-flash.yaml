apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-google-gemini-flash
    displayName: google-gemini-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - google-gemini-flash
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.083333
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 1.5
        - meter: tokens.output
          unit: per_million
          amount: 9
        - meter: tokens.reasoning
          unit: per_million
          amount: 9
    enabled: true

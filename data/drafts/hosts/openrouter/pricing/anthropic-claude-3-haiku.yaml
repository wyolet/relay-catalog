apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-anthropic-claude-3-haiku
    displayName: anthropic-claude-3-haiku pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - anthropic-claude-3-haiku
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 1.25
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openrouter-openai-gpt-4-1
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter-openai-gpt-4-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 8
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5

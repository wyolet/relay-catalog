# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openrouter-mancer-weaver
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter-mancer-weaver
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 5.625
        - meter: tokens.output
          unit: per_million
          amount: 5.625

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-stepfun-step-3-7-flash
    displayName: stepfun-step-3-7-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - stepfun-step-3-7-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.04
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.15
    enabled: true

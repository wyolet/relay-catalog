apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-x-ai-grok-build-0-1
    displayName: x-ai-grok-build-0-1 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - x-ai-grok-build-0-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

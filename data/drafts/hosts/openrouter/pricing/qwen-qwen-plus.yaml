apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen-plus
    displayName: qwen-qwen-plus pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.325
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.052
        - meter: tokens.input
          unit: per_million
          amount: 0.26
        - meter: tokens.output
          unit: per_million
          amount: 0.78
    enabled: true

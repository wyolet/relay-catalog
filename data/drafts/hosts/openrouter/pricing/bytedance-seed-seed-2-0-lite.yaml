apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-bytedance-seed-seed-2-0-lite
    displayName: bytedance-seed-seed-2-0-lite pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - bytedance-seed-seed-2-0-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

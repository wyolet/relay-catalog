apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-tencent-hy3-preview
    displayName: tencent-hy3-preview pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - tencent-hy3-preview
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.021
        - meter: tokens.input
          unit: per_million
          amount: 0.063
        - meter: tokens.output
          unit: per_million
          amount: 0.21
    enabled: true

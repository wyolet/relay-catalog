apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-rekaai-reka-edge
    displayName: rekaai-reka-edge pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - rekaai-reka-edge
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.1
    enabled: true

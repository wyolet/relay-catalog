apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-aion-labs-aion-2-0
    displayName: aion-labs-aion-2-0 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - aion-labs-aion-2-0
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 0.8
        - meter: tokens.output
          unit: per_million
          amount: 1.6
    enabled: true

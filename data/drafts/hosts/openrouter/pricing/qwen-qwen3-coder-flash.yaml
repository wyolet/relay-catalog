apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen3-coder-flash
    displayName: qwen-qwen3-coder-flash pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-coder-flash
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.24375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.039
        - meter: tokens.input
          unit: per_million
          amount: 0.195
        - meter: tokens.output
          unit: per_million
          amount: 0.975
    enabled: true

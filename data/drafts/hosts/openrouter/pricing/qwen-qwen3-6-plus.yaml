apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-qwen-qwen3-6-plus
    displayName: qwen-qwen3-6-plus pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-6-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.40625
        - meter: tokens.input
          unit: per_million
          amount: 0.325
        - meter: tokens.output
          unit: per_million
          amount: 1.95
    enabled: true

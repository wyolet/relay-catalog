apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openai-gpt-5-4-image-2
    displayName: openai-gpt-5-4-image-2 pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4-image-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 2
        - meter: tokens.input
          unit: per_million
          amount: 8
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

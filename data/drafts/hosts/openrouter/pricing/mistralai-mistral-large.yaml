apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-mistralai-mistral-large
    displayName: mistralai-mistral-large pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - mistralai-mistral-large
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 6
    enabled: true

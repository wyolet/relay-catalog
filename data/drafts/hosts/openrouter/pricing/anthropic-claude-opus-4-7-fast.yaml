apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-anthropic-claude-opus-4-7-fast
    displayName: anthropic-claude-opus-4-7-fast pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - anthropic-claude-opus-4-7-fast
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 37.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 3
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.output
          unit: per_million
          amount: 150
    enabled: true

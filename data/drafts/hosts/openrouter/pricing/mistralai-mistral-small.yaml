apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-mistralai-mistral-small
    displayName: mistralai-mistral-small pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - mistralai-mistral-small
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.6
    enabled: true

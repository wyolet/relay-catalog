# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openrouter-openai-gpt-5-nano
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter-openai-gpt-5-nano
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.049999999999999996
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.005

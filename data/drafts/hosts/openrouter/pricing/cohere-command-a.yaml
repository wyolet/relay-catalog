apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-cohere-command-a
    displayName: cohere-command-a pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - cohere-command-a
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openrouter-openai-o4-mini
    displayName: openai-o4-mini pricing
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openai-o4-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.275
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.4
    enabled: true

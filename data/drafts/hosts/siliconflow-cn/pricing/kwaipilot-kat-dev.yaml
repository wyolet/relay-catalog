apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: siliconflow-cn-kwaipilot-kat-dev
    displayName: kwaipilot-kat-dev pricing
    owner:
        kind: host
        id: siliconflow-cn
spec:
    currency: USD
    targetModels:
        - kwaipilot-kat-dev
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 0.6
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-qwen-mt-plus
    displayName: qwen-mt-plus pricing
    owner:
        kind: host
        id: alibaba
spec:
    currency: USD
    targetModels:
        - qwen-mt-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.46
        - meter: tokens.output
          unit: per_million
          amount: 7.37
    enabled: true

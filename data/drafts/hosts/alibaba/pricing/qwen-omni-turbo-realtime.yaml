apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-qwen-omni-turbo-realtime
    displayName: qwen-omni-turbo-realtime pricing
    owner:
        kind: host
        id: alibaba
spec:
    currency: USD
    targetModels:
        - qwen-omni-turbo-realtime
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 4.44
        - meter: tokens.audio_output
          unit: per_million
          amount: 8.89
        - meter: tokens.input
          unit: per_million
          amount: 0.27
        - meter: tokens.output
          unit: per_million
          amount: 1.07
    enabled: true

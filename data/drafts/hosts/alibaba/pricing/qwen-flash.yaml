apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-qwen-flash
    displayName: qwen-flash pricing
    owner:
        kind: host
        id: alibaba
spec:
    currency: USD
    targetModels:
        - qwen-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.05
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-openai-gpt-5-1-chat
    displayName: openai-gpt-5-1-chat pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-1-chat
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

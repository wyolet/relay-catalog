apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-openai-gpt-4-turbo
    displayName: openai-gpt-4-turbo pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

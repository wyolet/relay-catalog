apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-qwen-qwen3-max
    displayName: qwen-qwen3-max pricing
    owner:
        kind: host
        id: orcarouter
spec:

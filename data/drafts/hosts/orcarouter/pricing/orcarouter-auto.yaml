apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-orcarouter-auto
    displayName: orcarouter-auto pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - orcarouter-auto
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

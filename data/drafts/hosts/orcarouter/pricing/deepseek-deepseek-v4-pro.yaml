apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-deepseek-deepseek-v4-pro
    displayName: deepseek-deepseek-v4-pro pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v4-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.003625
        - meter: tokens.input
          unit: per_million
          amount: 0.56
        - meter: tokens.output
          unit: per_million
          amount: 1.12
    enabled: true

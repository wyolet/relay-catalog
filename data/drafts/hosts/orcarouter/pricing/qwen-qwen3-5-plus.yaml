apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-qwen-qwen3-5-plus
    displayName: qwen-qwen3-5-plus pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-5-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.115
        - meter: tokens.output
          unit: per_million
          amount: 0.688

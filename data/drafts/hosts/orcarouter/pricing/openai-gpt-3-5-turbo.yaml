apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-openai-gpt-3-5-turbo
    displayName: openai-gpt-3-5-turbo pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - openai-gpt-3-5-turbo
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 1.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: orcarouter-deepseek-deepseek-v4-flash
    displayName: deepseek-deepseek-v4-flash pricing
    owner:
        kind: host
        id: orcarouter
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v4-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0028
        - meter: tokens.input
          unit: per_million
          amount: 0.19
        - meter: tokens.output
          unit: per_million
          amount: 0.37
    enabled: true

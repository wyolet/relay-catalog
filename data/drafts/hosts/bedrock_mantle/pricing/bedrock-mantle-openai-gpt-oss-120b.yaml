# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_mantle-bedrock-mantle-openai-gpt-oss-120b
    owner:
        kind: host
        id: bedrock_mantle
spec:
    currency: USD
    targetModels:
        - bedrock-mantle-openai-gpt-oss-120b
    rates:
        - meter: tokens.input

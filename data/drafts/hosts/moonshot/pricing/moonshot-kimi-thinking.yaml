# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: moonshot-moonshot-kimi-thinking
    owner:
        kind: host
        id: moonshot
spec:
    currency: USD
    targetModels:
        - moonshot-kimi-thinking
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

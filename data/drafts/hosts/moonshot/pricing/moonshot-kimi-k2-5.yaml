# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: moonshot-moonshot-kimi-k2-5
    owner:
        kind: host
        id: moonshot
spec:
    currency: USD
    targetModels:
        - moonshot-kimi-k2-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.09999999999999999

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: moonshot-moonshot-kimi-latest-32k
    owner:
        kind: host
        id: moonshot
spec:
    currency: USD
    targetModels:
        - moonshot-kimi-latest-32k
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: qihang-ai-gpt-5-2-codex
    displayName: gpt-5-2-codex pricing
    owner:
        kind: host
        id: qihang-ai
spec:
    currency: USD
    targetModels:
        - gpt-5-2-codex
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 1.14
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: qihang-ai-gemini-3-pro-preview
    displayName: gemini-3-pro-preview pricing
    owner:
        kind: host
        id: qihang-ai
spec:
    currency: USD
    targetModels:
        - gemini-3-pro-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.57
        - meter: tokens.output
          unit: per_million
          amount: 3.43
    enabled: true

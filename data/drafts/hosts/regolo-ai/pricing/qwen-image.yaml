apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: regolo-ai-qwen-image
    displayName: qwen-image pricing
    owner:
        kind: host
        id: regolo-ai
spec:
    currency: USD
    targetModels:
        - qwen-image
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

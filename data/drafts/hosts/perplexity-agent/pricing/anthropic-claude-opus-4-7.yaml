apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-agent-anthropic-claude-opus-4-7
    displayName: anthropic-claude-opus-4-7 pricing
    owner:
        kind: host
        id: perplexity-agent
spec:
    currency: USD
    targetModels:
        - anthropic-claude-opus-4-7
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million

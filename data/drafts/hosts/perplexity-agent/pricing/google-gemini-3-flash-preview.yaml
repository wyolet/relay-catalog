apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-agent-google-gemini-3-flash-preview
    displayName: google-gemini-3-flash-preview pricing
    owner:
        kind: host
        id: perplexity-agent
spec:
    currency: USD
    targetModels:
        - google-gemini-3-flash-preview
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
          aboveTokens: 200000
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 0.5
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 3
          aboveTokens: 200000
    enabled: true

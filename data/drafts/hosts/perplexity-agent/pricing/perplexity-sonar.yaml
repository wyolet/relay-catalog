apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-agent-perplexity-sonar
    displayName: perplexity-sonar pricing
    owner:
        kind: host
        id: perplexity-agent
spec:
    currency: USD
    targetModels:
        - perplexity-sonar
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0625
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

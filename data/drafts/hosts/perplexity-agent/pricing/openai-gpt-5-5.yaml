apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-agent-openai-gpt-5-5
    displayName: openai-gpt-5-5 pricing
    owner:
        kind: host
        id: perplexity-agent
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

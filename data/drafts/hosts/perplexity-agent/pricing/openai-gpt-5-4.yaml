apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-agent-openai-gpt-5-4
    displayName: openai-gpt-5-4 pricing
    owner:
        kind: host
        id: perplexity-agent
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-4
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.25
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

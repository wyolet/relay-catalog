apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zhipuai-glm-4-5-air
    displayName: glm-4-5-air pricing
    owner:
        kind: host
        id: zhipuai
spec:
    currency: USD
    targetModels:
        - glm-4-5-air
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

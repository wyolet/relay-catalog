apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zhipuai-glm-5v-turbo
    displayName: glm-5v-turbo pricing
    owner:
        kind: host
        id: zhipuai
spec:
    currency: USD
    targetModels:
        - glm-5v-turbo
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.2
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 22
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: 302ai-gpt-5-thinking
    displayName: gpt-5-thinking pricing
    owner:
        kind: host
        id: 302ai
spec:
    currency: USD
    targetModels:
        - gpt-5-thinking
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

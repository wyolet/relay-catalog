apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: 302ai-gemini-2-5-flash-image
    displayName: gemini-2-5-flash-image pricing
    owner:
        kind: host
        id: 302ai
spec:
    currency: USD
    targetModels:
        - gemini-2-5-flash-image
    rates:

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwq-plus
    displayName: qwq-plus pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwq-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.23
        - meter: tokens.output
          unit: per_million
          amount: 0.574
    enabled: true

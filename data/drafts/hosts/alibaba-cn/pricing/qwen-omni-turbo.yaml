apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen-omni-turbo
    displayName: qwen-omni-turbo pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen-omni-turbo
    rates:
        - meter: tokens.audio_input
          unit: per_million
          amount: 3.584
        - meter: tokens.audio_output
          unit: per_million
          amount: 7.168
        - meter: tokens.input
          unit: per_million
          amount: 0.058
        - meter: tokens.output
          unit: per_million
          amount: 0.23
    enabled: true

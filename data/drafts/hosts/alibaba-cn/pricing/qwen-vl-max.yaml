apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen-vl-max
    displayName: qwen-vl-max pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen-vl-max
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.23
        - meter: tokens.output
          unit: per_million
          amount: 0.574
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen-plus
    displayName: qwen-plus pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.115
        - meter: tokens.output
          unit: per_million
          amount: 0.287
        - meter: tokens.reasoning
          unit: per_million
          amount: 1.147
    enabled: true

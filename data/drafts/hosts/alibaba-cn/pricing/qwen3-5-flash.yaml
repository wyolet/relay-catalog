apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen3-5-flash
    displayName: qwen3-5-flash pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen3-5-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.172
        - meter: tokens.output
          unit: per_million
          amount: 1.72
        - meter: tokens.reasoning
          unit: per_million
          amount: 1.72
    enabled: true

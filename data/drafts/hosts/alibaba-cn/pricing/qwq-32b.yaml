apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwq-32b
    displayName: qwq-32b pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwq-32b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.287
        - meter: tokens.output
          unit: per_million
          amount: 0.861
    enabled: true

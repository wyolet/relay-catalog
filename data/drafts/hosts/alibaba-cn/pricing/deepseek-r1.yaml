apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-deepseek-r1
    displayName: deepseek-r1 pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.574
        - meter: tokens.output
          unit: per_million
          amount: 2.294
    enabled: true

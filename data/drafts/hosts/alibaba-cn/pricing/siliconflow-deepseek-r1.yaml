apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-siliconflow-deepseek-r1
    displayName: siliconflow-deepseek-r1 pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - siliconflow-deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 2.18
    enabled: true

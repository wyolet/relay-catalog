        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen3-7-plus
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.625
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2.5
          aboveTokens: 128000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
          aboveTokens: 128000
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 2
          aboveTokens: 128000
        - meter: tokens.output
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 6
          aboveTokens: 128000
    enabled: true

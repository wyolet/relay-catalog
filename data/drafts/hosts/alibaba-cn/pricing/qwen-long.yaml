apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen-long
    displayName: qwen-long pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen-long
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.072
        - meter: tokens.output
          unit: per_million
          amount: 0.287
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-deepseek-v3-2-exp
    displayName: deepseek-v3-2-exp pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - deepseek-v3-2-exp
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.287
        - meter: tokens.output
          unit: per_million
          amount: 0.431
    enabled: true

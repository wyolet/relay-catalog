apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-cn-qwen-math-turbo
    displayName: qwen-math-turbo pricing
    owner:
        kind: host
        id: alibaba-cn
spec:
    currency: USD
    targetModels:
        - qwen-math-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.287
        - meter: tokens.output
          unit: per_million
          amount: 0.861
    enabled: true

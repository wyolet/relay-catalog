# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: HostBinding
metadata:
    name: gemini-3-8-flash-on-google-vertex
    displayName: "Gemini 3.8 Flash via google-vertex"
spec:
    model: gemini-3-8-flash
    host: google-vertex
    adapter: vertex_gemini
    pricing: google-vertex-gemini-3-8-flash
    snapshots: [gemini-3-8-flash]

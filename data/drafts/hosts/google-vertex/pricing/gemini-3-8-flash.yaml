# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-vertex-gemini-3-8-flash
    displayName: Gemini 3.8 Flash pricing
    description: "Standard pay-as-you-go on the global endpoint; non-global endpoints bill 10% more. Promotional rate through 2026-12-31, applied as 50% credits on net spend; 1.50/7.50/0.15 from 2027-01-01. Source: https://cloud.google.com/model-garden/pricing, read 2026-11-24."
    owner:
        kind: host
        id: google-vertex
spec:
    currency: USD
    targetModels:
        - gemini-3-8-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 3.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-vertex-muse-spark-1-3
    displayName: Muse Spark 1.3 pricing
    description: "Global endpoint, the only one listed. Source: https://cloud.google.com/model-garden/partner-models/pricing, read 2026-11-24."
    owner:
        kind: host
        id: google-vertex
spec:
    currency: USD
    targetModels:
        - muse-spark-1-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 4.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

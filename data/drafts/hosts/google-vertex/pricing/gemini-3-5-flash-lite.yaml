# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-vertex-gemini-3-5-flash-lite
    displayName: Gemini 3.5 Flash Lite pricing
    description: "Standard pay-as-you-go on the global endpoint; non-global endpoints bill 10% more. Source: https://cloud.google.com/model-garden/pricing, read 2026-11-24."
    owner:
        kind: host
        id: google-vertex
spec:
    currency: USD
    targetModels:
        - gemini-3-5-flash-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

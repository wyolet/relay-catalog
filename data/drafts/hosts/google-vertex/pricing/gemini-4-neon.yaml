# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-vertex-gemini-4-neon
    displayName: Gemini 4 Neon pricing
    description: "Standard pay-as-you-go on the global endpoint; non-global endpoints bill 10% more. Cache writes are not billed until 2027-01-12 (3.75 from then). Source: https://cloud.google.com/model-garden/pricing, read 2026-11-24."
    owner:
        kind: host
        id: google-vertex
spec:
    currency: USD
    targetModels:
        - gemini-4-neon
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

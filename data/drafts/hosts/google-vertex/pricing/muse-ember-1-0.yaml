# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-vertex-muse-ember-1-0
    displayName: Muse Ember 1.0 pricing
    description: "Global endpoint, the only one listed. Requests over 200K input tokens bill every token at the long-context rate. Source: https://cloud.google.com/model-garden/partner-models/pricing, read 2026-11-24."
    owner:
        kind: host
        id: google-vertex
spec:
    currency: USD
    targetModels:
        - muse-ember-1-0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.004
        - meter: tokens.input
          unit: per_million
          amount: 0.3
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 1.5
          aboveTokens: 200000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.012
          aboveTokens: 200000

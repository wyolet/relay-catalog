apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: neuralwatt-minimaxai-minimax-m2-5
    displayName: minimaxai-minimax-m2-5 pricing
    owner:
        kind: host
        id: neuralwatt
spec:
    currency: USD
    targetModels:
        - minimaxai-minimax-m2-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.35
        - meter: tokens.output
          unit: per_million
          amount: 1.38

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: neuralwatt-kimi-k2-6-fast
    displayName: kimi-k2-6-fast pricing
    owner:
        kind: host
        id: neuralwatt
spec:
    currency: USD
    targetModels:
        - kimi-k2-6-fast
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.69
        - meter: tokens.output
          unit: per_million
          amount: 3.22
    enabled: true

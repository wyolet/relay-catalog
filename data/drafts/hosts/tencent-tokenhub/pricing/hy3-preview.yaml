apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: tencent-tokenhub-hy3-preview
    displayName: hy3-preview pricing
    owner:
        kind: host
        id: tencent-tokenhub
spec:
    currency: USD
    targetModels:
        - hy3-preview
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

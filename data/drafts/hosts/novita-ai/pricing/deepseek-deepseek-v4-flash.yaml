apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-deepseek-deepseek-v4-flash
    displayName: deepseek-deepseek-v4-flash pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v4-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.028
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 0.28
    enabled: true

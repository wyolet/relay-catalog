apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-deepseek-deepseek-ocr
    displayName: deepseek-deepseek-ocr pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-ocr
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.03
        - meter: tokens.output
          unit: per_million
          amount: 0.03
    enabled: true

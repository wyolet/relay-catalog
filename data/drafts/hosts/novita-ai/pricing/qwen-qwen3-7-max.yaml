apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-qwen-qwen3-7-max
    displayName: qwen-qwen3-7-max pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-7-max
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.5625
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 3.75
    enabled: true

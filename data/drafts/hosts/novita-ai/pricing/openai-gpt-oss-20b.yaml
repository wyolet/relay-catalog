apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-openai-gpt-oss-20b
    displayName: openai-gpt-oss-20b pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - openai-gpt-oss-20b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.04
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

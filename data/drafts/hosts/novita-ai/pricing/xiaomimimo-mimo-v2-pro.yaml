apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-xiaomimimo-mimo-v2-pro
    displayName: xiaomimimo-mimo-v2-pro pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - xiaomimimo-mimo-v2-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 256000
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.input
          unit: per_million
          amount: 2
          aboveTokens: 256000
        - meter: tokens.output
          unit: per_million
          amount: 6
        - meter: tokens.output
          unit: per_million
          amount: 6
          aboveTokens: 256000
    enabled: true

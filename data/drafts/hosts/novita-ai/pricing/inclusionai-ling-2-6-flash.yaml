apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-inclusionai-ling-2-6-flash
    displayName: inclusionai-ling-2-6-flash pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - inclusionai-ling-2-6-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

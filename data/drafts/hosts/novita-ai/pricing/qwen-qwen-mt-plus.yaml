apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-qwen-qwen-mt-plus
    displayName: qwen-qwen-mt-plus pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - qwen-qwen-mt-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.75
    enabled: true

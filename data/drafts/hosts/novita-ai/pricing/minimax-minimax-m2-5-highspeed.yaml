apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-minimax-minimax-m2-5-highspeed
    displayName: minimax-minimax-m2-5-highspeed pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-5-highspeed
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.4
    enabled: true

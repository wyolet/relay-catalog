apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-deepseek-deepseek-v3-2
    displayName: deepseek-deepseek-v3-2 pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.1345
        - meter: tokens.input
          unit: per_million
          amount: 0.269
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-deepseek-deepseek-v3-turbo
    displayName: deepseek-deepseek-v3-turbo pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 1.3
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-ai-minimax-minimax-m2-7
    displayName: minimax-minimax-m2-7 pricing
    owner:
        kind: host
        id: novita-ai
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-7
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

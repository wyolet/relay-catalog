apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-mistralai-pixtral-large
    displayName: mistralai-pixtral-large pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - mistralai-pixtral-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 6
    enabled: true

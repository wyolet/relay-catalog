apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-deepseek-deepseek-chat
    displayName: deepseek-deepseek-chat pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-chat
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 0.32
        - meter: tokens.output
          unit: per_million
          amount: 0.89
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-essentialai-rnj-1-instruct
    displayName: essentialai-rnj-1-instruct pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - essentialai-rnj-1-instruct
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-aion-labs-aion-1-0-mini
    displayName: aion-labs-aion-1-0-mini pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - aion-labs-aion-1-0-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.7
        - meter: tokens.output
          unit: per_million
          amount: 1.4
    enabled: true

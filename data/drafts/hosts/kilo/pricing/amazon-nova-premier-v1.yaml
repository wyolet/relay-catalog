apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-amazon-nova-premier-v1
    displayName: amazon-nova-premier-v1 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - amazon-nova-premier-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 12.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-z-ai-glm-5
    displayName: z-ai-glm-5 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - z-ai-glm-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.72
        - meter: tokens.output
          unit: per_million
          amount: 2.3
    enabled: true

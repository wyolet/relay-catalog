apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-relace-relace-apply-3
    displayName: relace-relace-apply-3 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - relace-relace-apply-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.85
        - meter: tokens.output
          unit: per_million
          amount: 1.25
    enabled: true

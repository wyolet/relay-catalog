apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-kilo-auto-free
    displayName: kilo-auto-free pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - kilo-auto-free
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-stepfun-step-3-5-flash
    displayName: stepfun-step-3-5-flash pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - stepfun-step-3-5-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

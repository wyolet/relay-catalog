apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-qwen-qwen3-8b
    displayName: qwen-qwen3-8b pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-8b
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.05
        - meter: tokens.output
          unit: per_million
          amount: 0.4
    enabled: true

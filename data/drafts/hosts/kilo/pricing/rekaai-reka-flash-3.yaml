apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-rekaai-reka-flash-3
    displayName: rekaai-reka-flash-3 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - rekaai-reka-flash-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.2
    enabled: true

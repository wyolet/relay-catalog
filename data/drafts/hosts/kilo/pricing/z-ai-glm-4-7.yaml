apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-z-ai-glm-4-7
    displayName: z-ai-glm-4-7 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - z-ai-glm-4-7
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 0.38
        - meter: tokens.output
          unit: per_million
          amount: 1.98
    enabled: true

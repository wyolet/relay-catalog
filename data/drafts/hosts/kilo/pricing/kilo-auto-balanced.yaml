apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-kilo-auto-balanced
    displayName: kilo-auto-balanced pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - kilo-auto-balanced
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

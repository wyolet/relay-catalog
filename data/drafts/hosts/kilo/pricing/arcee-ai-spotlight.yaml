apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-arcee-ai-spotlight
    displayName: arcee-ai-spotlight pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - arcee-ai-spotlight
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.18
        - meter: tokens.output
          unit: per_million
          amount: 0.18
    enabled: true

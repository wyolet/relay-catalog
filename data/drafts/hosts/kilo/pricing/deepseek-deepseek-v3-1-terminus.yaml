apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-deepseek-deepseek-v3-1-terminus
    displayName: deepseek-deepseek-v3-1-terminus pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-1-terminus
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.13
        - meter: tokens.input
          unit: per_million
          amount: 0.21
        - meter: tokens.output
          unit: per_million
          amount: 0.79
    enabled: true

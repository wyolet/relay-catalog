apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-mistralai-devstral-small
    displayName: mistralai-devstral-small pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - mistralai-devstral-small
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1
        - meter: tokens.output
          unit: per_million
          amount: 0.3
    enabled: true

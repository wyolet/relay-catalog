apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-deepseek-deepseek-v3-2-speciale
    displayName: deepseek-deepseek-v3-2-speciale pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-v3-2-speciale
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.135
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

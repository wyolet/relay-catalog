apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openrouter-bodybuilder
    displayName: openrouter-bodybuilder pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openrouter-bodybuilder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

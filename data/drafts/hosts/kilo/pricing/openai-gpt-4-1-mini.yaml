apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-gpt-4-1-mini
    displayName: openai-gpt-4-1-mini pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-1-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.1
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 1.6
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-perplexity-sonar-reasoning-pro
    displayName: perplexity-sonar-reasoning-pro pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - perplexity-sonar-reasoning-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 8
    enabled: true

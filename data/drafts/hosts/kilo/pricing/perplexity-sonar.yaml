apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-perplexity-sonar
    displayName: perplexity-sonar pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - perplexity-sonar
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

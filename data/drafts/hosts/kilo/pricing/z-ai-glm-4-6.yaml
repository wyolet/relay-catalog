apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-z-ai-glm-4-6
    displayName: z-ai-glm-4-6 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - z-ai-glm-4-6
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.175
        - meter: tokens.input
          unit: per_million
          amount: 0.39
        - meter: tokens.output
          unit: per_million
          amount: 1.9
    enabled: true

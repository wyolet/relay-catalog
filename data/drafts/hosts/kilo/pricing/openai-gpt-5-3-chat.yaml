apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-gpt-5-3-chat
    displayName: openai-gpt-5-3-chat pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-3-chat
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

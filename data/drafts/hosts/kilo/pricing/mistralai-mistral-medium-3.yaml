apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-mistralai-mistral-medium-3
    displayName: mistralai-mistral-medium-3 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - mistralai-mistral-medium-3
    rates:

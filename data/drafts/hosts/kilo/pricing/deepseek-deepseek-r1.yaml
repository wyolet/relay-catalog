apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-deepseek-deepseek-r1
    displayName: deepseek-deepseek-r1 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-r1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.7
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

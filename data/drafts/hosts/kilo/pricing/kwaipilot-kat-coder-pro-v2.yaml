apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-kwaipilot-kat-coder-pro-v2
    displayName: kwaipilot-kat-coder-pro-v2 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - kwaipilot-kat-coder-pro-v2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

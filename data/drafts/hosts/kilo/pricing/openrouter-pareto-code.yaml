apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openrouter-pareto-code
    displayName: openrouter-pareto-code pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openrouter-pareto-code
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

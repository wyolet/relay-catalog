apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-google-gemini-2-5-flash-image
    displayName: google-gemini-2-5-flash-image pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - google-gemini-2-5-flash-image
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
    enabled: true

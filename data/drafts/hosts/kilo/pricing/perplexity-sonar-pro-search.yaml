apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-perplexity-sonar-pro-search
    displayName: perplexity-sonar-pro-search pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - perplexity-sonar-pro-search
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

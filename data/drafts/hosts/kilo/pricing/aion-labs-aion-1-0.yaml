apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-aion-labs-aion-1-0
    displayName: aion-labs-aion-1-0 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - aion-labs-aion-1-0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4
        - meter: tokens.output
          unit: per_million
          amount: 8
    enabled: true

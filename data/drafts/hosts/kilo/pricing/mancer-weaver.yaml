apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-mancer-weaver
    displayName: mancer-weaver pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - mancer-weaver
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-o3-pro
    displayName: openai-o3-pro pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-o3-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 20
        - meter: tokens.output
          unit: per_million
          amount: 80
    enabled: true

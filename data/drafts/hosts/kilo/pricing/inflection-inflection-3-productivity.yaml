apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-inflection-inflection-3-productivity
    displayName: inflection-inflection-3-productivity pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - inflection-inflection-3-productivity
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-google-gemma-3-12b-it
    displayName: google-gemma-3-12b-it pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - google-gemma-3-12b-it
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.04
        - meter: tokens.output
          unit: per_million
          amount: 0.13
    enabled: true

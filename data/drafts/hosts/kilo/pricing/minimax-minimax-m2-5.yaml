apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-minimax-minimax-m2-5
    displayName: minimax-minimax-m2-5 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2-5
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.029
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

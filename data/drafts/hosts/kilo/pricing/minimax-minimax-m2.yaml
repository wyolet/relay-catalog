apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-minimax-minimax-m2
    displayName: minimax-minimax-m2 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - minimax-minimax-m2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.input
          unit: per_million
          amount: 0.255
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-z-ai-glm-5-1
    displayName: z-ai-glm-5-1 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - z-ai-glm-5-1
    rates:

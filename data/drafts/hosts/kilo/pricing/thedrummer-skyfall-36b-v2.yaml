apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-thedrummer-skyfall-36b-v2
    displayName: thedrummer-skyfall-36b-v2 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - thedrummer-skyfall-36b-v2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.55
        - meter: tokens.output
          unit: per_million
          amount: 0.8
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-prime-intellect-intellect-3
    displayName: prime-intellect-intellect-3 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - prime-intellect-intellect-3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.2
        - meter: tokens.output
          unit: per_million
          amount: 1.1
    enabled: true

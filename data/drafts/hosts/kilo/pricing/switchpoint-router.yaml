apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-switchpoint-router
    displayName: switchpoint-router pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - switchpoint-router
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.85
        - meter: tokens.output
          unit: per_million
          amount: 3.4
    enabled: true

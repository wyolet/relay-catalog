apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-moonshotai-kimi-k2-thinking
    displayName: moonshotai-kimi-k2-thinking pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - moonshotai-kimi-k2-thinking
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 0.47
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

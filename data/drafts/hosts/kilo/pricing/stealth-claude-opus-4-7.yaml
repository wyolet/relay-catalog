apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-stealth-claude-opus-4-7
    displayName: stealth-claude-opus-4-7 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - stealth-claude-opus-4-7
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
        - meter: tokens.input
          unit: per_million
          amount: 4
        - meter: tokens.output
          unit: per_million
          amount: 20
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-arcee-ai-trinity-mini
    displayName: arcee-ai-trinity-mini pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - arcee-ai-trinity-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.045
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-bytedance-seed-seed-1-6
    displayName: bytedance-seed-seed-1-6 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - bytedance-seed-seed-1-6
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

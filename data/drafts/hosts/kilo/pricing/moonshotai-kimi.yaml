apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-moonshotai-kimi
    displayName: moonshotai-kimi pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - moonshotai-kimi
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.14
        - meter: tokens.input
          unit: per_million
          amount: 0.74
        - meter: tokens.output
          unit: per_million
          amount: 3.49
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-gpt-4-turbo-preview
    displayName: openai-gpt-4-turbo-preview pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-gpt-4-turbo-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 30
    enabled: true

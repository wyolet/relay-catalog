apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-bytedance-seed-seed-1-6-flash
    displayName: bytedance-seed-seed-1-6-flash pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - bytedance-seed-seed-1-6-flash
    rates:
        - meter: tokens.input
          unit: per_million

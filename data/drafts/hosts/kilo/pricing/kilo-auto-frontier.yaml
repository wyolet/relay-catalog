apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-kilo-auto-frontier
    displayName: kilo-auto-frontier pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - kilo-auto-frontier
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 25
    enabled: true

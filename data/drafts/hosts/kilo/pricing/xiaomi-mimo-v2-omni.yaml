apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-xiaomi-mimo-v2-omni
    displayName: xiaomi-mimo-v2-omni pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - xiaomi-mimo-v2-omni
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.08
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

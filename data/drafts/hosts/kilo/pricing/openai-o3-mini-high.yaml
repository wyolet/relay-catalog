apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-o3-mini-high
    displayName: openai-o3-mini-high pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-o3-mini-high
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.55
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.4
    enabled: true

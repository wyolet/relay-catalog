apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-openai-gpt-5-image
    displayName: openai-gpt-5-image pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - openai-gpt-5-image
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

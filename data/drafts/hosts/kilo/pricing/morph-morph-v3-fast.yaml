apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-morph-morph-v3-fast
    displayName: morph-morph-v3-fast pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - morph-morph-v3-fast
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.8
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

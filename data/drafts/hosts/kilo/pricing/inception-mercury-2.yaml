apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-inception-mercury-2
    displayName: inception-mercury-2 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - inception-mercury-2
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.025
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 0.75
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-qwen-qwen3-14b
    displayName: qwen-qwen3-14b pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - qwen-qwen3-14b
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.025
        - meter: tokens.input
          unit: per_million
          amount: 0.06
        - meter: tokens.output
          unit: per_million
          amount: 0.24
    enabled: true

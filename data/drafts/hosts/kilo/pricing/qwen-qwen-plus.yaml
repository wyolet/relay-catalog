apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-qwen-qwen-plus
    displayName: qwen-qwen-plus pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - qwen-qwen-plus
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.08
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 1.2
    enabled: true

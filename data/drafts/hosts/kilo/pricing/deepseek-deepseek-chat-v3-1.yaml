apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-deepseek-deepseek-chat-v3-1
    displayName: deepseek-deepseek-chat-v3-1 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - deepseek-deepseek-chat-v3-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.15
        - meter: tokens.output
          unit: per_million
          amount: 0.75
    enabled: true

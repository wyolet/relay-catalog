apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-tencent-hy3-preview
    displayName: tencent-hy3-preview pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - tencent-hy3-preview
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.029
        - meter: tokens.input
          unit: per_million
          amount: 0.066
        - meter: tokens.output
          unit: per_million
          amount: 0.26
    enabled: true

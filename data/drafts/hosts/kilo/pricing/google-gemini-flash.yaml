apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-google-gemini-flash
    displayName: google-gemini-flash pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - google-gemini-flash
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.08333333333333334
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

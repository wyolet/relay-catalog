apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-anthropic-claude-sonnet-4-6
    displayName: anthropic-claude-sonnet-4-6 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - anthropic-claude-sonnet-4-6
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: kilo-amazon-nova-micro-v1
    displayName: amazon-nova-micro-v1 pricing
    owner:
        kind: host
        id: kilo
spec:
    currency: USD
    targetModels:
        - amazon-nova-micro-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.035
        - meter: tokens.output
          unit: per_million
          amount: 0.14
    enabled: true

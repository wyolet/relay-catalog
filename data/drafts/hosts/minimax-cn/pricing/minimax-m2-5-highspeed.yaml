apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: minimax-cn-minimax-m2-5-highspeed
    displayName: minimax-m2-5-highspeed pricing
    owner:
        kind: host
        id: minimax-cn
spec:
    currency: USD
    targetModels:
        - minimax-m2-5-highspeed
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.4
    enabled: true

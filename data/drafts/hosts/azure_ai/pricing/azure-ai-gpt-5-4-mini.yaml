# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure_ai-azure-ai-gpt-5-4-mini
    owner:
        kind: host
        id: azure_ai
spec:
    currency: USD
    targetModels:
        - azure-ai-gpt-5-4-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.75
        - meter: tokens.output
          unit: per_million
          amount: 4.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 1.5
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 6.75
          aboveTokens: 272000

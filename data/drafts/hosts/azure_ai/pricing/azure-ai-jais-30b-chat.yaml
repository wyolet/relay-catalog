# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure_ai-azure-ai-jais-30b-chat
    owner:
        kind: host
        id: azure_ai
spec:
    currency: USD
    targetModels:
        - azure-ai-jais-30b-chat
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3200
        - meter: tokens.output
          unit: per_million
          amount: 9710

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: crof-greg-1-mini
    displayName: greg-1-mini pricing
    owner:
        kind: host
        id: crof
spec:
    currency: USD
    targetModels:
        - greg-1-mini
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.01
        - meter: tokens.input
          unit: per_million
          amount: 0.07
        - meter: tokens.output
          unit: per_million
          amount: 0.15
    enabled: true

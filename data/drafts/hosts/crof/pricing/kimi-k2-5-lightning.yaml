apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: crof-kimi-k2-5-lightning
    displayName: kimi-k2-5-lightning pricing
    owner:
        kind: host
        id: crof
spec:
    currency: USD
    targetModels:
        - kimi-k2-5-lightning
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

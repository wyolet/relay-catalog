apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: crof-mimo-v2-5-pro
    displayName: mimo-v2-5-pro pricing
    owner:
        kind: host
        id: crof
spec:
    currency: USD
    targetModels:
        - mimo-v2-5-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.003
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 256000
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.input
          unit: per_million
          amount: 2
          aboveTokens: 256000
        - meter: tokens.output
          unit: per_million
          amount: 0.8
        - meter: tokens.output
          unit: per_million
          amount: 6
          aboveTokens: 256000
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: crof-deepseek-v4-pro-lightning
    displayName: deepseek-v4-pro-lightning pricing
    owner:
        kind: host
        id: crof
spec:
    currency: USD
    targetModels:
        - deepseek-v4-pro-lightning
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.02
        - meter: tokens.input
          unit: per_million
          amount: 0.8
        - meter: tokens.output
          unit: per_million
          amount: 1.6
    enabled: true

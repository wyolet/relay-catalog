apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-qwen3-coder
    displayName: qwen3-coder pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - qwen3-coder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.45
        - meter: tokens.output
          unit: per_million
          amount: 1.8
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-gpt-5-codex
    displayName: gpt-5-codex pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - gpt-5-codex
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.107
        - meter: tokens.input
          unit: per_million
          amount: 1.07
        - meter: tokens.output
          unit: per_million
          amount: 8.5
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-gemini-3-flash
    displayName: gemini-3-flash pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - gemini-3-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.05
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 3
    enabled: true

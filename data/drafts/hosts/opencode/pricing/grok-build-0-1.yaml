apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-grok-build-0-1
    displayName: grok-build-0-1 pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - grok-build-0-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-big-pickle
    displayName: big-pickle pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - big-pickle
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0
        - meter: tokens.input
          unit: per_million
          amount: 0
        - meter: tokens.output
          unit: per_million
          amount: 0
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: opencode-gpt-5-3-codex-spark
    displayName: gpt-5-3-codex-spark pricing
    owner:
        kind: host
        id: opencode
spec:
    currency: USD
    targetModels:
        - gpt-5-3-codex-spark
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.175
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

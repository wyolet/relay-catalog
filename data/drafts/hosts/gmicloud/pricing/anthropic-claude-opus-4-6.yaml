apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gmicloud-anthropic-claude-opus-4-6
    displayName: anthropic-claude-opus-4-6 pricing
    owner:
        kind: host
        id: gmicloud
spec:
    currency: USD
    targetModels:
        - anthropic-claude-opus-4-6
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 25
    enabled: true

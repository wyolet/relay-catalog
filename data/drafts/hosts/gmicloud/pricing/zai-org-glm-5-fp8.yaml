apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gmicloud-zai-org-glm-5-fp8
    displayName: zai-org-glm-5-fp8 pricing
    owner:
        kind: host
        id: gmicloud
spec:
    currency: USD
    targetModels:
        - zai-org-glm-5-fp8
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.12
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 1.92
    enabled: true

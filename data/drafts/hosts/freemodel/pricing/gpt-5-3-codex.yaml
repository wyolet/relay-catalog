apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: freemodel-gpt-5-3-codex
    displayName: gpt-5-3-codex pricing
    owner:
        kind: host
        id: freemodel
spec:
    currency: USD
    targetModels:
        - gpt-5-3-codex
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.175
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
    enabled: true

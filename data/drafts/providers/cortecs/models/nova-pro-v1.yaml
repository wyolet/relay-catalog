apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nova-pro-v1
    displayName: Nova Pro 1.0
    owner:
        kind: provider
        name: cortecs
    labels:
        family: nova-pro
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nova-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 5000
    contextWindowTotal: 300000
    maxOutputTokens: 5000
    knowledgeCutoff: 2024-04
    releaseDate: "2024-12-03"
    enabled: true
    snapshots:
        - name: nova-pro-v1
          releasedAt: "2024-12-03"
    pointer: nova-pro-v1

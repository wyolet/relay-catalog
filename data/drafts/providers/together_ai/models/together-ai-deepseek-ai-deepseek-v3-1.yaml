# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: together-ai-deepseek-ai-deepseek-v3-1
    owner:
        kind: provider
        name: together_ai
    labels:
        family: together
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: together_ai
          upstreamName: together_ai/deepseek-ai/DeepSeek-V3.1
          adapter: openai
    family: together
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: together-ai-deepseek-ai-deepseek-v3-1
          originalName: together_ai/deepseek-ai/DeepSeek-V3.1
    pointer: together-ai-deepseek-ai-deepseek-v3-1

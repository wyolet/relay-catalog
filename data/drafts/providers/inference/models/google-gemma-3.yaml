apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-gemma-3
    displayName: Google Gemma 3
    owner:
        kind: provider
        name: inference
    labels:
        family: gemma
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gemma
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 125000
    contextWindowOutput: 4096
    contextWindowTotal: 125000
    maxOutputTokens: 4096
    knowledgeCutoff: 2024-12
    releaseDate: "2025-01-01"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: google-gemma-3
          releasedAt: "2025-01-01"
          originalName: google/gemma-3
    pointer: google-gemma-3

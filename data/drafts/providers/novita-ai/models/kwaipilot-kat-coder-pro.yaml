apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: kwaipilot-kat-coder-pro
    displayName: Kat Coder Pro
    owner:
        kind: provider
        name: novita-ai
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 128000
    contextWindowTotal: 256000
    maxOutputTokens: 128000
    releaseDate: "2026-01-05"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: kwaipilot-kat-coder-pro
          releasedAt: "2026-01-05"
          originalName: kwaipilot/kat-coder-pro
    pointer: kwaipilot-kat-coder-pro

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o3-mini-high
    displayName: 'OpenAI: o3 Mini High'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - pdf
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    releaseDate: "2025-01-31"
    enabled: true
    snapshots:
        - name: openai-o3-mini-high
          releasedAt: "2025-01-31"
          originalName: openai/o3-mini-high
    pointer: openai-o3-mini-high

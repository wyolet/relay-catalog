apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-mini
    displayName: 'OpenAI: GPT Mini Latest'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    releaseDate: "2026-04-27"
    enabled: true
    snapshots:
        - name: openai-gpt-mini-latest
          releasedAt: "2026-04-27"
          originalName: ~openai/gpt-mini-latest
    pointer: openai-gpt-mini-latest

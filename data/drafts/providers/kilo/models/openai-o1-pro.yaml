apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o1-pro
    displayName: 'OpenAI: o1-pro'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - image
            - pdf
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    releaseDate: "2025-03-19"
    enabled: true
    snapshots:
        - name: openai-o1-pro
          releasedAt: "2025-03-19"
          originalName: openai/o1-pro
    pointer: openai-o1-pro

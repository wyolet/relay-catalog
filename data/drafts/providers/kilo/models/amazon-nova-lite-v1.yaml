apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: amazon-nova-lite-v1
    displayName: 'Amazon: Nova Lite 1.0'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - image
            - text
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 5120
    contextWindowTotal: 300000
    maxOutputTokens: 5120
    releaseDate: "2024-12-06"
    enabled: true
    snapshots:
        - name: amazon-nova-lite-v1
          releasedAt: "2024-12-06"
          originalName: amazon/nova-lite-v1
    pointer: amazon-nova-lite-v1

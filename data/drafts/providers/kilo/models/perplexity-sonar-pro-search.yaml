apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-sonar-pro-search
    displayName: 'Perplexity: Sonar Pro Search'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        vision: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - image
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8000
    contextWindowTotal: 200000
    maxOutputTokens: 8000
    releaseDate: "2025-10-31"
    enabled: true
    snapshots:
        - name: perplexity-sonar-pro-search
          releasedAt: "2025-10-31"
          originalName: perplexity/sonar-pro-search
    pointer: perplexity-sonar-pro-search

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-image-mini
    displayName: 'OpenAI: GPT-5 Image Mini'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - image
            - pdf
            - text
        output:
            - image
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    releaseDate: "2025-10-16"
    enabled: true
    snapshots:
        - name: openai-gpt-5-image-mini
          releasedAt: "2025-10-16"
          originalName: openai/gpt-5-image-mini
    pointer: openai-gpt-5-image-mini

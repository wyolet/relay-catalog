apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-pareto-code
    displayName: Pareto Code Router
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 65536
    contextWindowTotal: 200000
    maxOutputTokens: 65536
    releaseDate: "2026-04-21"
    enabled: true
    snapshots:
        - name: openrouter-pareto-code
          releasedAt: "2026-04-21"
          originalName: openrouter/pareto-code
    pointer: openrouter-pareto-code

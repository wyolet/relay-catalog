apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-lyria-3-clip-preview
    displayName: 'Google: Lyria 3 Clip Preview'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        vision: true
        audioOutput: true
        systemMessages: true
    modalities:

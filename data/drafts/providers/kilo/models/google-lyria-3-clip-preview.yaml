    contextWindowTotal: 1048576
    maxOutputTokens: 65536
    releaseDate: "2026-03-30"
    enabled: true
    snapshots:
        - name: google-lyria-3-clip-preview
          releasedAt: "2026-03-30"
          originalName: google/lyria-3-clip-preview
    pointer: google-lyria-3-clip-preview

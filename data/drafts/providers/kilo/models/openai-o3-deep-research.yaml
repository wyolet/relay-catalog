apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o3-deep-research
    displayName: 'OpenAI: o3 Deep Research'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - image
            - pdf
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    releaseDate: "2024-06-26"
    enabled: true
    snapshots:
        - name: openai-o3-deep-research
          releasedAt: "2024-06-26"
          originalName: openai/o3-deep-research
    pointer: openai-o3-deep-research

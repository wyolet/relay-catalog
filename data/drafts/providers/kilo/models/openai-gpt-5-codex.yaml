apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-codex
    displayName: 'OpenAI: GPT-5 Codex'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    releaseDate: "2025-09-15"
    enabled: true
    snapshots:
        - name: openai-gpt-5-codex
          releasedAt: "2025-09-15"
          originalName: openai/gpt-5-codex
    pointer: openai-gpt-5-codex

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4
    displayName: 'OpenAI: GPT-4'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8191
    contextWindowOutput: 4096
    contextWindowTotal: 8191
    maxOutputTokens: 4096
    releaseDate: "2023-03-14"
    enabled: true
    snapshots:
        - name: openai-gpt-4
          releasedAt: "2023-03-14"
          originalName: openai/gpt-4
        - name: openai-gpt-4-0314
          releasedAt: "2023-05-28"
          originalName: openai/gpt-4-0314
    pointer: openai-gpt-4

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: rekaai-reka-edge
    displayName: Reka Edge
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - image
            - text
            - video
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    maxOutputTokens: 16384
    releaseDate: "2026-03-20"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: rekaai-reka-edge
          releasedAt: "2026-03-20"
          originalName: rekaai/reka-edge
    pointer: rekaai-reka-edge

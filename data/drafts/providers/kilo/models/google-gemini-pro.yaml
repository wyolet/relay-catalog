apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-gemini-pro
    displayName: 'Google: Gemini Pro Latest'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        audio: true
        promptCache: true
        reasoning: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - pdf
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    maxOutputTokens: 65536
    releaseDate: "2026-04-27"
    enabled: true
    snapshots:
        - name: google-gemini-pro-latest
          releasedAt: "2026-04-27"
          originalName: ~google/gemini-pro-latest
    pointer: google-gemini-pro-latest

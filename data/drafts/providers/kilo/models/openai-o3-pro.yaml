apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o3-pro
    displayName: 'OpenAI: o3 Pro'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - image
            - pdf
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    releaseDate: "2025-04-16"
    enabled: true
    snapshots:
        - name: openai-o3-pro
          releasedAt: "2025-04-16"
          originalName: openai/o3-pro
        - name: openai-o3-pro-2025-06-10
          releasedAt: "2025-06-10"
          originalName: openai/o3-pro-2025-06-10
    pointer: openai-o3-pro

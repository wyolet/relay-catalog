apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: anthropic-claude-sonnet
    displayName: 'Anthropic: Claude Sonnet Latest'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    maxOutputTokens: 128000
    releaseDate: "2026-04-27"
    enabled: true
    snapshots:
        - name: anthropic-claude-sonnet-latest
          releasedAt: "2026-04-27"
          originalName: ~anthropic/claude-sonnet-latest
    pointer: anthropic-claude-sonnet-latest

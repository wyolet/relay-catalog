apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-2-chat
    displayName: 'OpenAI: GPT-5.2 Chat'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - image
            - pdf
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2025-12-11"
    enabled: true
    snapshots:
        - name: openai-gpt-5-2-chat
          releasedAt: "2025-12-11"
          originalName: openai/gpt-5.2-chat
        - name: openai-gpt-5-2-chat-latest
          releasedAt: "2025-12-11"
          originalName: openai/gpt-5.2-chat-latest
    pointer: openai-gpt-5-2-chat

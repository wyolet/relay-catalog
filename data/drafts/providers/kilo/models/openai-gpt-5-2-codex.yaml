apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-2-codex
    displayName: 'OpenAI: GPT-5.2-Codex'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    releaseDate: "2026-01-14"
    enabled: true
    snapshots:
        - name: openai-gpt-5-2-codex
          releasedAt: "2026-01-14"
          originalName: openai/gpt-5.2-codex
    pointer: openai-gpt-5-2-codex

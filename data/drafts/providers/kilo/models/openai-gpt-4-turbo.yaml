apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4-turbo
    displayName: 'OpenAI: GPT-4 Turbo'
    owner:
        kind: provider
        name: kilo
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    maxOutputTokens: 4096
    releaseDate: "2023-09-13"
    enabled: true
    snapshots:
        - name: openai-gpt-4-turbo
          releasedAt: "2023-09-13"
          originalName: openai/gpt-4-turbo
    pointer: openai-gpt-4-turbo

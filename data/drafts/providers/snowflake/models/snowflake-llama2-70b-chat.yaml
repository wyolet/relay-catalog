# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake-llama2-70b-chat
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/llama2-70b-chat
          adapter: openai
    family: snowflake
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 8192
    contextWindowTotal: 4096
    snapshots:
        - name: snowflake-llama2-70b-chat
          originalName: snowflake/llama2-70b-chat
    pointer: snowflake-llama2-70b-chat

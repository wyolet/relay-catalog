apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake-reka-core
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/reka-core
          adapter: openai
    family: snowflake
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32000
    contextWindowOutput: 8192
    contextWindowTotal: 32000
    snapshots:
        - name: snowflake-reka-core
          originalName: snowflake/reka-core
    pointer: snowflake-reka-core

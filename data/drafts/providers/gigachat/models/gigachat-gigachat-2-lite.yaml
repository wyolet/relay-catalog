# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gigachat-gigachat-2-lite
    owner:
        kind: provider
        name: gigachat
    labels:
        family: gigachat
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gigachat
          upstreamName: gigachat/GigaChat-2-Lite
          adapter: openai
    family: gigachat
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: gigachat-gigachat-2-lite
          originalName: gigachat/GigaChat-2-Lite
    pointer: gigachat-gigachat-2-lite

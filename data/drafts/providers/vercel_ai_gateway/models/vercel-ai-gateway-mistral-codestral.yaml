apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel-ai-gateway-mistral-codestral
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/mistral/codestral
          adapter: openai
    family: vercel
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 4000
    contextWindowTotal: 256000
    snapshots:
        - name: vercel-ai-gateway-mistral-codestral
          originalName: vercel_ai_gateway/mistral/codestral
    pointer: vercel-ai-gateway-mistral-codestral

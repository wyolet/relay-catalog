# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel-ai-gateway-mistral-mistral-embed
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/mistral/mistral-embed
          adapter: openai
    family: vercel
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: vercel-ai-gateway-mistral-mistral-embed
          originalName: vercel_ai_gateway/mistral/mistral-embed
    pointer: vercel-ai-gateway-mistral-mistral-embed

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel-ai-gateway-vercel-v0-1-0-md
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/vercel/v0-1.0-md
          adapter: openai
    family: vercel
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 32000
    contextWindowTotal: 128000
    snapshots:
        - name: vercel-ai-gateway-vercel-v0-1-0-md
          originalName: vercel_ai_gateway/vercel/v0-1.0-md
    pointer: vercel-ai-gateway-vercel-v0-1-0-md

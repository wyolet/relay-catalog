apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel-ai-gateway-openai-gpt-4-turbo
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/openai/gpt-4-turbo
          adapter: openai
    family: vercel
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: vercel-ai-gateway-openai-gpt-4-turbo
          originalName: vercel_ai_gateway/openai/gpt-4-turbo
    pointer: vercel-ai-gateway-openai-gpt-4-turbo

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vertex-ai-moonshotai-kimi-k2-thinking-maas
    owner:
        kind: provider
        name: vertex_ai-moonshot_models
    labels:
        family: vertex
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-moonshot_models
          adapter: openai
    family: vertex
    capabilities:
        chat: true
        streaming: true
        tools: true
        webSearch: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 256000
    contextWindowTotal: 256000
    snapshots:
        - name: vertex-ai-moonshotai-kimi-k2-thinking-maas
          originalName: vertex_ai/moonshotai/kimi-k2-thinking-maas
    pointer: vertex-ai-moonshotai-kimi-k2-thinking-maas

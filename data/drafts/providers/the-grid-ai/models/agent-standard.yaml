apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: agent-standard
    displayName: Agent Standard
    owner:
        kind: provider
        name: the-grid-ai
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16000
    contextWindowTotal: 128000
    maxOutputTokens: 16000
    releaseDate: "2026-05-04"
    enabled: true
    snapshots:
        - name: agent-standard
          releasedAt: "2026-05-04"
    pointer: agent-standard

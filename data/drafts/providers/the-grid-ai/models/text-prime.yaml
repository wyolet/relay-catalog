apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: text-prime
    displayName: Text Prime
    owner:
        kind: provider
        name: the-grid-ai
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 30000
    contextWindowTotal: 128000
    maxOutputTokens: 30000
    releaseDate: "2026-02-26"
    enabled: true
    snapshots:
        - name: text-prime
          releasedAt: "2026-02-26"
    pointer: text-prime

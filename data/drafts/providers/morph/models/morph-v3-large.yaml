apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: morph-v3-large
    displayName: Morph v3 Large
    owner:
        kind: provider
        name: morph
    labels:
        family: morph
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: morph
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32000
    contextWindowOutput: 32000
    contextWindowTotal: 32000
    maxOutputTokens: 32000
    releaseDate: "2024-08-15"
    enabled: true
    snapshots:
        - name: morph-v3-large
          releasedAt: "2024-08-15"
    pointer: morph-v3-large

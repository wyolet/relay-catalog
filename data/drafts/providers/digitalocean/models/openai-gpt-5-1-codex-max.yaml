            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    knowledgeCutoff: "2024-09-30"
    releaseDate: "2025-11-13"
    enabled: true
    snapshots:
        - name: openai-gpt-5-1-codex-max
          releasedAt: "2025-11-13"
          originalName: openai-gpt-5.1-codex-max
    pointer: openai-gpt-5-1-codex-max

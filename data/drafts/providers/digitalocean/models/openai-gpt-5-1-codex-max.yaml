apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-1-codex-max
    displayName: GPT-5.1 Codex Max
    owner:
        kind: provider
        name: digitalocean
    labels:
        family: gpt-codex
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-codex
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:

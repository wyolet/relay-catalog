apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4o
    displayName: GPT-4o
    owner:
        kind: provider
        name: digitalocean
    labels:
        family: gpt
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    knowledgeCutoff: 2023-09
    releaseDate: "2024-05-13"
    enabled: true
    snapshots:
        - name: openai-gpt-4o
          releasedAt: "2024-05-13"
        - name: openai-gpt-4o-2024-05-13
          releasedAt: "2024-05-13"
          originalName: openai/gpt-4o-2024-05-13
        - name: openai-gpt-4o-2024-08-06
          releasedAt: "2024-08-06"
          originalName: openai/gpt-4o-2024-08-06
        - name: openai-gpt-4o-2024-11-20
          releasedAt: "2024-11-20"
          originalName: openai/gpt-4o-2024-11-20
    pointer: openai-gpt-4o

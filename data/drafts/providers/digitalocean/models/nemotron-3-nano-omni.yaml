            - text
            - image
            - video
            - audio
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 65536
    contextWindowTotal: 65536
    maxOutputTokens: 65536
    releaseDate: "2026-04-28"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nemotron-3-nano-omni
          releasedAt: "2026-04-28"
    pointer: nemotron-3-nano-omni

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron-3-nano-omni
    displayName: Nemotron Nano 3 Omni
    owner:
        kind: provider
        name: digitalocean
    labels:
        family: nemotron
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nemotron
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        audio: true
        reasoning: true
        audioInput: true
        systemMessages: true
    modalities:

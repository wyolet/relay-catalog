apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-nano
    displayName: GPT-5 nano
    owner:
        kind: provider
        name: digitalocean
    labels:
        family: gpt-nano
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-nano
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    knowledgeCutoff: "2024-05-30"
    releaseDate: "2025-08-07"
    enabled: true
    snapshots:
        - name: openai-gpt-5-nano
          releasedAt: "2025-08-07"
    pointer: openai-gpt-5-nano

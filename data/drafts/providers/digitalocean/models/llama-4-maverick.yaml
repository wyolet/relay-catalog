apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama-4-maverick
    displayName: Llama 4 Maverick 17B 128E Instruct
    owner:
        kind: provider
        name: digitalocean
    labels:
        family: llama
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: llama
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 16384
    contextWindowTotal: 1000000
    maxOutputTokens: 16384
    knowledgeCutoff: 2024-08
    releaseDate: "2025-04-05"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: llama-4-maverick
          releasedAt: "2025-04-05"
    pointer: llama-4-maverick

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-paddlepaddle-paddleocr-vl
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          upstreamName: novita/paddlepaddle/paddleocr-vl
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    snapshots:
        - name: novita-paddlepaddle-paddleocr-vl
          originalName: novita/paddlepaddle/paddleocr-vl
    pointer: novita-paddlepaddle-paddleocr-vl

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-zai-org-autoglm-phone-9b-multilingual
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 65536
    contextWindowTotal: 65536
    snapshots:
        - name: novita-zai-org-autoglm-phone-9b-multilingual
          originalName: novita/zai-org/autoglm-phone-9b-multilingual
    pointer: novita-zai-org-autoglm-phone-9b-multilingual

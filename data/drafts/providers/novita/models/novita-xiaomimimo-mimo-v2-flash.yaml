apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-xiaomimimo-mimo-v2-flash
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          upstreamName: novita/xiaomimimo/mimo-v2-flash
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 32000
    contextWindowTotal: 262144
    snapshots:
        - name: novita-xiaomimimo-mimo-v2-flash
          originalName: novita/xiaomimimo/mimo-v2-flash
    pointer: novita-xiaomimimo-mimo-v2-flash

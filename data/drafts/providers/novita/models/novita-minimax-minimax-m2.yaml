# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-minimax-minimax-m2
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 204800
    contextWindowOutput: 131072
    contextWindowTotal: 204800
    snapshots:
        - name: novita-minimax-minimax-m2
          originalName: novita/minimax/minimax-m2
    pointer: novita-minimax-minimax-m2

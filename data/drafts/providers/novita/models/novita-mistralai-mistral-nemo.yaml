# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-mistralai-mistral-nemo
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 60288
    contextWindowOutput: 16000
    contextWindowTotal: 60288
    snapshots:
        - name: novita-mistralai-mistral-nemo
          originalName: novita/mistralai/mistral-nemo
    pointer: novita-mistralai-mistral-nemo

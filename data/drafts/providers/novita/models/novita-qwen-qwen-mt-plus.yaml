# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-qwen-qwen-mt-plus
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 8192
    contextWindowTotal: 16384
    snapshots:
        - name: novita-qwen-qwen-mt-plus
          originalName: novita/qwen/qwen-mt-plus
    pointer: novita-qwen-qwen-mt-plus

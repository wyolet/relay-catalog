# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-minimaxai-minimax-m1-80k
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          upstreamName: novita/minimaxai/minimax-m1-80k
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 40000
    contextWindowTotal: 1000000
    snapshots:
        - name: novita-minimaxai-minimax-m1-80k
          originalName: novita/minimaxai/minimax-m1-80k
    pointer: novita-minimaxai-minimax-m1-80k

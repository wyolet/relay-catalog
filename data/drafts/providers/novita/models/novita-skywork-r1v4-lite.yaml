# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: novita-skywork-r1v4-lite
    owner:
        kind: provider
        name: novita
    labels:
        family: novita
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: novita
          upstreamName: novita/skywork/r1v4-lite
          adapter: openai
    family: novita
    capabilities:
        chat: true
        streaming: true
        vision: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 65536
    contextWindowTotal: 262144
    snapshots:
        - name: novita-skywork-r1v4-lite
          originalName: novita/skywork/r1v4-lite
    pointer: novita-skywork-r1v4-lite

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: codestral-codestral
    owner:
        kind: provider
        name: codestral
    labels:
        family: codestral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: codestral
          adapter: openai
    family: codestral
    capabilities:
        chat: true
        streaming: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32000
    contextWindowOutput: 8191
    contextWindowTotal: 32000
    snapshots:
        - name: codestral-codestral-latest
          originalName: codestral/codestral-latest
    pointer: codestral-codestral-latest

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: kblab-kb-whisper-large
    displayName: KB Whisper
    owner:
        kind: provider
        name: evroc
    labels:
        family: whisper
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: whisper
    capabilities:
        chat: true
        streaming: true
        audio: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - audio
        output:
            - text
    contextWindowInput: 448
    contextWindowOutput: 448
    contextWindowTotal: 448
    maxOutputTokens: 448
    releaseDate: "2024-10-01"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: kblab-kb-whisper-large
          releasedAt: "2024-10-01"
          originalName: KBLab/kb-whisper-large
    pointer: kblab-kb-whisper-large

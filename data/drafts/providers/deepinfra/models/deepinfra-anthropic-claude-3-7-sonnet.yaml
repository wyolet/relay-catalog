# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepinfra-anthropic-claude-3-7-sonnet
    owner:
        kind: provider
        name: deepinfra
    labels:
        family: deepinfra
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: deepinfra
          upstreamName: deepinfra/anthropic/claude-3-7-sonnet-latest
          adapter: openai
    family: deepinfra
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 200000
    contextWindowTotal: 200000
    snapshots:
        - name: deepinfra-anthropic-claude-3-7-sonnet-latest
          originalName: deepinfra/anthropic/claude-3-7-sonnet-latest
    pointer: deepinfra-anthropic-claude-3-7-sonnet-latest

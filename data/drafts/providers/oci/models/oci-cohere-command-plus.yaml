# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: oci-cohere-command-plus
    owner:
        kind: provider
        name: oci
    labels:
        family: oci
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: oci
          adapter: openai
    family: oci
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4000
    contextWindowTotal: 128000
    snapshots:
        - name: oci-cohere-command-plus-latest
          originalName: oci/cohere.command-plus-latest
    pointer: oci-cohere-command-plus-latest

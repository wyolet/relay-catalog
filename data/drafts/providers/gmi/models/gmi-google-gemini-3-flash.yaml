# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gmi-google-gemini-3-flash
    owner:
        kind: provider
        name: gmi
    labels:
        family: gmi
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gmi
          adapter: openai
    family: gmi
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    snapshots:
        - name: gmi-google-gemini-3-flash-preview
          originalName: gmi/google/gemini-3-flash-preview
    pointer: gmi-google-gemini-3-flash-preview

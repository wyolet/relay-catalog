apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gmi-openai-gpt-5
    owner:
        kind: provider
        name: gmi
    labels:
        family: gmi
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gmi
          upstreamName: gmi/openai/gpt-5
          adapter: openai
    family: gmi
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 409600
    contextWindowOutput: 32000
    contextWindowTotal: 409600
    snapshots:
        - name: gmi-openai-gpt-5
          originalName: gmi/openai/gpt-5
    pointer: gmi-openai-gpt-5

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-reasoner
    displayName: Deepseek-Reasoner
    owner:
        kind: provider
        name: 302ai
    labels:
        family: deepseek-thinking
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek-thinking
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    maxOutputTokens: 128000
    knowledgeCutoff: 2024-07
    releaseDate: "2025-01-20"
    enabled: true
    snapshots:
        - name: deepseek-reasoner
          releasedAt: "2025-01-20"
    pointer: deepseek-reasoner

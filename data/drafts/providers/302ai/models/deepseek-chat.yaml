apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-chat
    displayName: Deepseek-Chat
    owner:
        kind: provider
        name: 302ai
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    knowledgeCutoff: 2024-07
    releaseDate: "2024-11-29"
    enabled: true
    snapshots:
        - name: deepseek-chat
          releasedAt: "2024-11-29"
    pointer: deepseek-chat

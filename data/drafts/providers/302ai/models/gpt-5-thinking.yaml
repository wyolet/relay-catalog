apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-thinking
    displayName: gpt-5-thinking
    owner:
        kind: provider
        name: 302ai
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    knowledgeCutoff: 2024-10
    releaseDate: "2025-08-08"
    enabled: true
    snapshots:
        - name: gpt-5-thinking
          releasedAt: "2025-08-08"
    pointer: gpt-5-thinking

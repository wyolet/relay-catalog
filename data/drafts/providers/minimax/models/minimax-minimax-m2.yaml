# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: minimax-minimax-m2
    owner:
        kind: provider
        name: minimax
    labels:
        family: minimax
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: minimax
          upstreamName: minimax/MiniMax-M2
          adapter: openai
    family: minimax
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8192
    contextWindowTotal: 200000
    snapshots:
        - name: minimax-minimax-m2
          originalName: minimax/MiniMax-M2
    pointer: minimax-minimax-m2

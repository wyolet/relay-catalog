apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: auto
    displayName: Auto Route
    owner:
        kind: provider
        name: llmgateway
    labels:
        family: auto
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: auto
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2024-01-01"
    enabled: true
    snapshots:
        - name: auto
          releasedAt: "2024-01-01"
    pointer: auto

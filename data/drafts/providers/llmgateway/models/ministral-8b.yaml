    displayName: Ministral 8B
    owner:
        kind: provider
        name: llmgateway
    labels:
        family: mistral
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: mistral
    capabilities:
        chat: true
        streaming: true
        vision: true
        systemMessages: true
    modalities:
        input:

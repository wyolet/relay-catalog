apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-pro
    displayName: Gemini Pro Latest
    owner:
        kind: provider
        name: llmgateway
    labels:
        family: gemini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    maxOutputTokens: 65536
    releaseDate: "2026-02-27"
    enabled: true
    snapshots:
        - name: gemini-pro-latest
          releasedAt: "2026-02-27"
    pointer: gemini-pro-latest

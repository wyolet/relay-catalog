# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-sonar-small-online
    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          upstreamName: perplexity/sonar-small-online
          adapter: openai
    family: perplexity
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 12000
    contextWindowOutput: 12000
    contextWindowTotal: 12000
    snapshots:
        - name: perplexity-sonar-small-online
          originalName: perplexity/sonar-small-online
    pointer: perplexity-sonar-small-online

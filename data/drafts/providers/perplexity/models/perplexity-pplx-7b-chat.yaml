# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-pplx-7b-chat
    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          adapter: openai
    family: perplexity
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: perplexity-pplx-7b-chat
          originalName: perplexity/pplx-7b-chat
    pointer: perplexity-pplx-7b-chat

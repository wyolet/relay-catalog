apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-mistral-7b-instruct
    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          upstreamName: perplexity/mistral-7b-instruct
          adapter: openai
    family: perplexity
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 4096
    contextWindowTotal: 4096
    snapshots:
        - name: perplexity-mistral-7b-instruct
          originalName: perplexity/mistral-7b-instruct
    pointer: perplexity-mistral-7b-instruct

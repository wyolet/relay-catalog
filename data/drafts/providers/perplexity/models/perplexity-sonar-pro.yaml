apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-sonar-pro
    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          upstreamName: perplexity/sonar-pro
          adapter: openai
    family: perplexity
    capabilities:
        chat: true
        streaming: true
        webSearch: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8000
    contextWindowTotal: 200000
    snapshots:
        - name: perplexity-sonar-pro
          originalName: perplexity/sonar-pro
    pointer: perplexity-sonar-pro

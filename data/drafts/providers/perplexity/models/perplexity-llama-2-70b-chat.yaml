apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: perplexity-llama-2-70b-chat
    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          upstreamName: perplexity/llama-2-70b-chat
          adapter: openai
    family: perplexity
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 4096
    contextWindowTotal: 4096
    snapshots:
        - name: perplexity-llama-2-70b-chat
          originalName: perplexity/llama-2-70b-chat
    pointer: perplexity-llama-2-70b-chat

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: sambanova-minimax-m2-7
    owner:
        kind: provider
        name: sambanova
    labels:
        family: sambanova
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: sambanova
          upstreamName: sambanova/MiniMax-M2.7
          adapter: openai
    family: sambanova
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 204800
    contextWindowOutput: 131072
    contextWindowTotal: 204800
    snapshots:
        - name: sambanova-minimax-m2-7
          originalName: sambanova/MiniMax-M2.7
    pointer: sambanova-minimax-m2-7

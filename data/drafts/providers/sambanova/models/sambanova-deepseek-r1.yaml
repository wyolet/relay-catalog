# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: sambanova-deepseek-r1
    owner:
        kind: provider
        name: sambanova
    labels:
        family: sambanova
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: sambanova
          adapter: openai
    family: sambanova
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 32768
    contextWindowTotal: 32768
    snapshots:
        - name: sambanova-deepseek-r1
          originalName: sambanova/DeepSeek-R1
    pointer: sambanova-deepseek-r1

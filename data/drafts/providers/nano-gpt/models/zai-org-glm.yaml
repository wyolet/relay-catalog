apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: zai-org-glm
    displayName: GLM Latest
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 131072
    contextWindowTotal: 200000
    maxOutputTokens: 131072
    releaseDate: "2026-05-03"
    enabled: true
    snapshots:
        - name: zai-org-glm-latest
          releasedAt: "2026-05-03"
          originalName: zai-org/glm-latest
    pointer: zai-org-glm-latest

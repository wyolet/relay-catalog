apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: x-ai-grok
    displayName: Grok Latest
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 1000000
    contextWindowTotal: 1000000
    maxOutputTokens: 1000000
    releaseDate: "2026-05-03"
    enabled: true
    snapshots:
        - name: x-ai-grok-latest
          releasedAt: "2026-05-03"
          originalName: x-ai/grok-latest
    pointer: x-ai-grok-latest

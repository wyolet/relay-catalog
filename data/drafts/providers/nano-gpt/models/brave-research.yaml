apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: brave-research
    displayName: Brave (Research)
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    maxOutputTokens: 16384
    releaseDate: "2023-03-02"
    enabled: true
    snapshots:
        - name: brave-research
          releasedAt: "2023-03-02"
    pointer: brave-research

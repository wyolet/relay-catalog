apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: yi-lightning
    displayName: Yi Lightning
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 12000
    contextWindowOutput: 4096
    contextWindowTotal: 12000
    maxOutputTokens: 4096
    releaseDate: "2024-10-16"
    enabled: true
    snapshots:
        - name: yi-lightning
          releasedAt: "2024-10-16"
    pointer: yi-lightning

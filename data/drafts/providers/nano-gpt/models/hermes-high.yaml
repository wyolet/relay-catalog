apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: hermes-high
    displayName: Hermes High
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    maxOutputTokens: 128000
    releaseDate: "2026-05-11"
    enabled: true
    snapshots:
        - name: hermes-high
          releasedAt: "2026-05-11"
    pointer: hermes-high

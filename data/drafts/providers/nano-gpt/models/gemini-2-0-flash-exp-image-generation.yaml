apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-2-0-flash-exp-image-generation
    displayName: Gemini Text + Image
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:

    contextWindowTotal: 32767
    maxOutputTokens: 8192
    releaseDate: "2025-02-19"
    enabled: true
    snapshots:
        - name: gemini-2-0-flash-exp-image-generation
          releasedAt: "2025-02-19"
          originalName: gemini-2.0-flash-exp-image-generation
    pointer: gemini-2-0-flash-exp-image-generation

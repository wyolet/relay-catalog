apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: asi1-mini
    displayName: ASI1 Mini
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - pdf
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2025-03-25"
    enabled: true
    snapshots:
        - name: asi1-mini
          releasedAt: "2025-03-25"
    pointer: asi1-mini

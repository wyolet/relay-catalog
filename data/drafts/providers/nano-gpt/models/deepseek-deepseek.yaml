apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-deepseek
    displayName: DeepSeek Latest
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 384000
    contextWindowTotal: 1048576
    maxOutputTokens: 384000
    releaseDate: "2026-05-03"
    enabled: true
    snapshots:
        - name: deepseek-deepseek-latest
          releasedAt: "2026-05-03"
          originalName: deepseek/deepseek-latest
    pointer: deepseek-deepseek-latest

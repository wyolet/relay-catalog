apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-gemini-flash-lite
    displayName: Gemini Flash Lite Latest
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    maxOutputTokens: 65536
    releaseDate: "2026-03-29"
    enabled: true
    snapshots:
        - name: google-gemini-flash-lite-latest
          releasedAt: "2026-03-29"
          originalName: google/gemini-flash-lite-latest
    pointer: google-gemini-flash-lite-latest

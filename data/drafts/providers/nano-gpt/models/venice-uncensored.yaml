apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: venice-uncensored
    displayName: Venice Uncensored
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2025-02-24"
    enabled: true
    snapshots:
        - name: venice-uncensored
          releasedAt: "2025-02-24"
    pointer: venice-uncensored

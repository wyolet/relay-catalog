apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: yi-large
    displayName: Yi Large
    owner:
        kind: provider
        name: nano-gpt
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32000
    contextWindowOutput: 4096
    contextWindowTotal: 32000
    maxOutputTokens: 4096
    releaseDate: "2024-05-13"
    enabled: true
    snapshots:
        - name: yi-large
          releasedAt: "2024-05-13"
    pointer: yi-large

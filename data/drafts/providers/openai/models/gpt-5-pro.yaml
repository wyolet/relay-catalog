apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-pro
    displayName: GPT-5 Pro
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt-pro
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: gpt-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 272000
    contextWindowTotal: 400000
    maxOutputTokens: 272000
    knowledgeCutoff: "2024-09-30"
    releaseDate: "2025-10-06"
    enabled: true
    snapshots:
        - name: gpt-5-pro
          releasedAt: "2025-10-06"
    pointer: gpt-5-pro

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o3-deep-research
    displayName: o3-deep-research
    owner:
        kind: provider
        name: openai
    labels:
        family: o
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: o
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    knowledgeCutoff: 2024-05
    releaseDate: "2024-06-26"
    enabled: true
    snapshots:
        - name: o3-deep-research
          releasedAt: "2024-06-26"
    pointer: o3-deep-research

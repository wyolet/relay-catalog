apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-3-codex-spark
    displayName: GPT-5.3 Codex Spark
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt-codex-spark
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-codex-spark
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 100000
    contextWindowOutput: 32000
    contextWindowTotal: 128000
    maxOutputTokens: 32000
    knowledgeCutoff: "2025-08-31"
    releaseDate: "2026-02-05"
    enabled: true
    snapshots:
        - name: gpt-5-3-codex-spark
          releasedAt: "2026-02-05"
          originalName: gpt-5.3-codex-spark
    pointer: gpt-5-3-codex-spark

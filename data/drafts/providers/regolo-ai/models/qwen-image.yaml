apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen-image
    displayName: Qwen-Image
    owner:
        kind: provider
        name: regolo-ai
    labels:
        family: qwen
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: qwen
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - image
    contextWindowInput: 8192
    contextWindowOutput: 4096
    contextWindowTotal: 8192
    maxOutputTokens: 4096
    releaseDate: "2026-03-01"
    enabled: true
    snapshots:
        - name: qwen-image
          releasedAt: "2026-03-01"
    pointer: qwen-image

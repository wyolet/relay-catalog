# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: amazon-nova-nova-micro-v1
    owner:
        kind: provider
        name: amazon_nova
    labels:
        family: amazon
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: amazon_nova
          adapter: openai
    family: amazon
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 10000
    contextWindowTotal: 128000
    snapshots:
        - name: amazon-nova-nova-micro-v1
          originalName: amazon-nova/nova-micro-v1
    pointer: amazon-nova-nova-micro-v1

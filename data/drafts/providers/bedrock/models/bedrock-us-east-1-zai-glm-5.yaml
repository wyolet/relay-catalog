# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock-us-east-1-zai-glm-5
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: bedrock/us-east-1/zai.glm-5
          adapter: openai
    family: bedrock
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 128000
    contextWindowTotal: 200000
    snapshots:
        - name: bedrock-us-east-1-zai-glm-5
          originalName: bedrock/us-east-1/zai.glm-5
    pointer: bedrock-us-east-1-zai-glm-5

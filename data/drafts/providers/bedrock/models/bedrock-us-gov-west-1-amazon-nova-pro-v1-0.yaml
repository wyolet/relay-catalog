# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock-us-gov-west-1-amazon-nova-pro-v1-0
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: bedrock/us-gov-west-1/amazon.nova-pro-v1:0
          adapter: openai
    family: bedrock
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 10000
    contextWindowTotal: 300000
    snapshots:
        - name: bedrock-us-gov-west-1-amazon-nova-pro-v1-0
          originalName: bedrock/us-gov-west-1/amazon.nova-pro-v1:0
    pointer: bedrock-us-gov-west-1-amazon-nova-pro-v1-0

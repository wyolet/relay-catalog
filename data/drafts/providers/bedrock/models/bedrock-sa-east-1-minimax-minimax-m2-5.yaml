# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock-sa-east-1-minimax-minimax-m2-5
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          adapter: openai
    family: bedrock
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 8192
    contextWindowTotal: 1000000
    snapshots:
        - name: bedrock-sa-east-1-minimax-minimax-m2-5
          originalName: bedrock/sa-east-1/minimax.minimax-m2.5
    pointer: bedrock-sa-east-1-minimax-minimax-m2-5

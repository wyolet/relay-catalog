# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock-us-west-2-minimax-minimax-m2-1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          adapter: openai
    family: bedrock
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 196000
    contextWindowOutput: 8192
    contextWindowTotal: 196000
    snapshots:
        - name: bedrock-us-west-2-minimax-minimax-m2-1
          originalName: bedrock/us-west-2/minimax.minimax-m2.1
    pointer: bedrock-us-west-2-minimax-minimax-m2-1

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: anthropic-claude-v2-1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: anthropic
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          adapter: openai
    family: anthropic
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 100000
    contextWindowOutput: 8191
    contextWindowTotal: 100000
    snapshots:
        - name: anthropic-claude-v2-1
          originalName: anthropic.claude-v2:1
    pointer: anthropic-claude-v2-1

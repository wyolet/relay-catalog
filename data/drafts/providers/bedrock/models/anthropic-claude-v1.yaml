apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: anthropic-claude-v1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: anthropic
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: anthropic.claude-v1
          adapter: openai
    family: anthropic
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 100000
    contextWindowOutput: 8191
    contextWindowTotal: 100000
    snapshots:
        - name: anthropic-claude-v1
          originalName: anthropic.claude-v1
    pointer: anthropic-claude-v1

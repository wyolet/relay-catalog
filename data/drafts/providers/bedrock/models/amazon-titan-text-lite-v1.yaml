# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: amazon-titan-text-lite-v1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: amazon
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: amazon.titan-text-lite-v1
          adapter: openai
    family: amazon
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 42000
    contextWindowOutput: 4000
    contextWindowTotal: 42000
    snapshots:
        - name: amazon-titan-text-lite-v1
          originalName: amazon.titan-text-lite-v1
    pointer: amazon-titan-text-lite-v1

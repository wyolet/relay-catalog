# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock-us-west-2-deepseek-v3-2
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          adapter: openai
    family: bedrock
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 163840
    contextWindowOutput: 163840
    contextWindowTotal: 163840
    snapshots:
        - name: bedrock-us-west-2-deepseek-v3-2
          originalName: bedrock/us-west-2/deepseek.v3.2
    pointer: bedrock-us-west-2-deepseek-v3-2

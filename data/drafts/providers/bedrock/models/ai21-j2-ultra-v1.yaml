# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: ai21-j2-ultra-v1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: ai21
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          adapter: openai
    family: ai21
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8191
    contextWindowOutput: 8191
    contextWindowTotal: 8191
    snapshots:
        - name: ai21-j2-ultra-v1
          originalName: ai21.j2-ultra-v1
    pointer: ai21-j2-ultra-v1

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: anthropic-claude-mythos
    owner:
        kind: provider
        name: bedrock
    labels:
        family: anthropic
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: anthropic.claude-mythos-preview
          adapter: openai
    family: anthropic
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    snapshots:
        - name: anthropic-claude-mythos-preview
          originalName: anthropic.claude-mythos-preview
    pointer: anthropic-claude-mythos-preview

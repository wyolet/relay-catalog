# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: meta-llama2-70b-chat-v1
    owner:
        kind: provider
        name: bedrock
    labels:
        family: meta
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: meta.llama2-70b-chat-v1
          adapter: openai
    family: meta
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 4096
    contextWindowTotal: 4096
    snapshots:
        - name: meta-llama2-70b-chat-v1
          originalName: meta.llama2-70b-chat-v1
    pointer: meta-llama2-70b-chat-v1

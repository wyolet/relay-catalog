apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen-deep-research
    displayName: Qwen Deep Research
    owner:
        kind: provider
        name: alibaba-cn
    labels:
        family: qwen
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: qwen
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 32768
    contextWindowTotal: 1000000
    maxOutputTokens: 32768
    knowledgeCutoff: 2024-04
    releaseDate: 2024-01
    enabled: true
    snapshots:
        - name: qwen-deep-research
          releasedAt: 2024-01
    pointer: qwen-deep-research

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen-doc-turbo
    displayName: Qwen Doc Turbo
    owner:
        kind: provider
        name: alibaba-cn
    labels:
        family: qwen
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: qwen
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 8192
    contextWindowTotal: 131072
    maxOutputTokens: 8192
    knowledgeCutoff: 2024-04
    releaseDate: 2024-01
    enabled: true
    snapshots:
        - name: qwen-doc-turbo
          releasedAt: 2024-01
    pointer: qwen-doc-turbo

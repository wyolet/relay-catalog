# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-gpt-4-turbo-vision
    owner:
        kind: provider
        name: azure
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-4-turbo-vision-preview
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: azure-gpt-4-turbo-vision-preview
          originalName: azure/gpt-4-turbo-vision-preview
    pointer: azure-gpt-4-turbo-vision-preview

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-container
    owner:
        kind: provider
        name: azure
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: azure-container
          originalName: azure/container
    pointer: azure-container

            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 272000
    snapshots:
        - name: azure-gpt-5-1
          originalName: azure/gpt-5.1
        - name: azure-gpt-5-1-2025-11-13
          releasedAt: "2025-11-13"

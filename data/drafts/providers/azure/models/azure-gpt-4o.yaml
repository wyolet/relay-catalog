apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-gpt-4o
    owner:
        kind: provider
        name: azure
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-4o
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    deprecation:
        status: sunset
        sunsetDate: "2026-03-01"
    snapshots:
        - name: azure-gpt-4o
          originalName: azure/gpt-4o
        - name: azure-gpt-4o-2024-05-13
          releasedAt: "2024-05-13"
          originalName: azure/gpt-4o-2024-05-13
        - name: azure-gpt-4o-2024-08-06
          releasedAt: "2024-08-06"
          originalName: azure/gpt-4o-2024-08-06
        - name: azure-gpt-4o-2024-11-20
          releasedAt: "2024-11-20"
          originalName: azure/gpt-4o-2024-11-20
    pointer: azure-gpt-4o

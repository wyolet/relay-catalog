# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-o3
    owner:
        kind: provider
        name: azure
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    deprecation:
        status: sunset
        sunsetDate: "2026-04-16"
    snapshots:
        - name: azure-o3
          originalName: azure/o3
        - name: azure-o3-2025-04-16
          releasedAt: "2025-04-16"
          originalName: azure/o3-2025-04-16
    pointer: azure-o3

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-o3-mini
    owner:
        kind: provider
        name: azure
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/o3-mini
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        promptCache: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    snapshots:
        - name: azure-o3-mini
          originalName: azure/o3-mini
        - name: azure-o3-mini-2025-01-31
          releasedAt: "2025-01-31"
          originalName: azure/o3-mini-2025-01-31
    pointer: azure-o3-mini

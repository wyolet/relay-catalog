apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-5-instant
    displayName: GPT-5.5 Instant
    owner:
        kind: provider
        name: zenmux
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    knowledgeCutoff: "2025-12-01"
    releaseDate: "2026-05-05"
    enabled: true
    snapshots:
        - name: openai-gpt-5-5-instant
          releasedAt: "2026-05-05"
          originalName: openai/gpt-5.5-instant
    pointer: openai-gpt-5-5-instant

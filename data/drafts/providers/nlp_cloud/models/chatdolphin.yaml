# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: chatdolphin
    owner:
        kind: provider
        name: nlp_cloud
    labels:
        family: chatdolphin
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: nlp_cloud
          upstreamName: chatdolphin
          adapter: openai
    family: chatdolphin
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    snapshots:
        - name: chatdolphin
    pointer: chatdolphin

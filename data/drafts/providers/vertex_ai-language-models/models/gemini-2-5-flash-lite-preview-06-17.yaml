# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-2-5-flash-lite-preview-06-17
    owner:
        kind: provider
        name: vertex_ai-language-models
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-language-models
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65535
    contextWindowTotal: 1048576
    deprecation:
        status: sunset
        sunsetDate: "2025-11-18"
    snapshots:
        - name: gemini-2-5-flash-lite-preview-06-17
          originalName: gemini-2.5-flash-lite-preview-06-17
    pointer: gemini-2-5-flash-lite-preview-06-17

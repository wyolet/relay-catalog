# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-2-5-computer-use-preview-10-2025
    owner:
        kind: provider
        name: vertex_ai-language-models
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-language-models
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        computerUse: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 64000
    contextWindowTotal: 128000
    snapshots:
        - name: gemini-2-5-computer-use-preview-10-2025
          originalName: gemini-2.5-computer-use-preview-10-2025
    pointer: gemini-2-5-computer-use-preview-10-2025

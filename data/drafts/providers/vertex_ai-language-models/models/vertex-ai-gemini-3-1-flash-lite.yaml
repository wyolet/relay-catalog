# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vertex-ai-gemini-3-1-flash-lite
    owner:
        kind: provider
        name: vertex_ai-language-models
    labels:
        family: vertex
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-language-models
          adapter: openai
    family: vertex
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    snapshots:
        - name: vertex-ai-gemini-3-1-flash-lite-preview
          originalName: vertex_ai/gemini-3.1-flash-lite-preview
    pointer: vertex-ai-gemini-3-1-flash-lite-preview

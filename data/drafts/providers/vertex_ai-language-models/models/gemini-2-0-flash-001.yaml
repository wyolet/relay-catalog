# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-2-0-flash-001
    owner:
        kind: provider
        name: vertex_ai-language-models
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-language-models
          upstreamName: gemini-2.0-flash-001
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        webSearch: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
            - audio
    contextWindowInput: 1048576
    contextWindowOutput: 8192
    contextWindowTotal: 1048576
    deprecation:
        status: deprecated
        sunsetDate: "2026-06-01"
    snapshots:
        - name: gemini-2-0-flash-001
          originalName: gemini-2.0-flash-001
    pointer: gemini-2-0-flash-001

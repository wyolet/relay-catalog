apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-1-pro
    owner:
        kind: provider
        name: vertex_ai-language-models
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-language-models
          upstreamName: gemini-3.1-pro-preview
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    snapshots:
        - name: gemini-3-1-pro-preview
          originalName: gemini-3.1-pro-preview
    pointer: gemini-3-1-pro-preview

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: whisper-large-v3
    displayName: Whisper Large V3
    owner:
        kind: provider
        name: groq
    labels:
        family: whisper
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: whisper
    capabilities:
        chat: true
        streaming: true
        audio: true
        audioInput: true
        systemMessages: true
    modalities:

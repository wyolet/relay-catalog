    contextWindowInput: 448
    contextWindowOutput: 448
    contextWindowTotal: 448
    maxOutputTokens: 448
    knowledgeCutoff: 2023-09
    releaseDate: "2023-09-01"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: whisper-large-v3
          releasedAt: "2023-09-01"
    pointer: whisper-large-v3

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: replicate-deepseek-ai-deepseek-v3
    owner:
        kind: provider
        name: replicate
    labels:
        family: replicate
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: replicate
          upstreamName: replicate/deepseek-ai/deepseek-v3
          adapter: openai
    family: replicate
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 8192
    contextWindowTotal: 65536
    snapshots:
        - name: replicate-deepseek-ai-deepseek-v3
          originalName: replicate/deepseek-ai/deepseek-v3
    pointer: replicate-deepseek-ai-deepseek-v3

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: replicateopenai-gpt-oss-20b
    owner:
        kind: provider
        name: replicate
    labels:
        family: replicateopenai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: replicate
          adapter: openai
    family: replicateopenai
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: replicateopenai-gpt-oss-20b
          originalName: replicateopenai/gpt-oss-20b
    pointer: replicateopenai-gpt-oss-20b

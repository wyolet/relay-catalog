# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: replicate-openai-gpt-4-1-mini
    owner:
        kind: provider
        name: replicate
    labels:
        family: replicate
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: replicate
          adapter: openai
    family: replicate
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    snapshots:
        - name: replicate-openai-gpt-4-1-mini
          originalName: replicate/openai/gpt-4.1-mini
    pointer: replicate-openai-gpt-4-1-mini

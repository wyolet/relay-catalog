apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-ai-deepseek-v3-2
    displayName: DeepSeek V3.2
    owner:
        kind: provider
        name: abacus
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    releaseDate: "2025-06-15"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: deepseek-ai-deepseek-v3-2
          releasedAt: "2025-06-15"
          originalName: deepseek-ai/DeepSeek-V3.2
    pointer: deepseek-ai-deepseek-v3-2

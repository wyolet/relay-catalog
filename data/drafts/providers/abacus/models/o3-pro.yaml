apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o3-pro
    displayName: o3-pro
    owner:
        kind: provider
        name: abacus
    labels:
        family: o-pro
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: o-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    knowledgeCutoff: 2024-05
    releaseDate: "2025-06-10"
    enabled: true
    snapshots:
        - name: o3-pro
          releasedAt: "2025-06-10"
    pointer: o3-pro

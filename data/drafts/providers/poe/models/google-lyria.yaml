apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-lyria
    displayName: Lyria
    owner:
        kind: provider
        name: poe
    labels:
        family: lyria
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: lyria
    capabilities:
        chat: true
        streaming: true
        tools: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - audio
    releaseDate: "2025-06-04"
    enabled: true
    snapshots:
        - name: google-lyria
          releasedAt: "2025-06-04"
          originalName: google/lyria
    pointer: google-lyria

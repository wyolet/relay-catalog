apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: trytako-tako
    displayName: Tako
    owner:
        kind: provider
        name: poe
    labels:
        family: tako
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: tako
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 2048
    contextWindowTotal: 2048
    releaseDate: "2024-08-15"
    enabled: true
    snapshots:
        - name: trytako-tako
          releasedAt: "2024-08-15"
          originalName: trytako/tako
    pointer: trytako-tako

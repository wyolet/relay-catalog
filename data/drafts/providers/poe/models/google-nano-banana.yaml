apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-nano-banana
    displayName: Nano-Banana
    owner:
        kind: provider
        name: poe
    labels:
        family: nano-banana
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nano-banana
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
            - image
    contextWindowInput: 65536
    contextWindowTotal: 65536
    releaseDate: "2025-08-21"
    enabled: true
    snapshots:
        - name: google-nano-banana
          releasedAt: "2025-08-21"
          originalName: google/nano-banana
    pointer: google-nano-banana

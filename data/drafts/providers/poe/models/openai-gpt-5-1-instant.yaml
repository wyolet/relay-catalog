apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-1-instant
    displayName: GPT-5.1-Instant
    owner:
        kind: provider
        name: poe
    labels:
        family: gpt
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2025-11-12"
    enabled: true
    snapshots:
        - name: openai-gpt-5-1-instant
          releasedAt: "2025-11-12"
          originalName: openai/gpt-5.1-instant
    pointer: openai-gpt-5-1-instant

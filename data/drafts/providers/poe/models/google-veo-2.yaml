apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: google-veo-2
    displayName: Veo-2
    owner:
        kind: provider
        name: poe
    labels:
        family: veo
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: veo
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - video
    contextWindowInput: 480
    contextWindowTotal: 480
    releaseDate: "2024-12-02"
    enabled: true
    snapshots:
        - name: google-veo-2
          releasedAt: "2024-12-02"
          originalName: google/veo-2
    pointer: google-veo-2

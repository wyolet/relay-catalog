apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4-classic
    displayName: GPT-4-Classic
    owner:
        kind: provider
        name: poe
    labels:
        family: gpt
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 4096
    contextWindowTotal: 8192
    maxOutputTokens: 4096
    releaseDate: "2024-03-25"
    enabled: true
    snapshots:
        - name: openai-gpt-4-classic
          releasedAt: "2024-03-25"
          originalName: openai/gpt-4-classic
        - name: openai-gpt-4-classic-0314
          releasedAt: "2024-08-26"
          originalName: openai/gpt-4-classic-0314
    pointer: openai-gpt-4-classic

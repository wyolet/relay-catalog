apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4o-mini-search
    displayName: GPT-4o-mini-Search
    owner:
        kind: provider
        name: poe
    labels:
        family: gpt-mini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-mini
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    releaseDate: "2025-03-11"
    enabled: true
    snapshots:
        - name: openai-gpt-4o-mini-search
          releasedAt: "2025-03-11"
          originalName: openai/gpt-4o-mini-search
    pointer: openai-gpt-4o-mini-search

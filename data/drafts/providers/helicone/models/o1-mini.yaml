apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o1-mini
    displayName: 'OpenAI: o1-mini'
    owner:
        kind: provider
        name: helicone
    labels:
        family: o-mini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: o-mini
    capabilities:
        chat: true
        streaming: true
        promptCache: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 65536
    contextWindowTotal: 128000
    maxOutputTokens: 65536
    knowledgeCutoff: 2025-01
    releaseDate: "2025-01-01"
    enabled: true
    snapshots:
        - name: o1-mini
          releasedAt: "2025-01-01"
    pointer: o1-mini

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v3-1-terminus
    displayName: DeepSeek V3.1 Terminus
    owner:
        kind: provider
        name: helicone
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    knowledgeCutoff: 2025-09
    releaseDate: "2025-09-22"
    enabled: true
    snapshots:
        - name: deepseek-v3-1-terminus
          releasedAt: "2025-09-22"
          originalName: deepseek-v3.1-terminus
    pointer: deepseek-v3-1-terminus

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: sonar
    displayName: Perplexity Sonar
    owner:
        kind: provider
        name: helicone
    labels:
        family: sonar
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: sonar
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 127000
    contextWindowOutput: 4096
    contextWindowTotal: 127000
    maxOutputTokens: 4096
    knowledgeCutoff: 2025-01
    releaseDate: "2025-01-27"
    enabled: true
    snapshots:
        - name: sonar
          releasedAt: "2025-01-27"
    pointer: sonar

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: github-copilot-gpt-4
    owner:
        kind: provider
        name: github_copilot
    labels:
        family: github
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: github_copilot
          adapter: openai
    family: github
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 4096
    contextWindowTotal: 32768
    snapshots:
        - name: github-copilot-gpt-4
          originalName: github_copilot/gpt-4
    pointer: github-copilot-gpt-4

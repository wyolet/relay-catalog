apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: github-copilot-claude-sonnet-4
    owner:
        kind: provider
        name: github_copilot
    labels:
        family: github
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: github_copilot
          upstreamName: github_copilot/claude-sonnet-4
          adapter: openai
    family: github
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16000
    contextWindowTotal: 128000
    snapshots:
        - name: github-copilot-claude-sonnet-4
          originalName: github_copilot/claude-sonnet-4
    pointer: github-copilot-claude-sonnet-4

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: github-copilot-gpt-4o-mini
    owner:
        kind: provider
        name: github_copilot
    labels:
        family: github
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: github_copilot
          adapter: openai
    family: github
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 64000
    contextWindowOutput: 4096
    contextWindowTotal: 64000
    snapshots:
        - name: github-copilot-gpt-4o-mini
          originalName: github_copilot/gpt-4o-mini
        - name: github-copilot-gpt-4o-mini-2024-07-18
          releasedAt: "2024-07-18"
          originalName: github_copilot/gpt-4o-mini-2024-07-18
    pointer: github-copilot-gpt-4o-mini

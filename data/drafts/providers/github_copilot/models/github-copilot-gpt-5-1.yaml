# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: github-copilot-gpt-5-1
    owner:
        kind: provider
        name: github_copilot
    labels:
        family: github
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: github_copilot
          upstreamName: github_copilot/gpt-5.1
          adapter: openai
    family: github
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 64000
    contextWindowTotal: 128000
    snapshots:
        - name: github-copilot-gpt-5-1
          originalName: github_copilot/gpt-5.1
    pointer: github-copilot-gpt-5-1

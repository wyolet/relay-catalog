# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-openai-gpt-5-2-chat
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/openai/gpt-5.2-chat
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: openrouter-openai-gpt-5-2-chat
          originalName: openrouter/openai/gpt-5.2-chat
    pointer: openrouter-openai-gpt-5-2-chat

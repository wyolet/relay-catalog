apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-openai-gpt-5-2
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/openai/gpt-5.2
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 272000
    snapshots:
        - name: openrouter-openai-gpt-5-2
          originalName: openrouter/openai/gpt-5.2
    pointer: openrouter-openai-gpt-5-2

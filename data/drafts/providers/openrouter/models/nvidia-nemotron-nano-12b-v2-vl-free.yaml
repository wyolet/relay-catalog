    contextWindowOutput: 128000
    contextWindowTotal: 128000
    maxOutputTokens: 128000
    releaseDate: "2025-10-28"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nvidia-nemotron-nano-12b-v2-vl-free
          releasedAt: "2025-10-28"
          originalName: nvidia/nemotron-nano-12b-v2-vl:free
    pointer: nvidia-nemotron-nano-12b-v2-vl-free

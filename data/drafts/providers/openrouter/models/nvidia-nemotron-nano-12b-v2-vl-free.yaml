apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia-nemotron-nano-12b-v2-vl-free
    displayName: Nemotron Nano 12B 2 VL (free)
    owner:
        kind: provider
        name: openrouter
    labels:
        family: nemotron
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nemotron
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        systemMessages: true

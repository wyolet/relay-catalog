# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-openrouter-bodybuilder
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    snapshots:
        - name: openrouter-openrouter-bodybuilder
          originalName: openrouter/openrouter/bodybuilder
    pointer: openrouter-openrouter-bodybuilder

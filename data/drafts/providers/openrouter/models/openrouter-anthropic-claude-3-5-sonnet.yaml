# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-anthropic-claude-3-5-sonnet
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        computerUse: true
        assistantPrefill: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8192
    contextWindowTotal: 200000
    snapshots:
        - name: openrouter-anthropic-claude-3-5-sonnet
          originalName: openrouter/anthropic/claude-3.5-sonnet
    pointer: openrouter-anthropic-claude-3-5-sonnet

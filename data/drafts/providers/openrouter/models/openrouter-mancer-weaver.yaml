# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-mancer-weaver
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/mancer/weaver
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8000
    contextWindowOutput: 2000
    contextWindowTotal: 8000
    snapshots:
        - name: openrouter-mancer-weaver
          originalName: openrouter/mancer/weaver
    pointer: openrouter-mancer-weaver

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-anthropic-claude-3-haiku
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/anthropic/claude-3-haiku
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 4096
    contextWindowTotal: 200000
    snapshots:
        - name: openrouter-anthropic-claude-3-haiku
          originalName: openrouter/anthropic/claude-3-haiku
    pointer: openrouter-anthropic-claude-3-haiku

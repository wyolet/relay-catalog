# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-google-gemini-3-pro
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65535
    contextWindowTotal: 1048576
    snapshots:
        - name: openrouter-google-gemini-3-pro-preview
          originalName: openrouter/google/gemini-3-pro-preview
    pointer: openrouter-google-gemini-3-pro-preview

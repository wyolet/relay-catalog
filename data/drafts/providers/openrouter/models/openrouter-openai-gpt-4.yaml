# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-openai-gpt-4
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8191
    contextWindowOutput: 4096
    contextWindowTotal: 8191
    snapshots:
        - name: openrouter-openai-gpt-4
          originalName: openrouter/openai/gpt-4
    pointer: openrouter-openai-gpt-4

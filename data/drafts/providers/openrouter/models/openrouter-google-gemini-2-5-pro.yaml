# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-google-gemini-2-5-pro
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/google/gemini-2.5-pro
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
            - audio
    contextWindowInput: 1048576
    contextWindowOutput: 8192
    contextWindowTotal: 1048576
    snapshots:
        - name: openrouter-google-gemini-2-5-pro
          originalName: openrouter/google/gemini-2.5-pro
    pointer: openrouter-google-gemini-2-5-pro

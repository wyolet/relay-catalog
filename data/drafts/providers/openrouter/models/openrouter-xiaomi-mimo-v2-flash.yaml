# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-xiaomi-mimo-v2-flash
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 16384
    contextWindowTotal: 262144
    snapshots:
        - name: openrouter-xiaomi-mimo-v2-flash
          originalName: openrouter/xiaomi/mimo-v2-flash
    pointer: openrouter-xiaomi-mimo-v2-flash

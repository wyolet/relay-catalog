# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-openai-o3-mini-high
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/openai/o3-mini-high
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 65536
    contextWindowTotal: 128000
    snapshots:
        - name: openrouter-openai-o3-mini-high
          originalName: openrouter/openai/o3-mini-high
    pointer: openrouter-openai-o3-mini-high

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter-mistralai-mistral-large
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/mistralai/mistral-large
          adapter: openai
    family: openrouter
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8191
    contextWindowTotal: 128000
    snapshots:
        - name: openrouter-mistralai-mistral-large
          originalName: openrouter/mistralai/mistral-large
    pointer: openrouter-mistralai-mistral-large

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: watsonx-core42-jais-13b-chat
    owner:
        kind: provider
        name: watsonx
    labels:
        family: watsonx
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: watsonx
          adapter: openai
    family: watsonx
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: watsonx-core42-jais-13b-chat
          originalName: watsonx/core42/jais-13b-chat
    pointer: watsonx-core42-jais-13b-chat

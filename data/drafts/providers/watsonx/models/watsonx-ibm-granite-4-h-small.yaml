# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: watsonx-ibm-granite-4-h-small
    owner:
        kind: provider
        name: watsonx
    labels:
        family: watsonx
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: watsonx
          adapter: openai
    family: watsonx
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 20480
    contextWindowOutput: 20480
    contextWindowTotal: 20480
    snapshots:
        - name: watsonx-ibm-granite-4-h-small
          originalName: watsonx/ibm/granite-4-h-small
    pointer: watsonx-ibm-granite-4-h-small

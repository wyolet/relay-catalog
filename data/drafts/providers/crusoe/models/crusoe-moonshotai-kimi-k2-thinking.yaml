# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: crusoe-moonshotai-kimi-k2-thinking
    owner:
        kind: provider
        name: crusoe
    labels:
        family: crusoe
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: crusoe
          upstreamName: crusoe/moonshotai/Kimi-K2-Thinking
          adapter: openai
    family: crusoe
    capabilities:
        chat: true
        streaming: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    snapshots:
        - name: crusoe-moonshotai-kimi-k2-thinking
          originalName: crusoe/moonshotai/Kimi-K2-Thinking
    pointer: crusoe-moonshotai-kimi-k2-thinking

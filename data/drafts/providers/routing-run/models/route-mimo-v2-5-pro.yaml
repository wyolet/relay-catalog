apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: route-mimo-v2-5-pro
    displayName: MiMo V2.5 Pro
    owner:
        kind: provider
        name: routing-run
    labels:
        family: mimo
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: mimo
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true

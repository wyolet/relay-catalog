    knowledgeCutoff: 2024-12
    releaseDate: "2026-04-22"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: route-mimo-v2-5-pro
          releasedAt: "2026-04-22"
          originalName: route/mimo-v2.5-pro
    pointer: route-mimo-v2-5-pro

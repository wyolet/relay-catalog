# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: palm-chat-bison-001
    owner:
        kind: provider
        name: palm
    labels:
        family: palm
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: palm
          upstreamName: palm/chat-bison-001
          adapter: openai
    family: palm
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 4096
    contextWindowTotal: 8192
    snapshots:
        - name: palm-chat-bison-001
          originalName: palm/chat-bison-001
    pointer: palm-chat-bison-001

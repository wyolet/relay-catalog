# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: minimax-minimax-m2
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: minimax
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: minimax.minimax-m2
          adapter: openai
    family: minimax
    capabilities:
        chat: true
        streaming: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: minimax-minimax-m2
          originalName: minimax.minimax-m2
    pointer: minimax-minimax-m2

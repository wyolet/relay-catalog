# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: eu-amazon-nova-lite-v1-0
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: eu
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: eu.amazon.nova-lite-v1:0
          adapter: openai
    family: eu
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 10000
    contextWindowTotal: 300000
    snapshots:
        - name: eu-amazon-nova-lite-v1-0
          originalName: eu.amazon.nova-lite-v1:0
    pointer: eu-amazon-nova-lite-v1-0

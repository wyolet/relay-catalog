apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot-kimi-k2-thinking
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: moonshot
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: moonshot.kimi-k2-thinking
          adapter: openai
    family: moonshot
    capabilities:
        chat: true
        streaming: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: moonshot-kimi-k2-thinking
          originalName: moonshot.kimi-k2-thinking
    pointer: moonshot-kimi-k2-thinking

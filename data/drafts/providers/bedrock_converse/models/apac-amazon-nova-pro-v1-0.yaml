# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: apac-amazon-nova-pro-v1-0
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: apac
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: apac.amazon.nova-pro-v1:0
          adapter: openai
    family: apac
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 10000
    contextWindowTotal: 300000
    snapshots:
        - name: apac-amazon-nova-pro-v1-0
          originalName: apac.amazon.nova-pro-v1:0
    pointer: apac-amazon-nova-pro-v1-0

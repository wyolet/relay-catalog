apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-ministral-3-3b-instruct
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: mistral.ministral-3-3b-instruct
          adapter: openai
    family: mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: mistral-ministral-3-3b-instruct
          originalName: mistral.ministral-3-3b-instruct
    pointer: mistral-ministral-3-3b-instruct

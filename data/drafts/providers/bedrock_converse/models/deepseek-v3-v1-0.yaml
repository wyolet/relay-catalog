# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v3-v1-0
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          adapter: openai
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 163840
    contextWindowOutput: 81920
    contextWindowTotal: 163840
    snapshots:
        - name: deepseek-v3-v1-0
          originalName: deepseek.v3-v1:0
    pointer: deepseek-v3-v1-0

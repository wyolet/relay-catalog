# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: writer-palmyra-x4-v1-0
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: writer
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: writer.palmyra-x4-v1:0
          adapter: openai
    family: writer
    capabilities:
        chat: true
        streaming: true
        tools: true
        fileInput: true
    modalities:
        input:
            - text
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: writer-palmyra-x4-v1-0
          originalName: writer.palmyra-x4-v1:0
    pointer: writer-palmyra-x4-v1-0

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshotai-kimi-k2-5
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: moonshotai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          adapter: openai
    family: moonshotai
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: eu-anthropic-claude-opus-4-6-v1
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: eu
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          adapter: openai
    family: eu
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        computerUse: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    snapshots:
        - name: eu-anthropic-claude-opus-4-6-v1
          originalName: eu.anthropic.claude-opus-4-6-v1
    pointer: eu-anthropic-claude-opus-4-6-v1

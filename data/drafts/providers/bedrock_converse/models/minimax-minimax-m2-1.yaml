apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: minimax-minimax-m2-1
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: minimax
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: minimax.minimax-m2.1
          adapter: openai
    family: minimax
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 196000
    contextWindowOutput: 8192
    contextWindowTotal: 196000
    snapshots:
        - name: minimax-minimax-m2-1
          originalName: minimax.minimax-m2.1
    pointer: minimax-minimax-m2-1

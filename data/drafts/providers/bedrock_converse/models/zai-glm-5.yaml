apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: zai-glm-5
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: zai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: zai.glm-5
          adapter: openai
    family: zai
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 128000
    contextWindowTotal: 200000
    snapshots:
        - name: zai-glm-5
          originalName: zai.glm-5
    pointer: zai-glm-5

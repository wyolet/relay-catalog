    contextWindowTotal: 131072
    maxOutputTokens: 8192
    knowledgeCutoff: 2024-07
    releaseDate: "2024-12-26"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: public-deepseek-v3
          releasedAt: "2024-12-26"
          originalName: public/deepseek-v3
    pointer: public-deepseek-v3

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: public-deepseek-v3
    displayName: DeepSeek V3
    owner:
        kind: provider
        name: drun
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text

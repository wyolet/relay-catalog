apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: dashscope-qwen-max
    owner:
        kind: provider
        name: dashscope
    labels:
        family: dashscope
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: dashscope
          upstreamName: dashscope/qwen-max
          adapter: openai
    family: dashscope
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 30720
    contextWindowOutput: 8192
    contextWindowTotal: 30720
    snapshots:
        - name: dashscope-qwen-max
          originalName: dashscope/qwen-max
    pointer: dashscope-qwen-max

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: dashscope-qwen-coder
    owner:
        kind: provider
        name: dashscope
    labels:
        family: dashscope
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: dashscope
          upstreamName: dashscope/qwen-coder
          adapter: openai
    family: dashscope
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 16384
    contextWindowTotal: 1000000
    snapshots:
        - name: dashscope-qwen-coder
          originalName: dashscope/qwen-coder
    pointer: dashscope-qwen-coder

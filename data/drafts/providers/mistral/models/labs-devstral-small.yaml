apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: labs-devstral-small
    displayName: Devstral Small 2
    owner:
        kind: provider
        name: mistral
    labels:
        family: devstral
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: devstral
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 256000
    contextWindowTotal: 256000
    maxOutputTokens: 256000
    knowledgeCutoff: 2025-12
    releaseDate: "2025-12-09"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: labs-devstral-small-2512
          releasedAt: "2025-12-09"
    pointer: labs-devstral-small-2512

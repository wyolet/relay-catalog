apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: pixtral-large
    displayName: Pixtral Large (latest)
    owner:
        kind: provider
        name: mistral
    labels:
        family: pixtral
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: pixtral
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    maxOutputTokens: 128000
    knowledgeCutoff: 2024-11
    releaseDate: "2024-11-01"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: pixtral-large-latest
          releasedAt: "2024-11-01"
    pointer: pixtral-large-latest

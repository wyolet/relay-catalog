apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-devstral-medium
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          upstreamName: mistral/devstral-medium-latest
          adapter: openai
    family: mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        structuredOutputs: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 256000
    contextWindowTotal: 256000
    snapshots:
        - name: mistral-devstral-medium-latest
          originalName: mistral/devstral-medium-latest
    pointer: mistral-devstral-medium-latest

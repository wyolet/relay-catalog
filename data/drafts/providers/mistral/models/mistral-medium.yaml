apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-medium
    displayName: Mistral Medium (latest)
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral-medium
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: mistral-medium
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    maxOutputTokens: 262144
    knowledgeCutoff: 2025-05
    releaseDate: "2025-08-12"
    enabled: true
    snapshots:
        - name: mistral-medium-2505
          releasedAt: "2025-05-07"
        - name: mistral-medium-2508
          releasedAt: "2025-08-12"
        - name: mistral-medium-2604
          releasedAt: "2026-04-29"
        - name: mistral-medium-latest
          releasedAt: "2025-08-12"
    pointer: mistral-medium-latest

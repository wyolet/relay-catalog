# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-magistral-medium-2506
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          adapter: openai
    family: mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        structuredOutputs: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 40000
    contextWindowOutput: 40000
    contextWindowTotal: 40000
    snapshots:
        - name: mistral-magistral-medium-2506
          originalName: mistral/magistral-medium-2506
    pointer: mistral-magistral-medium-2506

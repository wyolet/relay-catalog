# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot-moonshot-v1-32k-vision
    owner:
        kind: provider
        name: moonshot
    labels:
        family: moonshot
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: moonshot
          upstreamName: moonshot/moonshot-v1-32k-vision-preview
          adapter: openai
    family: moonshot
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 32768
    contextWindowTotal: 32768
    snapshots:
        - name: moonshot-moonshot-v1-32k-vision-preview
          originalName: moonshot/moonshot-v1-32k-vision-preview
    pointer: moonshot-moonshot-v1-32k-vision-preview

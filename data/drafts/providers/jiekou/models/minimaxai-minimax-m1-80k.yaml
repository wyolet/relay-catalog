    contextWindowTotal: 1000000
    maxOutputTokens: 40000
    releaseDate: 2026-01
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: minimaxai-minimax-m1-80k
          releasedAt: 2026-01
          originalName: minimaxai/minimax-m1-80k
    pointer: minimaxai-minimax-m1-80k

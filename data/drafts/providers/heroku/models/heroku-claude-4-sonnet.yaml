# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: heroku-claude-4-sonnet
    owner:
        kind: provider
        name: heroku
    labels:
        family: heroku
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: heroku
          upstreamName: heroku/claude-4-sonnet
          adapter: openai
    family: heroku
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8192
    contextWindowTotal: 200000
    snapshots:
        - name: heroku-claude-4-sonnet
          originalName: heroku/claude-4-sonnet
    pointer: heroku-claude-4-sonnet

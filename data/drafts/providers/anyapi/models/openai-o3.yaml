apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o3
    displayName: o3
    owner:
        kind: provider
        name: anyapi
    labels:
        family: o
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: o
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    knowledgeCutoff: 2024-05
    releaseDate: "2025-04-16"
    enabled: true
    snapshots:
        - name: openai-o3
          releasedAt: "2025-04-16"
          originalName: openai/o3
    pointer: openai-o3

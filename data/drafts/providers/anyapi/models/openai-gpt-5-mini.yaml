apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-5-mini
    displayName: GPT-5 Mini
    owner:
        kind: provider
        name: anyapi
    labels:
        family: gpt-mini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-mini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    maxOutputTokens: 128000
    knowledgeCutoff: "2024-05-30"
    releaseDate: "2025-08-07"
    enabled: true
    snapshots:
        - name: openai-gpt-5-mini
          releasedAt: "2025-08-07"
          originalName: openai/gpt-5-mini
    pointer: openai-gpt-5-mini

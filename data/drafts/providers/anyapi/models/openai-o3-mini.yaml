apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o3-mini
    displayName: o3-mini
    owner:
        kind: provider
        name: anyapi
    labels:
        family: o-mini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: o-mini
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    maxOutputTokens: 100000
    knowledgeCutoff: 2024-05
    releaseDate: "2024-12-20"
    enabled: true
    snapshots:
        - name: openai-o3-mini
          releasedAt: "2024-12-20"
          originalName: openai/o3-mini
    pointer: openai-o3-mini

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistralai-devstral
    displayName: Devstral 2
    owner:
        kind: provider
        name: anyapi
    labels:
        family: devstral
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: devstral
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    maxOutputTokens: 262144
    knowledgeCutoff: 2025-12
    releaseDate: "2025-12-09"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: mistralai-devstral-2512
          releasedAt: "2025-12-09"
          originalName: mistralai/devstral-2512
    pointer: mistralai-devstral-2512

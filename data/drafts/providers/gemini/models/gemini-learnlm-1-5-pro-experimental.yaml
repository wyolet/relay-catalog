apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-learnlm-1-5-pro-experimental
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/learnlm-1.5-pro-experimental
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 32767
    contextWindowOutput: 8192
    contextWindowTotal: 32767
    snapshots:
        - name: gemini-learnlm-1-5-pro-experimental
          originalName: gemini/learnlm-1.5-pro-experimental
    pointer: gemini-learnlm-1-5-pro-experimental

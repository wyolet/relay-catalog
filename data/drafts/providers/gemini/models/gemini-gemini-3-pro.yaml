apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-gemini-3-pro
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/gemini-3-pro-preview
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65535
    contextWindowTotal: 1048576
    deprecation:
        status: sunset
        sunsetDate: "2026-03-09"
    snapshots:
        - name: gemini-gemini-3-pro-preview
          originalName: gemini/gemini-3-pro-preview
    pointer: gemini-gemini-3-pro-preview

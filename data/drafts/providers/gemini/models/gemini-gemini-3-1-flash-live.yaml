apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-gemini-3-1-flash-live
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/gemini-3.1-flash-live-preview
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        webSearch: true
        audioInput: true
        audioOutput: true
    modalities:
        input:
            - text
            - image
            - audio
        output:
            - text
            - audio
    contextWindowInput: 131072
    contextWindowOutput: 65536
    contextWindowTotal: 131072
    snapshots:
        - name: gemini-gemini-3-1-flash-live-preview
          originalName: gemini/gemini-3.1-flash-live-preview
    pointer: gemini-gemini-3-1-flash-live-preview

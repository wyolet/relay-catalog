apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-gemini-2-5-pro-preview-tts
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/gemini-2.5-pro-preview-tts
          adapter: openai
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        webSearch: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65535
    contextWindowTotal: 1048576
    snapshots:
        - name: gemini-gemini-2-5-pro-preview-tts
          originalName: gemini/gemini-2.5-pro-preview-tts
    pointer: gemini-gemini-2-5-pro-preview-tts

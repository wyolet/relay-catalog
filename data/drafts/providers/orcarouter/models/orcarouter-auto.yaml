apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: orcarouter-auto
    displayName: OrcaRouter Auto
    owner:
        kind: provider
        name: orcarouter
    labels:
        family: auto
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: auto
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    releaseDate: "2025-01-01"
    enabled: true
    snapshots:
        - name: orcarouter-auto
          releasedAt: "2025-01-01"
          originalName: orcarouter/auto
    pointer: orcarouter-auto

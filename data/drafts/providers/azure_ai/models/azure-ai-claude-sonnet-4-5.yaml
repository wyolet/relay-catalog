# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-ai-claude-sonnet-4-5
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/claude-sonnet-4-5
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        computerUse: true
        fileInput: true
        assistantPrefill: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 64000
    contextWindowTotal: 200000
    snapshots:
        - name: azure-ai-claude-sonnet-4-5
          originalName: azure_ai/claude-sonnet-4-5
    pointer: azure-ai-claude-sonnet-4-5

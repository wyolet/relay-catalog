# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-ai-jais-30b-chat
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: azure-ai-jais-30b-chat
          originalName: azure_ai/jais-30b-chat
    pointer: azure-ai-jais-30b-chat

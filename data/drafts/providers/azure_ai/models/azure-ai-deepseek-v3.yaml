apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-ai-deepseek-v3
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/deepseek-v3
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: azure-ai-deepseek-v3
          originalName: azure_ai/deepseek-v3
    pointer: azure-ai-deepseek-v3

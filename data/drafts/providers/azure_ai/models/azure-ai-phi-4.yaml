# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure-ai-phi-4
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          adapter: openai
    family: azure
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    snapshots:
        - name: azure-ai-phi-4
          originalName: azure_ai/Phi-4
    pointer: azure-ai-phi-4

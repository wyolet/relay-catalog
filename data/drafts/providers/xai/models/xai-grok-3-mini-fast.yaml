# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: xai-grok-3-mini-fast
    owner:
        kind: provider
        name: xai
    labels:
        family: xai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: xai
          upstreamName: xai/grok-3-mini-fast
          adapter: openai
    family: xai
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        webSearch: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 131072
    contextWindowTotal: 131072
    snapshots:
        - name: xai-grok-3-mini-fast
          originalName: xai/grok-3-mini-fast
        - name: xai-grok-3-mini-fast-latest
          originalName: xai/grok-3-mini-fast-latest
    pointer: xai-grok-3-mini-fast

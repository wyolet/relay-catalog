# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: xai-grok-vision-beta
    owner:
        kind: provider
        name: xai
    labels:
        family: xai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: xai
          upstreamName: xai/grok-vision-beta
          adapter: openai
    family: xai
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        webSearch: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: xai-grok-vision-beta
          originalName: xai/grok-vision-beta
    pointer: xai-grok-vision-beta

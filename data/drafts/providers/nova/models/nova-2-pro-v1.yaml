apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nova-2-pro-v1
    displayName: Nova 2 Pro
    owner:
        kind: provider
        name: nova
    labels:
        family: nova-pro
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nova-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - video
            - pdf
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 64000
    contextWindowTotal: 1000000
    maxOutputTokens: 64000
    releaseDate: "2025-12-03"
    enabled: true
    snapshots:
        - name: nova-2-pro-v1
          releasedAt: "2025-12-03"
    pointer: nova-2-pro-v1

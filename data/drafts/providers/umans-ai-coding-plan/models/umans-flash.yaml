apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: umans-flash
    displayName: Umans Flash
    owner:
        kind: provider
        name: umans-ai-coding-plan
    labels:
        family: qwen
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: qwen
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    maxOutputTokens: 262144
    releaseDate: "2026-04-17"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: umans-flash
          releasedAt: "2026-04-17"
    pointer: umans-flash

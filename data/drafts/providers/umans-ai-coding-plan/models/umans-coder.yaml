apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: umans-coder
    displayName: Umans Coder
    owner:
        kind: provider
        name: umans-ai-coding-plan
    labels:
        family: kimi-k2.6
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: kimi-k2.6
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    maxOutputTokens: 262144
    knowledgeCutoff: 2025-01
    releaseDate: "2026-04-21"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: umans-coder
          releasedAt: "2026-04-21"
    pointer: umans-coder

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: command-light
    owner:
        kind: provider
        name: cohere_chat
    labels:
        family: command
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: cohere_chat
          adapter: openai
    family: command
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 4096
    contextWindowTotal: 4096
    snapshots:
        - name: command-light
    pointer: command-light

    name: nvidia-usdvalidate
    displayName: usdvalidate
    owner:
        kind: provider
        name: nvidia
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text

    maxOutputTokens: 4096
    releaseDate: "2024-07-24"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nvidia-usdvalidate
          releasedAt: "2024-07-24"
          originalName: nvidia/usdvalidate
    pointer: nvidia-usdvalidate

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia-usdcode
    displayName: usdcode
    owner:
        kind: provider
        name: nvidia
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    maxOutputTokens: 4096
    releaseDate: "2026-01-01"
    enabled: true
    snapshots:
        - name: nvidia-usdcode
          releasedAt: "2026-01-01"
          originalName: nvidia/usdcode
    pointer: nvidia-usdcode

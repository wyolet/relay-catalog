apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistralai-mistral-nemotron
    displayName: mistral-nemotron
    owner:
        kind: provider
        name: nvidia
    labels:
        family: nemotron
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nemotron
    capabilities:
        chat: true
        streaming: true
        tools: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    releaseDate: "2025-06-11"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: mistralai-mistral-nemotron
          releasedAt: "2025-06-11"
          originalName: mistralai/mistral-nemotron
    pointer: mistralai-mistral-nemotron

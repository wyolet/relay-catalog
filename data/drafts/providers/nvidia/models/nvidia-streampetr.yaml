apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia-streampetr
    displayName: streampetr
    owner:
        kind: provider
        name: nvidia
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - video
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    releaseDate: "2025-11-13"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nvidia-streampetr
          releasedAt: "2025-11-13"
          originalName: nvidia/streampetr
    pointer: nvidia-streampetr

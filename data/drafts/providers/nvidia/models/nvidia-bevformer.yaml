apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia-bevformer
    displayName: bevformer
    owner:
        kind: provider
        name: nvidia
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - video
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    maxOutputTokens: 8192
    releaseDate: "2025-03-18"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nvidia-bevformer
          releasedAt: "2025-03-18"
          originalName: nvidia/bevformer
    pointer: nvidia-bevformer

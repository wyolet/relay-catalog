apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia-active-speaker-detection
    displayName: Active Speaker Detection
    owner:
        kind: provider
        name: nvidia
    labels:
        source: models.dev
        source_version: "2026-06-09"
spec:
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - video
        output:
            - text
    contextWindowOutput: 4096
    maxOutputTokens: 4096
    releaseDate: "2026-04-16"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nvidia-active-speaker-detection
          releasedAt: "2026-04-16"
          originalName: nvidia/active-speaker-detection
    pointer: nvidia-active-speaker-detection

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen-qwen-image-edit
    displayName: Qwen Image Edit
    owner:
        kind: provider
        name: nvidia
    labels:
        family: qwen
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: qwen
    capabilities:
        chat: true
        streaming: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - image
    releaseDate: "2025-08-19"
    enabled: true
    snapshots:
        - name: qwen-qwen-image-edit
          releasedAt: "2025-08-19"
          originalName: qwen/qwen-image-edit
    pointer: qwen-qwen-image-edit

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-ai-deepseek-vl2
    displayName: deepseek-ai/deepseek-vl2
    owner:
        kind: provider
        name: siliconflow
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 4000
    contextWindowOutput: 4000
    contextWindowTotal: 4000
    maxOutputTokens: 4000
    releaseDate: "2024-12-13"
    enabled: true
    snapshots:
        - name: deepseek-ai-deepseek-vl2
          releasedAt: "2024-12-13"
          originalName: deepseek-ai/deepseek-vl2
    pointer: deepseek-ai-deepseek-vl2

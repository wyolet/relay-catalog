apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: big-pickle
    displayName: Big Pickle
    owner:
        kind: provider
        name: opencode
    labels:
        family: big-pickle
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: big-pickle
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 160000
    contextWindowOutput: 32000
    contextWindowTotal: 200000
    maxOutputTokens: 32000
    knowledgeCutoff: 2025-01
    releaseDate: "2025-10-17"
    enabled: true
    snapshots:
        - name: big-pickle
          releasedAt: "2025-10-17"
    pointer: big-pickle

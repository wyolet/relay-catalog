apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-flash
    displayName: Gemini 3 Flash
    owner:
        kind: provider
        name: opencode
    labels:
        family: gemini-flash
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gemini-flash
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        audio: true
        promptCache: true
        reasoning: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - video
            - audio
            - pdf
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    maxOutputTokens: 65536
    knowledgeCutoff: 2025-01
    releaseDate: "2025-12-17"
    enabled: true
    snapshots:
        - name: gemini-3-flash
          releasedAt: "2025-12-17"
    pointer: gemini-3-flash

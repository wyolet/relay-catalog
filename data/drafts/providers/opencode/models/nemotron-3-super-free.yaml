apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron-3-super-free
    displayName: Nemotron 3 Super Free
    owner:
        kind: provider
        name: opencode
    labels:
        family: nemotron-free
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: nemotron-free
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 204800
    contextWindowOutput: 128000
    contextWindowTotal: 204800
    maxOutputTokens: 128000
    knowledgeCutoff: 2026-02
    releaseDate: "2026-03-11"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: nemotron-3-super-free
          releasedAt: "2026-03-11"
    pointer: nemotron-3-super-free

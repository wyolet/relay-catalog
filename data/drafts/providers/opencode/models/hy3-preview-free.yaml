apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: hy3-preview-free
    displayName: Hy3 preview Free
    owner:
        kind: provider
        name: opencode
    labels:
        family: hy3-free
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: hy3-free
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 64000
    contextWindowTotal: 256000
    maxOutputTokens: 64000
    knowledgeCutoff: 2025-06
    releaseDate: "2026-04-20"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: hy3-preview-free
          releasedAt: "2026-04-20"
    pointer: hy3-preview-free

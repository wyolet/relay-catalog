# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: ovhcloud-gpt-oss-20b
    owner:
        kind: provider
        name: ovhcloud
    labels:
        family: ovhcloud
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ovhcloud
          upstreamName: ovhcloud/gpt-oss-20b
          adapter: openai
    family: ovhcloud
    capabilities:
        chat: true
        streaming: true
        reasoning: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 131000
    contextWindowOutput: 131000
    contextWindowTotal: 131000
    snapshots:
        - name: ovhcloud-gpt-oss-20b
          originalName: ovhcloud/gpt-oss-20b
    pointer: ovhcloud-gpt-oss-20b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: core42-jais-30b-chat
    displayName: JAIS 30b Chat
    owner:
        kind: provider
        name: github-models
    labels:
        family: jais
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: jais
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 2048
    contextWindowTotal: 8192
    maxOutputTokens: 2048
    knowledgeCutoff: 2023-03
    releaseDate: "2023-08-30"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: core42-jais-30b-chat
          releasedAt: "2023-08-30"
          originalName: core42/jais-30b-chat
    pointer: core42-jais-30b-chat

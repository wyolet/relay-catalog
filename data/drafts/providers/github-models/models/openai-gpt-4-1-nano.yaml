apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-gpt-4-1-nano
    displayName: GPT-4.1-nano
    owner:
        kind: provider
        name: github-models
    labels:
        family: gpt-nano
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: gpt-nano
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    maxOutputTokens: 16384
    knowledgeCutoff: 2024-04
    releaseDate: "2025-04-14"
    enabled: true
    snapshots:
        - name: openai-gpt-4-1-nano
          releasedAt: "2025-04-14"
          originalName: openai/gpt-4.1-nano
    pointer: openai-gpt-4-1-nano

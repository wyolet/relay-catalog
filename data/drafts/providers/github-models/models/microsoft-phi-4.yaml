    owner:
        kind: provider
        name: github-models
    labels:
        family: phi
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: phi
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true

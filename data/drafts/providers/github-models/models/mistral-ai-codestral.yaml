    contextWindowTotal: 32000
    maxOutputTokens: 8192
    knowledgeCutoff: 2024-03
    releaseDate: "2025-01-01"
    enabled: true
    snapshots:
        - name: mistral-ai-codestral-2501
          releasedAt: "2025-01-01"
          originalName: mistral-ai/codestral-2501
    pointer: mistral-ai-codestral-2501

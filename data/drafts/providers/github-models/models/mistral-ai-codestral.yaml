    displayName: Codestral 25.01
    owner:
        kind: provider
        name: github-models
    labels:
        family: codestral
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: codestral
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:

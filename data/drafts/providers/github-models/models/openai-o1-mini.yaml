apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-o1-mini
    displayName: OpenAI o1-mini
    owner:
        kind: provider
        name: github-models
    labels:
        family: o-mini
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: o-mini
    capabilities:
        chat: true
        streaming: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 65536
    contextWindowTotal: 128000
    maxOutputTokens: 65536
    knowledgeCutoff: 2023-10
    releaseDate: "2024-09-12"
    enabled: true
    snapshots:
        - name: openai-o1-mini
          releasedAt: "2024-09-12"
          originalName: openai/o1-mini
    pointer: openai-o1-mini

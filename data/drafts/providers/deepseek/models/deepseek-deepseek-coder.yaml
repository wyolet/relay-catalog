apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-deepseek-coder
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: deepseek
          upstreamName: deepseek/deepseek-coder
          adapter: openai
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: deepseek-deepseek-coder
          originalName: deepseek/deepseek-coder
    pointer: deepseek-deepseek-coder

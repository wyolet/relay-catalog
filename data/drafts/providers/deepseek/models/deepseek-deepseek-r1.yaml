# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-deepseek-r1
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: deepseek
          adapter: openai
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 8192
    contextWindowTotal: 65536
    snapshots:
        - name: deepseek-deepseek-r1
          originalName: deepseek/deepseek-r1
    pointer: deepseek-deepseek-r1

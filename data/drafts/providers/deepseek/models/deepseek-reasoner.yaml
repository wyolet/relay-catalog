# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-reasoner
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: deepseek
          upstreamName: deepseek-reasoner
          adapter: openai
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 65536
    contextWindowTotal: 131072
    snapshots:
        - name: deepseek-reasoner
    pointer: deepseek-reasoner

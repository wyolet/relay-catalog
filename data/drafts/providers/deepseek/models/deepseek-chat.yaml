apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-chat
    displayName: DeepSeek Chat
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 384000
    contextWindowTotal: 1000000
    maxOutputTokens: 384000
    knowledgeCutoff: 2025-09
    releaseDate: "2025-12-01"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: deepseek-chat
          releasedAt: "2025-12-01"
    pointer: deepseek-chat

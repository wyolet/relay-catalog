apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: amazon_nova-amazon-nova_nova-premier-v1
    owner:
        kind: host
        id: amazon_nova
spec:
    currency: USD
    targetModels:
        - amazon-nova/nova-premier-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 12.5

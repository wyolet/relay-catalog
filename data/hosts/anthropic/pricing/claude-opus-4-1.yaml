# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-opus-4-1
    displayName: Claude Opus 4.1 pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-opus-4-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 75
        - meter: tokens.cache_creation
          unit: per_million
          amount: 18.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.5

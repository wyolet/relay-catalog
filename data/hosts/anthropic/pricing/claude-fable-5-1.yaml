# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-fable-5-1
    displayName: Claude Fable 5.1 pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-fable-5-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 50
        - meter: tokens.cache_creation
          unit: per_million
          amount: 12.5
        # 0.025x base input on Fable 5.1 (vs the 0.1x standard multiplier).
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.25

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-haiku-4-5
    displayName: Claude Haiku 4.5 pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-haiku-4-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.25
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.09999999999999999

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-3-haiku
    displayName: Claude 3 Haiku pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-3-haiku
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 1.25
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.3
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: anthropic-claude-3-opus
    displayName: Claude 3 Opus pricing
    owner:
        kind: host
        id: anthropic
spec:
    currency: USD
    targetModels:
        - claude-3-opus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 15
        - meter: tokens.output
          unit: per_million
          amount: 75
        - meter: tokens.cache_creation
          unit: per_million
          amount: 18.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.5

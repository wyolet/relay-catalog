apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: anthropic-start-rl
  displayName: Anthropic Start — standard models
  description: "ITPM is metered as uncached input; cache writes, which Anthropic also counts, aren't. Anthropic's combined Opus 4.x and Sonnet 4.x buckets are metered per model here. Source: https://platform.claude.com/docs/en/api/rate-limits"
  owner:
    kind: host
    name: anthropic
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 1000
      window: 1m
      strategy: sliding-window
    - meter: tokens.input
      amount: 2000000
      window: 1m
      strategy: sliding-window
    - meter: tokens.output
      amount: 400000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: anthropic-start-fable-rl
  displayName: Anthropic Start — Fable and Mythos
  description: "ITPM is metered as uncached input; cache writes, which Anthropic also counts, aren't. Anthropic's combined Fable 5.x and Mythos 5.x buckets are metered per model here. Source: https://platform.claude.com/docs/en/api/rate-limits"
  owner:
    kind: host
    name: anthropic
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 1000
      window: 1m
      strategy: sliding-window
    - meter: tokens.input
      amount: 500000
      window: 1m
      strategy: sliding-window
    - meter: tokens.output
      amount: 100000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: anthropic-start
  displayName: Anthropic Start
  owner:
    kind: host
    name: anthropic
spec:
  rlBindings:
    - models:
        - anthropic/claude-fable-5
        - anthropic/claude-fable-5-1
        - anthropic/claude-mythos-5
      rateLimit: anthropic-start-fable-rl
    - models:
        - anthropic/claude-opus-5-5
        - anthropic/claude-opus-5
        - anthropic/claude-opus-4-8
        - anthropic/claude-opus-4-7
        - anthropic/claude-opus-4-6
        - anthropic/claude-opus-4-5
        - anthropic/claude-sonnet-5-5
        - anthropic/claude-sonnet-5
        - anthropic/claude-sonnet-4-6
        - anthropic/claude-sonnet-4-5
        - anthropic/claude-haiku-5-5
        - anthropic/claude-haiku-4-5
      rateLimit: anthropic-start-rl

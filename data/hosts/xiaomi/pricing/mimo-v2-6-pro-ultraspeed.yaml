apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xiaomi-mimo-v2-6-pro-ultraspeed
    displayName: mimo-v2-6-pro-ultraspeed pricing
    owner:
        kind: host
        id: xiaomi
spec:
    currency: USD
    targetModels:
        - mimo-v2-6-pro-ultraspeed
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.036
        - meter: tokens.input
          unit: per_million
          amount: 4.35
        - meter: tokens.output
          unit: per_million
          amount: 8.7
    enabled: true

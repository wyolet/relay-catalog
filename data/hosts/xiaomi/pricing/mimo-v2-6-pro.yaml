apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xiaomi-mimo-v2-6-pro
    displayName: mimo-v2-6-pro pricing
    owner:
        kind: host
        id: xiaomi
spec:
    currency: USD
    targetModels:
        - mimo-v2-6-pro
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0036
        - meter: tokens.input
          unit: per_million
          amount: 0.435
        - meter: tokens.output
          unit: per_million
          amount: 0.87
    enabled: true

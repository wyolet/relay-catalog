apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xiaomi-mimo-v2-6-flash
    displayName: mimo-v2-6-flash pricing
    owner:
        kind: host
        id: xiaomi
spec:
    currency: USD
    targetModels:
        - mimo-v2-6-flash
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0028
        - meter: tokens.input
          unit: per_million
          amount: 0.14
        - meter: tokens.output
          unit: per_million
          amount: 0.28
    enabled: true

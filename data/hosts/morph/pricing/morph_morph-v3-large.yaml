apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: morph-morph_morph-v3-large
    owner:
        kind: host
        id: morph
spec:
    currency: USD
    targetModels:
        - morph/morph-v3-large
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.8999999999999999
        - meter: tokens.output
          unit: per_million
          amount: 1.9

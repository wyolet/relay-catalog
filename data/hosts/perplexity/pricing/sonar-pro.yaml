apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-sonar-pro
    displayName: sonar-pro pricing
    owner:
        kind: host
        id: perplexity
spec:
    currency: USD
    targetModels:
        - sonar-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-sonar
    displayName: sonar pricing
    owner:
        kind: host
        id: perplexity
spec:
    currency: USD
    targetModels:
        - sonar
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 1
    enabled: true

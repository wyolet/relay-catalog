apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: perplexity-perplexity_sonar-reasoning
    owner:
        kind: host
        id: perplexity
spec:
    currency: USD
    targetModels:
        - perplexity/sonar-reasoning
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1
        - meter: tokens.output
          unit: per_million
          amount: 5

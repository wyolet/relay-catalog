apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-2-rl
  displayName: OpenAI Tier 2 — standard
  description: "OpenAI Usage Tier 2 default caps. Applies to gpt-5/5.4/5.5 family unless overridden."
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 1000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-2-gpt-5-5-pro-rl
  displayName: OpenAI Tier 2 — gpt-5.5-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 500
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 200000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-2-gpt-5-4-pro-rl
  displayName: OpenAI Tier 2 — gpt-5.4-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 450000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: Policy
metadata:
  name: openai-tier-2
  displayName: OpenAI Tier 2
  owner:
    kind: host
    name: openai
spec:
  rlBindings:
    - models: ["openai/gpt-5.5-pro"]
      rateLimit: openai-tier-2-gpt-5-5-pro-rl
    - models: ["openai/gpt-5.4-pro"]
      rateLimit: openai-tier-2-gpt-5-4-pro-rl
    - models: ["openai"]
      rateLimit: openai-tier-2-rl

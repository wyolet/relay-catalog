apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
  name: openai-launch
  displayName: OpenAI Launch
  owner:
    kind: host
    name: openai
spec:
  rateLimits:
    - ref: openai-launch-gpt-5-rl
      models:
        - openai/gpt-5
        - openai/gpt-5-1
        - openai/gpt-5-2
        - openai/gpt-5-4
        - openai/gpt-5-5
        - openai/gpt-5-6-sol
        - openai/gpt-5-6-terra
        - openai/gpt-6-1-sol
        - openai/gpt-6-1-terra
        - openai/gpt-6-astra
        - openai/gpt-6-sol
    - ref: openai-launch-gpt-5-5-pro-rl
      models:
        - openai/gpt-5-5-pro
    - ref: openai-launch-mini-rl
      models:
        - openai/gpt-4-1-mini
        - openai/gpt-4o-mini
        - openai/gpt-5-4-mini
        - openai/gpt-5-4-nano
        - openai/gpt-5-6-luna
        - openai/gpt-5-mini
        - openai/gpt-5-nano
        - openai/gpt-6-luna
    - ref: openai-launch-gpt-4o-rl
      models:
        - openai/gpt-4-1
        - openai/gpt-4o
        - openai/o3

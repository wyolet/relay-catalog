apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: openai-launch-gpt-5-rl
  displayName: OpenAI Launch — GPT-5 family and realtime models
  description: "TPM counts input plus output tokens. Values from each model's page, linked from https://developers.openai.com/api/docs/guides/rate-limits"
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 10000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 4000000
      window: 1m
      strategy: sliding-window
---

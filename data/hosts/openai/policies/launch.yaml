apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: openai-launch
  displayName: OpenAI Launch
  owner:
    kind: host
    name: openai
spec:
  rlBindings:
    - models:
        - openai/gpt-4o-mini-realtime
        - openai/gpt-4o-realtime
        - openai/gpt-5
        - openai/gpt-5-1
        - openai/gpt-5-2
        - openai/gpt-5-4
        - openai/gpt-5-5
        - openai/gpt-5-6
        - openai/gpt-5-6-sol
        - openai/gpt-5-6-terra
        - openai/gpt-6-1-sol
        - openai/gpt-6-astra
        - openai/gpt-6-sol
        - openai/gpt-realtime
        - openai/gpt-realtime-1-5
        - openai/gpt-realtime-2
        - openai/gpt-realtime-mini
      rateLimit: openai-launch-gpt-5-rl
    - models:
        - openai/gpt-5-5-pro
      rateLimit: openai-launch-gpt-5-5-pro-rl
    - models:
        - openai/gpt-3-5-turbo
        - openai/gpt-3-5-turbo-0125
        - openai/gpt-3-5-turbo-1106
        - openai/gpt-4-1-mini
        - openai/gpt-4-1-nano
        - openai/gpt-4o-mini
        - openai/gpt-4o-mini-audio
        - openai/gpt-4o-mini-search
        - openai/gpt-5-4-mini
        - openai/gpt-5-4-nano
        - openai/gpt-5-6-luna
        - openai/gpt-5-mini
        - openai/gpt-5-nano
        - openai/gpt-6-luna
        - openai/o3-mini
        - openai/o4-mini
      rateLimit: openai-launch-mini-rl
    - models:
        - openai/chatgpt-4o
        - openai/gpt-4-1
        - openai/gpt-4o
        - openai/gpt-4o-audio
        - openai/gpt-5-1-chat
        - openai/gpt-5-2-chat
        - openai/gpt-5-3-chat
        - openai/gpt-5-chat
        - openai/gpt-audio
        - openai/gpt-audio-1-5
        - openai/gpt-audio-mini
        - openai/o1
        - openai/o3
      rateLimit: openai-launch-gpt-4o-rl
    - models:
        - openai/gpt-4-0125
        - openai/gpt-4-1106
        - openai/gpt-4-turbo
      rateLimit: openai-launch-gpt-4-turbo-rl
    - models:
        - openai/gpt-4
        - openai/gpt-4-0314
        - openai/gpt-4-0613
      rateLimit: openai-launch-gpt-4-rl
    - models:
        - openai/gpt-4o-search
      rateLimit: openai-launch-gpt-4o-search-rl

apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
  name: openai-build-gpt-4o-rl
  displayName: OpenAI Build — GPT-4o, GPT-4.1, GPT-4 Turbo, o1, o3, audio and chat-latest models
  description: "TPM counts input plus output tokens. Values from each model's page, linked from https://developers.openai.com/api/docs/guides/rate-limits"
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 450000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
  name: openai-build
  displayName: OpenAI Build
  owner:
    kind: host
    name: openai
spec:
  rateLimits:
    - ref: openai-build-gpt-5-rl
      models:
        - openai/gpt-5
        - openai/gpt-5-1
        - openai/gpt-5-2
        - openai/gpt-5-4
        - openai/gpt-5-5
        - openai/gpt-5-6-sol
        - openai/gpt-5-6-terra
        - openai/gpt-6-1-sol
        - openai/gpt-6-1-terra
        - openai/gpt-6-2-astra
        - openai/gpt-6-2-sol
        - openai/gpt-6-astra
        - openai/gpt-6-sol
    - ref: openai-build-gpt-5-5-pro-rl
      models:
        - openai/gpt-5-5-pro
    - ref: openai-build-mini-rl
      models:
        - openai/gpt-4-1-mini
        - openai/gpt-4o-mini
        - openai/gpt-5-4-mini
        - openai/gpt-5-4-nano
        - openai/gpt-5-6-luna
        - openai/gpt-5-mini
        - openai/gpt-5-nano
        - openai/gpt-6-luna
    - ref: openai-build-gpt-4o-rl
      models:
        - openai/gpt-4-1
        - openai/gpt-4o
        - openai/o3

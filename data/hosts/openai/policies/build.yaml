apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: openai-build-gpt-5-rl
  displayName: OpenAI Build — GPT-5 family
  description: "TPM counts input plus output tokens. Values from each model's page, linked from https://developers.openai.com/api/docs/guides/rate-limits"
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 1000000
      window: 1m
      strategy: sliding-window
---

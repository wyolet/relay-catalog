apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-3-rl
  displayName: OpenAI Tier 3 — standard
  description: "OpenAI Usage Tier 3 default caps. Applies to gpt-5/5.4/5.5 family unless overridden."
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 2000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-3-gpt-5-5-pro-rl
  displayName: OpenAI Tier 3 — gpt-5.5-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 500
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 500000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-3-gpt-5-4-pro-rl
  displayName: OpenAI Tier 3 — gpt-5.4-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 5000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 800000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: Policy
metadata:
  name: openai-tier-3
  displayName: OpenAI Tier 3
  owner:
    kind: host
    name: openai
spec:
  rlBindings:
    - models: ["openai/gpt-5.5-pro"]
      rateLimit: openai-tier-3-gpt-5-5-pro-rl
    - models: ["openai/gpt-5.4-pro"]
      rateLimit: openai-tier-3-gpt-5-4-pro-rl
    - models: ["openai"]
      rateLimit: openai-tier-3-rl

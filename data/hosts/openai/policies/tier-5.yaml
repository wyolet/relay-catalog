apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-5-rl
  displayName: OpenAI Tier 5 — standard
  description: "OpenAI Usage Tier 5 default caps. Applies to gpt-5/5.4/5.5 family unless overridden."
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 15000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 40000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-5-gpt-5-5-pro-rl
  displayName: OpenAI Tier 5 — gpt-5.5-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 2000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 4000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-5-gpt-5-4-pro-rl
  displayName: OpenAI Tier 5 — gpt-5.4-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 10000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 30000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: Policy
metadata:
  name: openai-tier-5
  displayName: OpenAI Tier 5
  owner:
    kind: host
    name: openai
spec:
  rlBindings:
    - models: ["openai/gpt-5.5-pro"]
      rateLimit: openai-tier-5-gpt-5-5-pro-rl
    - models: ["openai/gpt-5.4-pro"]
      rateLimit: openai-tier-5-gpt-5-4-pro-rl
    - models: ["openai"]
      rateLimit: openai-tier-5-rl

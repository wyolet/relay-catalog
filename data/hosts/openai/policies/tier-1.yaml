apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-1-rl
  displayName: OpenAI Tier 1 — standard
  description: "OpenAI Usage Tier 1 default caps. Applies to gpt-5/5.4/5.5 family unless overridden by a per-model binding."
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 500
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 500000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-1-gpt-5-5-pro-rl
  displayName: OpenAI Tier 1 — gpt-5.5-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 50
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 50000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: RateLimit
metadata:
  name: openai-tier-1-gpt-5-4-pro-rl
  displayName: OpenAI Tier 1 — gpt-5.4-pro
  owner:
    kind: host
    name: openai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 500
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 30000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1
kind: Policy
metadata:
  name: openai-tier-1
  displayName: OpenAI Tier 1
  owner:
    kind: host
    name: openai
spec:
  rlBindings:
    - models: ["openai/gpt-5.5-pro"]
      rateLimit: openai-tier-1-gpt-5-5-pro-rl
    - models: ["openai/gpt-5.4-pro"]
      rateLimit: openai-tier-1-gpt-5-4-pro-rl
    - models: ["openai"]
      rateLimit: openai-tier-1-rl

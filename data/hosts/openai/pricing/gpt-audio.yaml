# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-audio
    displayName: GPT Audio pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-audio
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 10

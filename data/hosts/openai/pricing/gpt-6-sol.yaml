# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-6-sol
    displayName: GPT-6 Sol pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-6-sol
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_creation
          unit: per_million
          amount: 5
          aboveTokens: 272000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 272000
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.input
          unit: per_million
          amount: 4
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.output
          unit: per_million
          amount: 15
          aboveTokens: 272000

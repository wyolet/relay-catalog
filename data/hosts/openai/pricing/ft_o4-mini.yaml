apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft_o4-mini
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft:o4-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4
        - meter: tokens.output
          unit: per_million
          amount: 16
        - meter: tokens.cache_read
          unit: per_million
          amount: 1

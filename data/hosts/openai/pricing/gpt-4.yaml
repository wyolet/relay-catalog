apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-4
    displayName: GPT-4 pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-4
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.output
          unit: per_million
          amount: 60

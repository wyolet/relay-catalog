# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-6-astra
    displayName: GPT-6 Astra pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-6-astra
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 12.5
        - meter: tokens.cache_creation
          unit: per_million
          amount: 25
          aboveTokens: 272000
        - meter: tokens.cache_read
          unit: per_million
          amount: 1
        - meter: tokens.cache_read
          unit: per_million
          amount: 2
          aboveTokens: 272000
        - meter: tokens.input
          unit: per_million
          amount: 10
        - meter: tokens.input
          unit: per_million
          amount: 20
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 50
        - meter: tokens.output
          unit: per_million
          amount: 75
          aboveTokens: 272000

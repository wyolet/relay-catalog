# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-4-1-nano
    displayName: GPT-4.1 Nano pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-4-1-nano
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.09999999999999999
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.024999999999999998

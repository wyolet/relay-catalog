# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-gpt-5-5-pro
    displayName: GPT-5.5 Pro pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-5-5-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 30
        - meter: tokens.input
          unit: per_million
          amount: 60
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 180
        - meter: tokens.output
          unit: per_million
          amount: 270
          aboveTokens: 272000

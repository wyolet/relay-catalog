# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-o3
    displayName: O3 pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - o3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 8
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.5

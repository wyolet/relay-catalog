apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft-gpt-4-1
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft-gpt-4-1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 12
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.75

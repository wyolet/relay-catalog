apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft-gpt-4o-mini
    displayName: Fine-tuned GPT-4o Mini pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft-gpt-4o-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

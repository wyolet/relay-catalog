# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft-o4-mini
    displayName: Fine-tuned O4 Mini pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft-o4-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 4
        - meter: tokens.output
          unit: per_million
          amount: 16
        - meter: tokens.cache_read
          unit: per_million
          amount: 1

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft-gpt-3-5-turbo
    displayName: Fine-tuned GPT-3.5 Turbo pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft-gpt-3-5-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 6

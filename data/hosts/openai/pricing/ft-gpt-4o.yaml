apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: openai-ft-gpt-4o
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - ft-gpt-4o
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.75
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.cache_creation
          unit: per_million
          amount: 1.875

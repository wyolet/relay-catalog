# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: openai-gpt-5-6-terra
    displayName: GPT-5.6 Terra pricing
    owner:
        kind: host
        id: openai
spec:
    currency: USD
    targetModels:
        - gpt-5-6-terra
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_creation
          unit: per_million
          amount: 5
          aboveTokens: 272000
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.4
          aboveTokens: 272000
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.input
          unit: per_million
          amount: 4
          aboveTokens: 272000
        - meter: tokens.output
          unit: per_million
          amount: 12
        - meter: tokens.output
          unit: per_million
          amount: 18
          aboveTokens: 272000

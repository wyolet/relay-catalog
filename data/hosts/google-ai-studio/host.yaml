# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Host.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Host
metadata:
    name: google-ai-studio
    displayName: "Google AI Studio (Gemini)"
    description: "Google AI Studio's OpenAI-compatible endpoint for Gemini models. Accepts OpenAI-shaped chat completions requests at the /v1beta/openai base path, covering streaming, structured outputs, function calling, and vision. This compatibility layer is currently in beta per Google's documentation."
    owner:
        kind: system
spec:
    baseURL: https://generativelanguage.googleapis.com/v1beta/openai
    homepageURL: https://ai.google.dev/
    docsURL: https://ai.google.dev/gemini-api/docs/openai
    icon:
        path: /provider/google-ai-studio.svg

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Pricing
metadata:
    name: google-ai-studio-gemini-4-neon
    displayName: Gemini 4 Neon pricing
    owner:
        kind: host
        id: google-ai-studio
spec:
    currency: USD
    targetModels:
        - gemini-4-neon
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3.00
        - meter: tokens.output
          unit: per_million
          amount: 15.00
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

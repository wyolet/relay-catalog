# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-ai-studio-gemini-3-6-flash
    displayName: Gemini 3.6 Flash pricing
    owner:
        kind: host
        id: google-ai-studio
spec:
    currency: USD
    targetModels:
        - gemini-3-6-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.50
        - meter: tokens.audio_input
          unit: per_million
          amount: 1.50
        - meter: tokens.output
          unit: per_million
          amount: 7.50
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15

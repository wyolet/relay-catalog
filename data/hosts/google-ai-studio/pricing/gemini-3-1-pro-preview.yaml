# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-ai-studio-gemini-3-1-pro-preview
    displayName: Gemini 3.1 Pro (Preview) pricing
    owner:
        kind: host
        id: google-ai-studio
spec:
    currency: USD
    targetModels:
        - gemini-3-1-pro-preview
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.00
        - meter: tokens.input
          unit: per_million
          amount: 4.00
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 12.00
        - meter: tokens.output
          unit: per_million
          amount: 18.00
          aboveTokens: 200000

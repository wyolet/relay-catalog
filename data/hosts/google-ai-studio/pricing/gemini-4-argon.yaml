# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-ai-studio-gemini-4-argon
    displayName: Gemini 4 Argon pricing
    owner:
        kind: host
        id: google-ai-studio
spec:
    currency: USD
    targetModels:
        - gemini-4-argon
    # Promotional rate through 2026-11-30; doubles (4.00/20.00/0.20) from 2026-12-01.
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.00
        - meter: tokens.output
          unit: per_million
          amount: 10.00
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.10

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vertex_ai-anthropic_models-vertex_ai_claude-sonnet-4-6@default
    owner:
        kind: host
        id: vertex_ai-anthropic_models
spec:
    currency: USD
    targetModels:
        - vertex_ai/claude-sonnet-4-6@default
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: xai-xai_grok-4.3
    owner:
        kind: host
        id: xai
spec:
    currency: USD
    targetModels:
        - xai/grok-4.3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.19999999999999998
        - meter: tokens.input
          unit: per_million
          amount: 2.5
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 5
          aboveTokens: 200000

apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: xai-tier-1-rl
  displayName: xAI Tier 1 rate limits
  description: "xAI tier 1 ($50 spend threshold), grok-4.5 reference: 172 requests/second, 53M TPM. Older grok-4.x models carry lower per-model limits. Per docs.x.ai/docs/key-information/consumption-and-rate-limits, 2026-07-12."
  owner:
    kind: host
    name: xai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 172
      window: 1s
      strategy: sliding-window
    - meter: tokens
      amount: 53000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: xai-tier-1
  displayName: xAI Tier 1
  owner:
    kind: host
    name: xai
spec:
  rateLimit: xai-tier-1-rl

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-novita_minimax_minimax-m2
    owner:
        kind: host
        id: novita
spec:
    currency: USD
    targetModels:
        - novita/minimax/minimax-m2
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

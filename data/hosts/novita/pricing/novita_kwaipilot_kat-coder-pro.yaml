apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: novita-novita_kwaipilot_kat-coder-pro
    owner:
        kind: host
        id: novita
spec:
    currency: USD
    targetModels:
        - novita/kwaipilot/kat-coder-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06

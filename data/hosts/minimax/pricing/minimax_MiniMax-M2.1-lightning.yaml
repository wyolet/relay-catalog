apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: minimax-minimax_MiniMax-M2.1-lightning
    owner:
        kind: host
        id: minimax
spec:
    currency: USD
    targetModels:
        - minimax/MiniMax-M2.1-lightning
    rates:

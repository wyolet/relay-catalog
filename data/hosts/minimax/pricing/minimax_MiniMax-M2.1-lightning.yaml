          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.4
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0.375
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

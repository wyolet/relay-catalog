apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gemini-gemini_gemini-2.5-flash
    owner:
        kind: host
        id: gemini
spec:
    currency: USD
    targetModels:
        - gemini/gemini-2.5-flash
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 2.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03
        - meter: tokens.reasoning
          unit: per_million
          amount: 2.5

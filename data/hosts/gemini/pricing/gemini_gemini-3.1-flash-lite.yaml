apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gemini-gemini_gemini-3.1-flash-lite
    owner:
        kind: host
        id: gemini
spec:
    currency: USD
    targetModels:
        - gemini/gemini-3.1-flash-lite
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 1.5
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.024999999999999998
        - meter: tokens.reasoning
          unit: per_million
          amount: 1.5

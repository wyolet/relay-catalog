apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: gemini-gemini_gemini-pro
    owner:
        kind: host
        id: gemini
spec:
    currency: USD
    targetModels:
        - gemini/gemini-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125
        - meter: tokens.input
          unit: per_million
          amount: 2.5
          aboveTokens: 200000
        - meter: tokens.output
          unit: per_million
          amount: 15
          aboveTokens: 200000

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: dashscope-dashscope_qwen-coder
    owner:
        kind: host
        id: dashscope
spec:
    currency: USD
    targetModels:
        - dashscope/qwen-coder
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.5

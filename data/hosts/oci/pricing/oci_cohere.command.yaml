apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: oci-oci_cohere.command
    owner:
        kind: host
        id: oci
spec:
    currency: USD
    targetModels:
        - oci/cohere.command
    rates:

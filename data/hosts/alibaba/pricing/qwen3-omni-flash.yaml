          unit: per_million
          amount: 3.81
        - meter: tokens.audio_output
          unit: per_million
          amount: 15.11
        - meter: tokens.input
          unit: per_million
          amount: 0.43
        - meter: tokens.output
          unit: per_million
          amount: 1.66
    enabled: true

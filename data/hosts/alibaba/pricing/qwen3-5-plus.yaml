apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-qwen3-5-plus
    displayName: qwen3-5-plus pricing
    owner:
        kind: host
        id: alibaba
spec:
    currency: USD
    targetModels:
        - qwen3-5-plus
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2.4
        - meter: tokens.reasoning
          unit: per_million
          amount: 2.4
    enabled: true

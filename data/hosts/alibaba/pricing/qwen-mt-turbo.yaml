apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: alibaba-qwen-mt-turbo
    displayName: qwen-mt-turbo pricing
    owner:
        kind: host
        id: alibaba
spec:
    currency: USD
    targetModels:
        - qwen-mt-turbo
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.16
        - meter: tokens.output
          unit: per_million
          amount: 0.49
    enabled: true

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock-amazon.titan-text-lite-v1
    owner:
        kind: host
        id: bedrock
spec:
    currency: USD
    targetModels:
        - amazon.titan-text-lite-v1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 0.39999999999999997

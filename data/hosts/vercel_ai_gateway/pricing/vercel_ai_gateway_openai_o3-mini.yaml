apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vercel_ai_gateway-vercel_ai_gateway_openai_o3-mini
    owner:
        kind: host
        id: vercel_ai_gateway
spec:
    currency: USD
    targetModels:
        - vercel_ai_gateway/openai/o3-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.1
        - meter: tokens.output
          unit: per_million
          amount: 4.4
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.55

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: vercel_ai_gateway-vercel_ai_gateway_openai_gpt-4o
    owner:
        kind: host
        id: vercel_ai_gateway
spec:
    currency: USD
    targetModels:
        - vercel_ai_gateway/openai/gpt-4o
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.cache_read
          unit: per_million
          amount: 1.25

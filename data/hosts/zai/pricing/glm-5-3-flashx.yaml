# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zai-glm-5-3-flashx
    displayName: glm-5-3-flashx pricing
    owner:
        kind: host
        id: zai
spec:
    currency: USD
    targetModels:
        - glm-5-3-flashx
    rates:
        # Cache writes are free for a limited time on Z.AI's published rate card.
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.075
        - meter: tokens.input
          unit: per_million
          amount: 0.37
        - meter: tokens.output
          unit: per_million
          amount: 1.25

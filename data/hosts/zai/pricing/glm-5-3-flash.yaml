# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: zai-glm-5-3-flash
    displayName: glm-5-3-flash pricing
    owner:
        kind: host
        id: zai
spec:
    currency: USD
    targetModels:
        - glm-5-3-flash
    rates:
        - meter: tokens.cache_creation
          unit: per_million
          amount: 0
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.015
        - meter: tokens.input
          unit: per_million
          amount: 0.075
        - meter: tokens.output
          unit: per_million
          amount: 0.25

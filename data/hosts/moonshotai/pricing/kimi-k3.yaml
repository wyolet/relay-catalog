# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: moonshotai-kimi-k3
    displayName: Kimi K3 pricing
    owner:
        kind: host
        id: moonshotai
spec:
    currency: USD
    targetModels:
        - kimi-k3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3

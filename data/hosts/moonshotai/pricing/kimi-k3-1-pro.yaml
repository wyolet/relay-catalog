# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: moonshotai-kimi-k3-1-pro
    displayName: Kimi K3.1 Pro pricing
    owner:
        kind: host
        id: moonshotai
spec:
    currency: USD
    targetModels:
        - kimi-k3-1-pro
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.2
        - meter: tokens.cache_creation
          unit: per_million
          amount: 2

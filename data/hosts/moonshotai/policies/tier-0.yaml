apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: moonshotai-tier-0-rl
  displayName: Moonshot Tier 0 rate limits
  description: "Moonshot AI tier 0 ($1 cumulative recharge): 3 RPM, 500K TPM, enforced per account across all kimi models (extra keys add no quota); token usage counts request tokens + max_completion_tokens. 1.5M TPD daily cap applies at this tier only. Per platform.moonshot.ai/docs/pricing/limits (redirects to platform.kimi.ai), 2026-07-12."
  owner:
    kind: host
    name: moonshotai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 3
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 500000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: moonshotai-tier-0
  displayName: Moonshot Tier 0
  owner:
    kind: host
    name: moonshotai
spec:
  rateLimit: moonshotai-tier-0-rl

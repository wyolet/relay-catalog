apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: moonshotai-tier-1-rl
  displayName: Moonshot Tier 1 rate limits
  description: "Moonshot AI tier 1 ($10 cumulative recharge): 200 RPM, 2M TPM, enforced per account across all kimi models (extra keys add no quota); token usage counts request tokens + max_completion_tokens. Per platform.moonshot.ai/docs/pricing/limits (redirects to platform.kimi.ai), 2026-07-12."
  owner:
    kind: host
    name: moonshotai
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 200
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 2000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: moonshotai-tier-1
  displayName: Moonshot Tier 1
  owner:
    kind: host
    name: moonshotai
spec:
  rateLimit: moonshotai-tier-1-rl

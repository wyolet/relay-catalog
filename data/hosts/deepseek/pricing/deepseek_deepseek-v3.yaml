apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: deepseek-deepseek_deepseek-v3
    owner:
        kind: host
        id: deepseek
spec:
    currency: USD
    targetModels:
        - deepseek/deepseek-v3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.27
        - meter: tokens.output
          unit: per_million
          amount: 1.1
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.07

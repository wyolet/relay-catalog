apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
    name: google-tier-2-rl
    displayName: Gemini API Tier 2 rate limits
    description: "Gemini API Tier 2 (paid $100 and 3 days since the first payment; $2,000 billing cap). Representative relay-side caps per ai.google.dev/gemini-api/docs/rate-limits. Tier 2 roughly doubles Tier 1 limits."
    owner:
        kind: host
        name: google
spec:
    enabled: true
    rules:
        - meter: requests
          amount: 2000
          window: 1m
          strategy: sliding-window
        - meter: tokens
          amount: 8000000
          window: 1m
          strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-tier-2
    displayName: Gemini API Tier 2
    owner:
        kind: host
        name: google
spec:
    rateLimits:
    - ref: google-tier-2-rl

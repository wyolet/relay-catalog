apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
    name: google-tier-2-rl
    displayName: Gemini API Tier 2 rate limits
    description: "Gemini API Tier 2: paid $100 and 3 days since the first successful payment. Billing cap $2,000; spend rate limit $200 per 10 minutes. Google publishes per-model RPM, TPM and RPD only in the AI Studio dashboard (aistudio.google.com/rate-limit), per project; the caps here are relay-side approximations, so set your own from the dashboard. Per aistudio.google.com/docs/rate-limits, 2026-11-24."
    owner:
        kind: host
        name: google
spec:
    enabled: true
    rules:
        - meter: requests
          amount: 2000
          window: 1m
          strategy: sliding-window
        - meter: tokens
          amount: 8000000
          window: 1m
          strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-tier-2
    displayName: Gemini API Tier 2
    owner:
        kind: host
        name: google
spec:
    rateLimits:
    - ref: google-tier-2-rl

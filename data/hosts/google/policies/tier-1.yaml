apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
    name: google-tier-1-rl
    displayName: Gemini API Tier 1 rate limits
    description: "Gemini API Tier 1: an active billing account linked. Billing cap $250; spend rate limit $10 per 10 minutes. Google publishes per-model RPM, TPM and RPD only in the AI Studio dashboard (aistudio.google.com/rate-limit), per project; the caps here are relay-side approximations, so set your own from the dashboard. Per aistudio.google.com/docs/rate-limits, 2026-11-24."
    owner:
        kind: host
        name: google
spec:
    enabled: true
    rules:
        - meter: requests
          amount: 1000
          window: 1m
          strategy: sliding-window
        - meter: tokens
          amount: 4000000
          window: 1m
          strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-tier-1
    displayName: Gemini API Tier 1
    owner:
        kind: host
        name: google
spec:
    rateLimits:
    - ref: google-tier-1-rl

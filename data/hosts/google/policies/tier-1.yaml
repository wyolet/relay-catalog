apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-tier-1
    displayName: Gemini API Tier 1
    description: "Gemini API Tier 1: an active billing account linked. Billing cap $250; spend rate limit $10 per 10 minutes. Per aistudio.google.com/docs/rate-limits, 2026-11-24."
    owner:
        kind: host
        name: google
spec:
    rateLimits:
        - ref: google-tier-1-pro-3-1-rl
          models:
            - google/gemini-3-1-pro-preview
            - google/gemini-3-1-pro-preview-customtools
        - ref: google-tier-1-pro-2-5-rl
          models:
            - google/gemini-2-5-pro
        - ref: google-tier-1-flash-rl
          models:
            - google/gemini-3-8-flash
            - google/gemini-3-6-flash
            - google/gemini-3-flash-preview
            - google/gemini-4-hydrogen
        - ref: google-tier-1-flash-2-5-rl
          models:
            - google/gemini-2-5-flash
        - ref: google-tier-1-flash-lite-rl
          models:
            - google/gemini-3-5-flash-lite
            - google/gemini-3-1-flash-lite
        - ref: google-tier-1-flash-lite-2-5-rl
          models:
            - google/gemini-2-5-flash-lite
        - ref: google-tier-1-gemini-4-rl
          models:
            - google/gemini-4-argon
            - google/gemini-4-carbon
        - ref: google-tier-1-gemini-4-neon-rl
          models:
            - google/gemini-4-neon
        - ref: google-tier-1-gemma-rl
          models:
            - google/gemma-4-31b-it
            - google/gemma-4-26b-a4b-it

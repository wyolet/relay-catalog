apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
    name: google-free-flash-rl
    displayName: Gemini API Free — Gemini Flash (3, 3.6, 3.8) and Gemini 4 Hydrogen
    description: "Per model: requests per minute, input tokens per minute, requests per day. Limits read from the AI Studio rate-limit page of a Tier 1 project and its tier comparison, 2026-11-24; Google sets them per project and may differ on yours."
    owner:
        kind: host
        name: google
spec:
    enabled: true
    rules:
        - meter: requests
          amount: 5
          window: 1m
          strategy: sliding-window
        - meter: tokens.input
          amount: 250000
          window: 1m
          strategy: sliding-window
        - meter: requests
          amount: 20
          window: 24h
          strategy: sliding-window
---

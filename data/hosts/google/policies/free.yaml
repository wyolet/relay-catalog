apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-free
    displayName: Gemini API Free
    description: "Gemini API Free: an active project or free trial, no billing account. Models without free quota are not allowed. Per aistudio.google.com/docs/rate-limits, 2026-11-24."
    owner:
        kind: host
        name: google
spec:
    models:
        - google/gemini-3-8-flash
        - google/gemini-3-6-flash
        - google/gemini-3-flash-preview
        - google/gemini-4-hydrogen
        - google/gemini-2-5-flash
        - google/gemini-3-5-flash-lite
        - google/gemini-3-1-flash-lite
        - google/gemini-2-5-flash-lite
        - google/gemma-4-31b-it
        - google/gemma-4-26b-a4b-it
    rateLimits:
        - ref: google-free-flash-rl
          models:
            - google/gemini-3-8-flash
            - google/gemini-3-6-flash
            - google/gemini-3-flash-preview
            - google/gemini-4-hydrogen
        - ref: google-free-flash-2-5-rl
          models:
            - google/gemini-2-5-flash
        - ref: google-free-flash-lite-rl
          models:
            - google/gemini-3-5-flash-lite
            - google/gemini-3-1-flash-lite
        - ref: google-free-flash-lite-2-5-rl
          models:
            - google/gemini-2-5-flash-lite
        - ref: google-free-gemma-rl
          models:
            - google/gemma-4-31b-it
            - google/gemma-4-26b-a4b-it

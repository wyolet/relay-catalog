apiVersion: relay.wyolet.dev/v1alpha3
kind: RateLimit
metadata:
    name: google-free-rl
    displayName: Gemini API Free tier rate limits
    description: "Gemini API Free tier: an active project or free trial, no billing account. Google publishes per-model RPM, TPM and RPD only in the AI Studio dashboard (aistudio.google.com/rate-limit), per project; the caps here are relay-side approximations, so set your own from the dashboard. Per aistudio.google.com/docs/rate-limits, 2026-11-24."
    owner:
        kind: host
        name: google
spec:
    enabled: true
    rules:
        - meter: requests
          amount: 15
          window: 1m
          strategy: sliding-window
        - meter: tokens
          amount: 1000000
          window: 1m
          strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha3
kind: Policy
metadata:
    name: google-free
    displayName: Gemini API Free
    owner:
        kind: host
        name: google
spec:
    rateLimits:
    - ref: google-free-rl

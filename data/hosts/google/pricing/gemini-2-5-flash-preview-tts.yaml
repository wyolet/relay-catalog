apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: google-gemini-2-5-flash-preview-tts
    displayName: gemini-2-5-flash-preview-tts pricing
    owner:
        kind: host
        id: google
spec:
    currency: USD
    targetModels:
        - gemini-2-5-flash-preview-tts
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.5
        - meter: tokens.output
          unit: per_million
          amount: 10
    enabled: true

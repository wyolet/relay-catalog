# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: HostBinding
metadata:
  name: magistral-small-on-mistral
  displayName: magistral-small via mistral
spec:
  model: magistral-small
  host: mistral
  adapter: openai
  enabled: true
  snapshots:
  - magistral-small-latest

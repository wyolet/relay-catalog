apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-ministral-8b
    displayName: ministral-8b pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - ministral-8b
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.1

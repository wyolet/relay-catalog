apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-devstral-medium
    displayName: devstral-medium pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - devstral-medium
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.4
        - meter: tokens.output
          unit: per_million
          amount: 2
    enabled: true

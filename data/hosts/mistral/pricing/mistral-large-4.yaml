apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: mistral-mistral-large-4
    displayName: mistral-large-4 pricing
    owner:
        kind: host
        id: mistral
spec:
    currency: USD
    targetModels:
        - mistral-large-4
    # Launch sale rate, no end date published; list price is 1.36/4.18/0.14.
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.68
        - meter: tokens.output
          unit: per_million
          amount: 2.09
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.07
    enabled: true

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: HostBinding
metadata:
    name: qwen3-vl-235b-on-ollama-self
    displayName: "Qwen 3 VL 235B via ollama-self"
spec:
    # A signed-in Ollama also proxies the :cloud snapshots through its own local API, alongside the locally pulled tags.
    model: qwen3-vl-235b
    host: ollama-self
    adapter: openai
    snapshots: [qwen3-vl-235b, qwen3-vl-235b-cloud, qwen3-vl-235b-instruct-cloud]

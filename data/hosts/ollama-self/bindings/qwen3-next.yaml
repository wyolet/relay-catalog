# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/HostBinding.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: HostBinding
metadata:
    name: qwen3-next-on-ollama-self
    displayName: "Qwen 3 Next via ollama-self"
spec:
    # A signed-in Ollama also proxies the :cloud snapshot through its own local API, alongside the locally pulled tags.
    model: qwen3-next
    host: ollama-self
    adapter: openai
    snapshots: [qwen3-next-latest, qwen3-next-80b, qwen3-next-80b-cloud]

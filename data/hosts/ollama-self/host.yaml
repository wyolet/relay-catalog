# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Host.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Host
metadata:
    name: ollama-self
    displayName: Ollama (self-hosted)
    description: "Operator-run Ollama instance. baseURL is per-deployment; the catalog ships an empty default that the operator must configure."
    # The endpoint is per-deployment: an admin sets baseURL with a CRUD edit or an overlay.
    owner:
        kind: system
spec:
    baseURL: ""
    # Self-hosted Ollama needs no API key — routing injects a synthetic
    # anonymous key so no HostKey is required. (Ollama Cloud still needs one.)
    noAuth: true
    homepageURL: https://ollama.com
    icon:
        path: /provider/ollama.png

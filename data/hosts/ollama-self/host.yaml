# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Host.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Host
metadata:
    name: ollama-self
    displayName: Ollama (self-hosted)
    description: "Operator-run Ollama instance. baseURL is per-deployment; the catalog ships an empty default that the operator must configure."
    # User-owned (not system) so the operator can set baseURL via the standard
    # CRUD edit — its endpoint is per-deployment, not catalog-fixed. owner.id is
    # left empty (single-user relay); a future seed pass can stamp the
    # superadmin id once users have ids.
    owner:
        kind: user
spec:
    baseURL: ""
    homepageURL: https://ollama.com
    icon:
        path: /provider/ollama.png

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: fireworks_ai-fireworks_ai_minimax-m2p1
    owner:
        kind: host
        id: fireworks_ai
spec:
    currency: USD
    targetModels:
        - fireworks_ai/minimax-m2p1
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.3
        - meter: tokens.output
          unit: per_million
          amount: 1.2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.03

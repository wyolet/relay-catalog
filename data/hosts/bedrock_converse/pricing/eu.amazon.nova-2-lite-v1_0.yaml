apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-eu.amazon.nova-2-lite-v1_0
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:
        - eu.amazon.nova-2-lite-v1:0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.33
        - meter: tokens.output
          unit: per_million
          amount: 2.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.0825

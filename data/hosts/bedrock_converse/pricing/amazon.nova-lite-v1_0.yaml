apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-amazon.nova-lite-v1_0
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:
        - amazon.nova-lite-v1:0
    rates:

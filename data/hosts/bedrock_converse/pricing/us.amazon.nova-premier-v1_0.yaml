apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: bedrock_converse-us.amazon.nova-premier-v1_0
    owner:
        kind: host
        id: bedrock_converse
spec:
    currency: USD
    targetModels:
        - us.amazon.nova-premier-v1:0
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.5
        - meter: tokens.output
          unit: per_million
          amount: 12.5

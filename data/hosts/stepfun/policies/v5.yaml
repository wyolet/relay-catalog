apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: stepfun-v5-rl
  displayName: StepFun V5 rate limits
  description: "StepFun V5 (¥10,000 cumulative recharge): 200,000 RPM, 100M TPM. Pay-as-you-go API only; Step Plan subscriptions are quota-managed separately. Per platform.stepfun.com/docs/zh/guides/pricing/details, 2026-07-12."
  owner:
    kind: host
    name: stepfun
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 200000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 100000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: stepfun-v5
  displayName: StepFun V5
  owner:
    kind: host
    name: stepfun
spec:
  rateLimit: stepfun-v5-rl

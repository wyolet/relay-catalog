apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: stepfun-v1-rl
  displayName: StepFun V1 rate limits
  description: "StepFun V1 (¥100 cumulative recharge): 1,000 RPM, 20M TPM. Pay-as-you-go API only; Step Plan subscriptions are quota-managed separately. Per platform.stepfun.com/docs/zh/guides/pricing/details, 2026-07-12."
  owner:
    kind: host
    name: stepfun
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 1000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 20000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: stepfun-v1
  displayName: StepFun V1
  owner:
    kind: host
    name: stepfun
spec:
  rateLimit: stepfun-v1-rl

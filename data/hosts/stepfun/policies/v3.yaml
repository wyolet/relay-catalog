apiVersion: relay.wyolet.dev/v1alpha2
kind: RateLimit
metadata:
  name: stepfun-v3-rl
  displayName: StepFun V3 rate limits
  description: "StepFun V3 (¥2,000 cumulative recharge): 10,000 RPM, 40M TPM. Pay-as-you-go API only; Step Plan subscriptions are quota-managed separately. Per platform.stepfun.com/docs/zh/guides/pricing/details, 2026-07-12."
  owner:
    kind: host
    name: stepfun
spec:
  enabled: true
  rules:
    - meter: requests
      amount: 10000
      window: 1m
      strategy: sliding-window
    - meter: tokens
      amount: 40000000
      window: 1m
      strategy: sliding-window
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Policy
metadata:
  name: stepfun-v3
  displayName: StepFun V3
  owner:
    kind: host
    name: stepfun
spec:
  rateLimit: stepfun-v3-rl

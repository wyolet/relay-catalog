# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Pricing.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: meta-muse-spark-1-1
    displayName: Muse Spark 1.1 pricing
    owner:
        kind: host
        id: meta
spec:
    currency: USD
    targetModels:
        - muse-spark-1-1
    rates:
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.15
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 4.25

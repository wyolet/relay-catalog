apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_eu_gpt-5
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/eu/gpt-5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.375
        - meter: tokens.output
          unit: per_million
          amount: 11
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.1375

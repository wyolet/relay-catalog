apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_computer-use
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/computer-use
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 12

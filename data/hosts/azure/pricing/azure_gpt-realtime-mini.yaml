apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_gpt-realtime-mini
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/gpt-realtime-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.6
        - meter: tokens.output
          unit: per_million
          amount: 2.4
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.06

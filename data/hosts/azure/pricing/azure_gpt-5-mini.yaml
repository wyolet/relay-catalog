apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_gpt-5-mini
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/gpt-5-mini
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 0.25
        - meter: tokens.output
          unit: per_million
          amount: 2
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.024999999999999998

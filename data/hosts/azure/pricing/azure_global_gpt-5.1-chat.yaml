apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_global_gpt-5.1-chat
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/global/gpt-5.1-chat
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.25
        - meter: tokens.output
          unit: per_million
          amount: 10
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.125

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_us_o3
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/us/o3
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 2.2
        - meter: tokens.output
          unit: per_million
          amount: 8.8
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.55

apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_gpt-4o-realtime
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/gpt-4o-realtime
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 5
        - meter: tokens.output
          unit: per_million
          amount: 20
        - meter: tokens.cache_read
          unit: per_million
          amount: 2.5

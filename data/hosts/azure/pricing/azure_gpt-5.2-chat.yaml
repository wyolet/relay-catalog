apiVersion: relay.wyolet.dev/v1alpha2
kind: Pricing
metadata:
    name: azure-azure_gpt-5.2-chat
    owner:
        kind: host
        id: azure
spec:
    currency: USD
    targetModels:
        - azure/gpt-5.2-chat
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 1.75
        - meter: tokens.output
          unit: per_million
          amount: 14
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.175

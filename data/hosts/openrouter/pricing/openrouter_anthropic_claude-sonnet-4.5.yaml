    name: openrouter-openrouter_anthropic_claude-sonnet-4.5
    owner:
        kind: host
        id: openrouter
spec:
    currency: USD
    targetModels:
        - openrouter/anthropic/claude-sonnet-4.5
    rates:
        - meter: tokens.input
          unit: per_million
          amount: 3
        - meter: tokens.output
          unit: per_million
          amount: 15
        - meter: tokens.cache_creation
          unit: per_million
          amount: 3.75
        - meter: tokens.cache_read
          unit: per_million
          amount: 0.3

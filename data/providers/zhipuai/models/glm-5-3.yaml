# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: glm-5-3
    displayName: GLM-5.3
    description: Flagship GLM model for long-horizon coding, agents, and complex project delivery.
    owner:
        kind: provider
        name: zhipuai
    labels:
        featured: "true"
        family: glm
        source: models.dev
        source_version: "2026-08-23"
spec:
    family: glm
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 131072
    contextWindowTotal: 1000000
    maxOutputTokens: 131072
    releaseDate: "2026-08-14"
    snapshots:
        - name: glm-5-3
          releasedAt: "2026-08-14"
          originalName: glm-5.3
    pointer: glm-5-3

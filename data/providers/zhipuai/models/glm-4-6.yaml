# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: glm-4-6
    displayName: GLM 4.6
    owner:
        kind: provider
        name: zhipuai
    labels:
        family: glm-4.6
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-cloud
          adapter: openai
    family: glm-4.6
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: glm-4-6-cloud
          originalName: glm-4.6:cloud
    pointer: glm-4-6-cloud

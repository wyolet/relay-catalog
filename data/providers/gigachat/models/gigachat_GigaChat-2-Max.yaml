apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gigachat/GigaChat-2-Max
    owner:
        kind: provider
        name: gigachat
    labels:
        family: gigachat/GigaChat
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gigachat
          upstreamName: gigachat/GigaChat-2-Max
          adapter: openai
    family: gigachat/GigaChat
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: gigachat/GigaChat-2-Max
          originalName: gigachat/GigaChat-2-Max
    pointer: gigachat/GigaChat-2-Max

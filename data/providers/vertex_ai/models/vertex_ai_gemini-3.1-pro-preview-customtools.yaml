apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vertex_ai/gemini-3.1-pro-preview-customtools
    owner:
        kind: provider
        name: vertex_ai
    labels:
        family: vertex_ai/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai
          upstreamName: vertex_ai/gemini-3.1-pro-preview-customtools
          adapter: openai
    family: vertex_ai/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    snapshots:
        - name: vertex_ai/gemini-3.1-pro-preview-customtools
          originalName: vertex_ai/gemini-3.1-pro-preview-customtools
    pointer: vertex_ai/gemini-3.1-pro-preview-customtools

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot/moonshot-v1-8k-vision
    owner:
        kind: provider
        name: moonshot
    labels:
        family: moonshot/moonshot
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: moonshot
          upstreamName: moonshot/moonshot-v1-8k-vision
          adapter: openai
    family: moonshot/moonshot
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    aliases:
        - moonshot/moonshot-v1-8k-vision-preview
    snapshots:
        - name: moonshot/moonshot-v1-8k-vision
          originalName: moonshot/moonshot-v1-8k-vision
    pointer: moonshot/moonshot-v1-8k-vision

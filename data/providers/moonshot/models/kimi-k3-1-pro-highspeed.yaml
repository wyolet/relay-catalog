# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Model
metadata:
    name: kimi-k3-1-pro-highspeed
    displayName: Kimi K3.1 Pro Highspeed
    description: Multimodal Kimi model with 1M context and always-on reasoning for coding, 3D creation, financial research, and agentic work.
    owner:
        kind: provider
        name: moonshot
    labels:
        source: models.dev
        source_version: "2026-11-07"
spec:
    family: kimi
    capabilities:
        unsupportedParams:
            - temperature
            - top_p
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
        reasoningEfforts:
            - low
            - high
            - max
    modalities:
        input:
            - text
            - image
            - video
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 131072
    contextWindowTotal: 1048576
    maxOutputTokens: 131072
    releaseDate: "2026-10-23"
    tags:
        - open-weights
    snapshots:
        - name: kimi-k3-1-pro-highspeed
          releasedAt: "2026-10-23"
          originalName: kimi-k3.1-pro-highspeed
    pointer: kimi-k3-1-pro-highspeed

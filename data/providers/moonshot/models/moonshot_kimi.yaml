apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot/kimi
    owner:
        kind: provider
        name: moonshot
    labels:
        family: moonshot/kimi
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: moonshot
          upstreamName: moonshot/kimi
          adapter: openai
    family: moonshot/kimi
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 131072
    contextWindowTotal: 131072
    aliases:
        - moonshot/kimi-latest
    snapshots:
        - name: moonshot/kimi
          originalName: moonshot/kimi
    pointer: moonshot/kimi

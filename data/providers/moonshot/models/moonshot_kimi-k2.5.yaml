apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot/kimi-k2.5
    owner:
        kind: provider
        name: moonshot
    labels:
        family: moonshot/kimi
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: moonshot
          upstreamName: moonshot/kimi-k2.5
          adapter: openai
    family: moonshot/kimi
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    snapshots:
        - name: moonshot/kimi-k2.5
          originalName: moonshot/kimi-k2.5
    pointer: moonshot/kimi-k2.5

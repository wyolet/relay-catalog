# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: kimi-k2
    displayName: Kimi K2
    owner:
        kind: provider
        name: moonshot
    labels:
        family: kimi-k2
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: kimi-k2
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: kimi-k2-1t-cloud
          originalName: kimi-k2:1t-cloud
    pointer: kimi-k2-1t-cloud
---

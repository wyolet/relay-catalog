apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: moonshot/moonshot-v1-32k
    owner:
        kind: provider
        name: moonshot
    labels:
        family: moonshot/moonshot
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: moonshot
          upstreamName: moonshot/moonshot-v1-32k
          adapter: openai
    family: moonshot/moonshot
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 32768
    contextWindowTotal: 32768
    snapshots:
        - name: moonshot/moonshot-v1-32k
          originalName: moonshot/moonshot-v1-32k
    pointer: moonshot/moonshot-v1-32k

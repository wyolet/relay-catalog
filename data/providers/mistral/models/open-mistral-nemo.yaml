# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: open-mistral-nemo
  displayName: Open Mistral Nemo
  owner:
    kind: provider
    name: mistral
  labels:
    family: mistral-nemo
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: mistral-nemo
  capabilities:
    chat: true
    streaming: true
    tools: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 128000
  contextWindowOutput: 128000
  contextWindowTotal: 128000
  maxOutputTokens: 128000
  knowledgeCutoff: 2024-07
  releaseDate: '2024-07-01'
  tags:
  - open-weights
  enabled: true
  snapshots:
  - name: open-mistral-nemo
    releasedAt: '2024-07-01'
  pointer: open-mistral-nemo

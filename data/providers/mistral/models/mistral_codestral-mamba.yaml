apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral/codestral-mamba
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral/codestral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          upstreamName: mistral/codestral-mamba
          adapter: openai
    family: mistral/codestral
    capabilities:
        chat: true
        streaming: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 256000
    contextWindowTotal: 256000
    aliases:
        - mistral/codestral-mamba-latest
    snapshots:
        - name: mistral/codestral-mamba
          originalName: mistral/codestral-mamba
    pointer: mistral/codestral-mamba

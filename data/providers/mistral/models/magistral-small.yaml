# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: magistral-small
  displayName: Magistral Small
  owner:
    kind: provider
    name: mistral
  labels:
    family: magistral-small
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: magistral-small
  capabilities:
    chat: true
    streaming: true
    tools: true
    reasoning: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 128000
  contextWindowOutput: 128000
  contextWindowTotal: 128000
  maxOutputTokens: 128000
  knowledgeCutoff: 2025-06
  releaseDate: '2025-03-17'
  tags:
  - open-weights
  enabled: true
  snapshots:
  - name: magistral-small-latest
  pointer: magistral-small-latest

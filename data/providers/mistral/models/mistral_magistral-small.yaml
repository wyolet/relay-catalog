apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral/magistral-small
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral/magistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          upstreamName: mistral/magistral-small
          adapter: openai
    family: mistral/magistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        structuredOutputs: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 40000
    contextWindowOutput: 40000
    contextWindowTotal: 40000
    aliases:
        - mistral/magistral-small-latest
    snapshots:
        - name: mistral/magistral-small
          originalName: mistral/magistral-small
    pointer: mistral/magistral-small

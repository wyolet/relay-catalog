apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral/pixtral-large
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral/pixtral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          upstreamName: mistral/pixtral-large
          adapter: openai
    family: mistral/pixtral
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
        assistantPrefill: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    aliases:
        - mistral/pixtral-large-latest
    snapshots:
        - name: mistral/pixtral-large
          originalName: mistral/pixtral-large
    pointer: mistral/pixtral-large

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistrallite
    displayName: MistralLite
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistrallite
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: mistrallite
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistrallite-latest
          originalName: mistrallite:latest
        - name: mistrallite-7b
          originalName: mistrallite:7b
    pointer: mistrallite-7b

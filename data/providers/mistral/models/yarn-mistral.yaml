# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: yarn-mistral
    displayName: Yarn Mistral
    owner:
        kind: provider
        name: mistral
    labels:
        family: yarn-mistral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: yarn-mistral
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: yarn-mistral-latest
          originalName: yarn-mistral:latest
        - name: yarn-mistral-7b
          originalName: yarn-mistral:7b
    pointer: yarn-mistral-7b

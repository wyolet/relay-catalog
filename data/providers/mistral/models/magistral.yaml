# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: magistral
    displayName: Magistral
    owner:
        kind: provider
        name: mistral
    labels:
        family: magistral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: magistral
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: magistral-latest
          originalName: magistral:latest
        - name: magistral-24b
          originalName: magistral:24b
    pointer: magistral-24b

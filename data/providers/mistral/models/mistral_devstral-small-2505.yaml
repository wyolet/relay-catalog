apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral/devstral-small-2505
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral/devstral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: mistral
          upstreamName: mistral/devstral-small-2505
          adapter: openai
    family: mistral/devstral
    capabilities:
        chat: true
        streaming: true
        tools: true
        structuredOutputs: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    snapshots:
        - name: mistral/devstral-small-2505
          originalName: mistral/devstral-small-2505
    pointer: mistral/devstral-small-2505

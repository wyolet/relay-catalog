# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: devstral-small
  displayName: Devstral Small
  owner:
    kind: provider
    name: mistral
  labels:
    family: devstral
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: devstral
  capabilities:
    chat: true
    streaming: true
    tools: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 128000
  contextWindowOutput: 128000
  contextWindowTotal: 128000
  maxOutputTokens: 128000
  knowledgeCutoff: 2025-05
  releaseDate: '2025-07-10'
  tags:
  - open-weights
  enabled: true
  snapshots:
  - name: devstral-small-latest
  pointer: devstral-small-latest

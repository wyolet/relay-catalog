# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mixtral-8x7b
    displayName: Mixtral 8x7B
    owner:
        kind: provider
        name: mistral
    labels:
        family: mixtral
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: mixtral
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mixtral-8x7b
          originalName: mixtral:8x7b
    pointer: mixtral-8x7b

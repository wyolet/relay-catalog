# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-nemo
    displayName: Mistral Nemo
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral-nemo
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: mistral-nemo
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistral-nemo-latest
          originalName: mistral-nemo:latest
        - name: mistral-nemo-12b
          originalName: mistral-nemo:12b
    pointer: mistral-nemo-12b

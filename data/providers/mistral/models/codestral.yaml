# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: codestral
    displayName: Codestral
    owner:
        kind: provider
        name: mistral
    labels:
        family: codestral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: codestral
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: codestral-latest
          originalName: codestral:latest
        - name: codestral-22b
          originalName: codestral:22b
    pointer: codestral-22b

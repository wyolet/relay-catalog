# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: ministral-3-3b
    displayName: Ministral 3 3B
    owner:
        kind: provider
        name: mistral
    labels:
        family: ministral-3
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
          snapshots: [ministral-3-3b]
        - host: ollama-cloud
          adapter: openai
          snapshots: [ministral-3-3b-cloud]
    family: ministral-3
    capabilities:
        chat: true
        tools: true
        vision: true
        reasoning: false
    modalities:
        input:
            - text
            - image
        output:
            - text
    snapshots:
        - name: ministral-3-3b
          originalName: ministral-3:3b
        - name: ministral-3-3b-cloud
          originalName: ministral-3:3b-cloud
    pointer: ministral-3-3b
---

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-small
    displayName: Mistral Small
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral-small
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: mistral-small
          adapter: openai
    family: mistral-small
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistral-small-latest
          originalName: mistral-small:latest
        - name: mistral-small-22b
          originalName: mistral-small:22b
    pointer: mistral-small-22b
---

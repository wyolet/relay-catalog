# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: devstral-medium
  displayName: Devstral 2 (latest)
  owner:
    kind: provider
    name: mistral
  labels:
    family: devstral
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: devstral
  capabilities:
    chat: true
    streaming: true
    tools: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 262144
  contextWindowOutput: 262144
  contextWindowTotal: 262144
  maxOutputTokens: 262144
  knowledgeCutoff: 2025-12
  releaseDate: '2025-12-02'
  tags:
  - open-weights
  enabled: true
  snapshots:
  - name: devstral-medium-latest
  pointer: devstral-medium-latest

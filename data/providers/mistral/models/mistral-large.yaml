# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-large
    displayName: Mistral Large
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral-large
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: mistral-large
          adapter: openai
    family: mistral-large
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistral-large-latest
          originalName: mistral-large:latest
        - name: mistral-large-123b
          originalName: mistral-large:123b
    pointer: mistral-large-123b
---

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: samantha-mistral
    displayName: Samantha Mistral
    owner:
        kind: provider
        name: mistral
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: mistral
    productLine: samantha
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2023-09-30"
    snapshots:
        - name: samantha-mistral-latest
          originalName: samantha-mistral:latest
        - name: samantha-mistral-7b
          originalName: samantha-mistral:7b
    pointer: samantha-mistral-7b

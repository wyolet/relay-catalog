# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mathstral
    displayName: Mathstral
    owner:
        kind: provider
        name: mistral
    labels:
        family: mathstral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: mathstral
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mathstral-latest
          originalName: mathstral:latest
        - name: mathstral-7b
          originalName: mathstral:7b
    pointer: mathstral-7b

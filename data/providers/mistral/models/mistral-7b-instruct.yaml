# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-7b-instruct-v0-1
    displayName: Mistral 7B Instruct v0.1
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: mistral-7B-Instruct-v0.1
          adapter: openai
    family: mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: mistral-7b-instruct-v0-1
          originalName: mistral-7B-Instruct-v0.1
    pointer: mistral-7b-instruct-v0-1

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: mistral-embed
  displayName: Mistral Embed
  owner:
    kind: provider
    name: mistral
  labels:
    family: mistral-embed
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: mistral-embed
  capabilities:
    chat: true
    streaming: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 8000
  contextWindowOutput: 3072
  contextWindowTotal: 8000
  maxOutputTokens: 3072
  releaseDate: '2023-12-11'
  enabled: true
  snapshots:
  - name: mistral-embed
    releasedAt: '2023-12-01'
  pointer: mistral-embed

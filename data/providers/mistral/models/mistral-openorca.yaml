apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral-openorca
    displayName: Mistral OpenOrca
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral-openorca
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: mistral-openorca
          adapter: openai
    family: mistral-openorca
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistral-openorca-latest
          originalName: mistral-openorca:latest
        - name: mistral-openorca-7b
          originalName: mistral-openorca:7b
    pointer: mistral-openorca-7b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: mistral
    displayName: Mistral
    owner:
        kind: provider
        name: mistral
    labels:
        family: mistral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: mistral
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: mistral-latest
          originalName: mistral:latest
        - name: mistral-7b
          originalName: mistral:7b
    pointer: mistral-7b

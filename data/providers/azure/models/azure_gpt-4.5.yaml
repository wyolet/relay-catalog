apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure/gpt-4.5
    owner:
        kind: provider
        name: azure
    labels:
        family: azure/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-4.5
          adapter: openai
    family: azure/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    aliases:
        - azure/gpt-4.5-preview
    snapshots:
        - name: azure/gpt-4.5
          originalName: azure/gpt-4.5
    pointer: azure/gpt-4.5

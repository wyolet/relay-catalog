apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure/gpt-4-turbo-vision
    owner:
        kind: provider
        name: azure
    labels:
        family: azure/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-4-turbo-vision
          adapter: openai
    family: azure/gpt
    capabilities:
        chat: true
        streaming: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    aliases:
        - azure/gpt-4-turbo-vision-preview
    snapshots:
        - name: azure/gpt-4-turbo-vision
          originalName: azure/gpt-4-turbo-vision
    pointer: azure/gpt-4-turbo-vision

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: computer-use
    owner:
        kind: provider
        name: azure
    labels:
        family: computer
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: computer-use
          adapter: openai
    family: computer
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 1024
    contextWindowTotal: 8192
    aliases:
        - computer-use-preview
    snapshots:
        - name: computer-use
          originalName: computer-use
    pointer: computer-use

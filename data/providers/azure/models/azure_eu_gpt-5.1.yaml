apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure/eu/gpt-5.1
    owner:
        kind: provider
        name: azure
    labels:
        family: azure/eu/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/eu/gpt-5.1
          adapter: openai
    family: azure/eu/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 272000
    snapshots:
        - name: azure/eu/gpt-5.1
          originalName: azure/eu/gpt-5.1
    pointer: azure/eu/gpt-5.1

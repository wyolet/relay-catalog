apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure/gpt-5.1-chat
    owner:
        kind: provider
        name: azure
    labels:
        family: azure/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-5.1-chat-2025-11-13
          adapter: openai
    family: azure/gpt
    capabilities:
        chat: true
        streaming: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: azure/gpt-5.1-chat-2025-11-13
          releasedAt: "2025-11-13"
          originalName: azure/gpt-5.1-chat-2025-11-13
    pointer: azure/gpt-5.1-chat-2025-11-13

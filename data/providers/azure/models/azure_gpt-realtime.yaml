apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure/gpt-realtime
    owner:
        kind: provider
        name: azure
    labels:
        family: azure/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure
          upstreamName: azure/gpt-realtime-2025-08-28
          adapter: openai
    family: azure/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        audioInput: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - audio
        output:
            - text
            - audio
    contextWindowInput: 32000
    contextWindowOutput: 4096
    contextWindowTotal: 32000
    snapshots:
        - name: azure/gpt-realtime-2025-08-28
          releasedAt: "2025-08-28"
          originalName: azure/gpt-realtime-2025-08-28
    pointer: azure/gpt-realtime-2025-08-28

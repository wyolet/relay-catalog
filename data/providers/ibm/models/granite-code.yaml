apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: granite-code-3b
    displayName: Granite Code 3B
    owner:
        kind: provider
        name: ibm
    labels:
        family: granite-code
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: granite-code
          adapter: openai
    family: granite-code
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: granite-code-3b
          originalName: granite-code:3b
    pointer: granite-code-3b
---

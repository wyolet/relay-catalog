# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: granite3-guardian-2b
    displayName: Granite 3 Guardian 2B
    owner:
        kind: provider
        name: ibm
    labels:
        family: granite3-guardian
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: granite3-guardian
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: granite3-guardian-2b
          originalName: granite3-guardian:2b
    pointer: granite3-guardian-2b

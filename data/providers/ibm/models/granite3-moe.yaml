apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: granite3-moe-1b
    displayName: Granite 3 MOE 1B
    owner:
        kind: provider
        name: ibm
    labels:
        family: granite3-moe
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: granite3-moe
          adapter: openai
    family: granite3-moe
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: granite3-moe-1b
          originalName: granite3-moe:1b
    pointer: granite3-moe-1b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: granite4-1-3b
    displayName: Granite 4.1 3B
    owner:
        kind: provider
        name: ibm
    labels:
        family: granite4.1
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: granite4.1
          adapter: openai
    family: granite4.1
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: granite4-1-3b
          originalName: granite4.1:3b
    pointer: granite4-1-3b

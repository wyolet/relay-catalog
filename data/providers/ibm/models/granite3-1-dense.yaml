# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: granite3-1-dense-2b
    displayName: Granite 3.1 Dense 2B
    owner:
        kind: provider
        name: ibm
    labels:
        family: granite3.1-dense
        source: ollama-library
        source_version: '2026-05-20'
spec:
    family: granite3.1-dense
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: granite3-1-dense-2b
          originalName: granite3.1-dense:2b
    pointer: granite3-1-dense-2b

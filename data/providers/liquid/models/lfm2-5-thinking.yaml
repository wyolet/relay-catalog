# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: lfm2-5-thinking
    displayName: LFM 2.5 Thinking
    owner:
        kind: provider
        name: liquid
    labels:
        family: lfm2.5-thinking
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: lfm2.5-thinking
          adapter: openai
    family: lfm2.5-thinking
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: lfm2-5-thinking-latest
          originalName: lfm2.5-thinking:latest
        - name: lfm2-5-thinking-1-2b
          originalName: lfm2.5-thinking:1.2b
    pointer: lfm2-5-thinking-1-2b

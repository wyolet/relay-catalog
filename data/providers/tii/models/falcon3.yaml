# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: falcon3-1b
    displayName: Falcon 3 1B
    owner:
        kind: provider
        name: tii
    labels:
        family: falcon3
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: falcon3
          adapter: openai
    family: falcon3
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: falcon3-1b
          originalName: falcon3:1b
    pointer: falcon3-1b
---

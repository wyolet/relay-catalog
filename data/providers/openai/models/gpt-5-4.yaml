apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-4
    displayName: GPT-5.4
    owner:
        kind: provider
        name: openai
    labels:
        featured: "true"
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1050000
    contextWindowOutput: 128000
    contextWindowTotal: 1050000
    snapshots:
        - name: gpt-5-4
          originalName: gpt-5.4
        - name: gpt-5-4-2026-03-05
          releasedAt: "2026-03-05"
          originalName: gpt-5.4-2026-03-05
    pointer: gpt-5-4

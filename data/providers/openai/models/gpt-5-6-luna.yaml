# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-6-luna
    displayName: GPT-5.6 Luna
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt-nano
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: gpt-nano
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 922000
    contextWindowOutput: 128000
    contextWindowTotal: 1050000
    maxOutputTokens: 128000
    knowledgeCutoff: "2026-02-16"
    releaseDate: "2026-07-09"
    snapshots:
        - name: gpt-5-6-luna
          releasedAt: "2026-07-09"
          originalName: gpt-5.6-luna
    pointer: gpt-5-6-luna

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-4o
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: gpt-4o
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: gpt-4o
        - name: gpt-4o-2024-05-13
          releasedAt: "2024-05-13"
        - name: gpt-4o-2024-08-06
          releasedAt: "2024-08-06"
        - name: gpt-4o-2024-11-20
          releasedAt: "2024-11-20"
    pointer: gpt-4o

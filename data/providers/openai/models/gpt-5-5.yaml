# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-5
    displayName: GPT-5.5
    owner:
        kind: provider
        name: openai
    labels:
        featured: "true"
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1050000
    contextWindowOutput: 128000
    contextWindowTotal: 1050000
    snapshots:
        - name: gpt-5-5
          originalName: gpt-5.5
        - name: gpt-5-5-2026-04-23
          releasedAt: "2026-04-23"
          originalName: gpt-5.5-2026-04-23
    pointer: gpt-5-5

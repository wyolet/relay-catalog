# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-1
    displayName: GPT-5.1
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 272000
    snapshots:
        - name: gpt-5-1
          originalName: gpt-5.1
        - name: gpt-5-1-2025-11-13
          releasedAt: "2025-11-13"
          originalName: gpt-5.1-2025-11-13
    pointer: gpt-5-1
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-1-chat
    displayName: GPT-5.1 Chat
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: gpt-5-1-chat-latest
          originalName: gpt-5.1-chat-latest
    pointer: gpt-5-1-chat-latest

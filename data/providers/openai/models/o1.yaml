# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o1
    displayName: O1
    owner:
        kind: provider
        name: openai
    labels:
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    productLine: o
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    releaseDate: "2024-12-05"
    snapshots:
        - name: o1
        - name: o1-2024-12-17
          releasedAt: "2024-12-17"
    pointer: o1

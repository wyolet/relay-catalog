# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o3-mini
    displayName: O3 Mini
    owner:
        kind: provider
        name: openai
    labels:
        family: o-series
        source: litellm
        source_version: "2026-05-20"
spec:
    family: o-series
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    snapshots:
        - name: o3-mini
        - name: o3-mini-2025-01-31
          releasedAt: "2025-01-31"
    pointer: o3-mini

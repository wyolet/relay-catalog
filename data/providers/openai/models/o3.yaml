# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o3
    displayName: O3
    owner:
        kind: provider
        name: openai
    labels:
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    productLine: o
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    releaseDate: "2025-04-16"
    snapshots:
        - name: o3
        - name: o3-2025-04-16
          releasedAt: "2025-04-16"
    pointer: o3

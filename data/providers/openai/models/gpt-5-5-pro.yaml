# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5-5-pro
    displayName: GPT-5.5 Pro
    owner:
        kind: provider
        name: openai
    labels:
        featured: "true"
        family: gpt-pro
        source: models.dev
        source_version: "2026-07-12"
spec:
    family: gpt-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 922000
    contextWindowOutput: 128000
    contextWindowTotal: 1050000
    maxOutputTokens: 128000
    knowledgeCutoff: "2025-12-01"
    releaseDate: "2026-04-23"
    snapshots:
        - name: gpt-5-5-pro
          releasedAt: "2026-04-23"
          originalName: gpt-5.5-pro
    pointer: gpt-5-5-pro

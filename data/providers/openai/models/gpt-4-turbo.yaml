apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-4-turbo
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: gpt-4-turbo-2024-04-09
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    aliases:
        - gpt-4-turbo-preview
    snapshots:
        - name: gpt-4-turbo-2024-04-09
          releasedAt: "2024-04-09"
          originalName: gpt-4-turbo-2024-04-09
    pointer: gpt-4-turbo-2024-04-09

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-6-astra
    displayName: GPT-6 Astra
    description: OpenAI's most capable model for complex reasoning, coding, computer use, research, and document creation.
    owner:
        kind: provider
        name: openai
    labels:
        featured: "true"
        family: gpt-astra
        source: models.dev
        source_version: "2026-09-05"
spec:
    family: gpt-astra
    capabilities:
        unsupportedParams:
            - temperature
            - top_p
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 922000
    contextWindowOutput: 128000
    contextWindowTotal: 1050000
    maxOutputTokens: 128000
    releaseDate: "2026-09-04"
    snapshots:
        - name: gpt-6-astra
          releasedAt: "2026-09-04"
    pointer: gpt-6-astra

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: chatgpt-4o
    displayName: ChatGPT-4o
    owner:
        kind: provider
        name: openai
    labels:
        family: chatgpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: chatgpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: chatgpt-4o-latest
    pointer: chatgpt-4o-latest

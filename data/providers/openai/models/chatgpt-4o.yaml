apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: chatgpt-4o
    owner:
        kind: provider
        name: openai
    labels:
        family: chatgpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: chatgpt-4o
          adapter: openai
    family: chatgpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    aliases:
        - chatgpt-4o-latest
    snapshots:
        - name: chatgpt-4o
          originalName: chatgpt-4o
    pointer: chatgpt-4o

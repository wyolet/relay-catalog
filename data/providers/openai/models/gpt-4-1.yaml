# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-4-1
    displayName: GPT-4.1
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: gpt-4.1
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1047576
    contextWindowOutput: 32768
    contextWindowTotal: 1047576
    snapshots:
        - name: gpt-4-1
          originalName: gpt-4.1
        - name: gpt-4-1-2025-04-14
          releasedAt: "2025-04-14"
          originalName: gpt-4.1-2025-04-14
    pointer: gpt-4-1

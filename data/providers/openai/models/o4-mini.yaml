# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: o4-mini
    displayName: O4 Mini
    owner:
        kind: provider
        name: openai
    labels:
        family: o-series
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          adapter: openai
    family: o-series
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        webSearch: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    snapshots:
        - name: o4-mini
        - name: o4-mini-2025-04-16
          releasedAt: "2025-04-16"
    pointer: o4-mini

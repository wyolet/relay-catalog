apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openai-container
    displayName: OpenAI Container
    owner:
        kind: provider
        name: openai
    labels:
        family: openai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: openai/container
          adapter: openai
    family: openai
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: openai-container
          originalName: openai/container
    pointer: openai-container

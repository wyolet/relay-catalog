apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-realtime-mini
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: gpt-realtime-mini
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        audioInput: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - audio
        output:
            - text
            - audio
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: gpt-realtime-mini
        - name: gpt-realtime-mini-2025-10-06
          releasedAt: "2025-10-06"
        - name: gpt-realtime-mini-2025-12-15
          releasedAt: "2025-12-15"
    pointer: gpt-realtime-mini

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-realtime
    displayName: GPT Realtime
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        audioInput: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - audio
        output:
            - text
            - audio
    contextWindowInput: 32000
    contextWindowOutput: 4096
    contextWindowTotal: 32000
    snapshots:
        - name: gpt-realtime
        - name: gpt-realtime-2025-08-28
          releasedAt: "2025-08-28"
    pointer: gpt-realtime

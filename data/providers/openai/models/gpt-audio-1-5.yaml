apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-audio-1-5
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openai
          upstreamName: gpt-audio-1.5
          adapter: openai
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        audioInput: true
        audioOutput: true
        systemMessages: true
    modalities:
        input:
            - text
            - audio
        output:
            - text
            - audio
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: gpt-audio-1-5
          originalName: gpt-audio-1.5
    pointer: gpt-audio-1-5

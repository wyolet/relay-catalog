# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-oss-20b
    displayName: GPT OSS 20B
    owner:
        kind: provider
        name: openai
    labels:
        family: openai
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
          snapshots: [gpt-oss-20b]
        - host: ollama-cloud
          adapter: openai
          snapshots: [gpt-oss-20b-cloud]
    family: openai
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 131072
    contextWindowTotal: 131072
    snapshots:
        - name: gpt-oss-20b
          originalName: gpt-oss:20b
        - name: gpt-oss-20b-cloud
          originalName: gpt-oss:20b-cloud
    pointer: gpt-oss-20b
---

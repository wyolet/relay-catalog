# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: ft-gpt-4o
    displayName: Fine-tuned GPT-4o
    owner:
        kind: provider
        name: openai
    labels:
        family: ft
        source: litellm
        source_version: "2026-05-20"
spec:
    family: ft
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        promptCache: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - file
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: ft-gpt-4o-2024-08-06
          releasedAt: "2024-08-06"
          originalName: ft:gpt-4o-2024-08-06
        - name: ft-gpt-4o-2024-11-20
          releasedAt: "2024-11-20"
          originalName: ft:gpt-4o-2024-11-20
    pointer: ft-gpt-4o-2024-11-20
---

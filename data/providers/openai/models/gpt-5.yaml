apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gpt-5
    displayName: GPT-5
    owner:
        kind: provider
        name: openai
    labels:
        family: gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    family: gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 272000
    contextWindowOutput: 128000
    contextWindowTotal: 272000
    snapshots:
        - name: gpt-5
        - name: gpt-5-2025-08-07
          releasedAt: "2025-08-07"
    pointer: gpt-5

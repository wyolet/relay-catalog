# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Model
metadata:
    name: gemini-4-neon
    displayName: Gemini 4 Neon
    description: Google's Gemini 4 model for fast, frontier-level coding, knowledge work, and science workflows.
    owner:
        kind: provider
        name: google
    labels:
        featured: "true"
        source: models.dev
        source_version: "2026-11-21"
spec:
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    # 65536 is the default synchronous output cap; Google's long-decode mode raises it to the full context.
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    releaseDate: "2026-11-18"
    knowledgeCutoff: "2026-03"
    snapshots:
        - name: gemini-4-neon
          originalName: gemini-4-neon
          releasedAt: "2026-11-18"
    pointer: gemini-4-neon
    tags:
        - multimodal
        - thinking
        - structured-outputs
        - agentic

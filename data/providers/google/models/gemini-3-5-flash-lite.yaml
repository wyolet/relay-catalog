# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-5-flash-lite
    displayName: Gemini 3.5 Flash Lite
    description: Cost-optimized lite model. Faster and cheaper than the 3.1 generation.
    owner:
        kind: provider
        name: google
    labels:
        family: gemini-3-5-flash-lite
        source: models.dev
        source_version: "2026-07-24"
spec:
    family: gemini-3-5-flash-lite
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2026-03"
    releaseDate: "2026-07-21"
    snapshots:
        - name: gemini-3-5-flash-lite
          originalName: gemini-3.5-flash-lite
          releasedAt: "2026-07-21"
    pointer: gemini-3-5-flash-lite
    tags:
        - cost-optimized
        - multimodal
        - thinking
        - structured-outputs

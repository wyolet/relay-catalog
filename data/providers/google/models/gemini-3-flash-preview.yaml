# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-flash-preview
    displayName: Gemini 3 Flash (Preview)
    description: Earlier-generation flash model in preview. Available via Google AI Studio (full capabilities) and Ollama (vision only).
    owner:
        kind: provider
        name: google
    labels:
        family: gemini-3-flash-preview
        source: google-ai-studio
        source_version: "2026-05-21"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
          snapshots: [gemini-3-flash-preview-latest]
        - host: ollama-cloud
          adapter: openai
          snapshots: [gemini-3-flash-preview-cloud]
        - host: google-ai-studio
          adapter: openai
          snapshots: [gemini-3-flash-preview]
    family: gemini-3-flash-preview
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    snapshots:
        - name: gemini-3-flash-preview-latest
          originalName: gemini-3-flash-preview:latest
        - name: gemini-3-flash-preview-cloud
          originalName: gemini-3-flash-preview:cloud
        - name: gemini-3-flash-preview
          originalName: gemini-3-flash-preview
    pointer: gemini-3-flash-preview-latest
    tags:
        - preview
        - multimodal
        - thinking
        - structured-outputs

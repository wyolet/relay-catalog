# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-1-flash-lite-preview
    displayName: Gemini 3.1 Flash-Lite (Preview)
    description: Preview variant of 3.1 Flash-Lite. Capabilities and pricing match the stable version.
    owner:
        kind: provider
        name: google
    labels:
        source: google-ai-studio
        source_version: "2026-05-21"
spec:
    family: gemini
    productLine: flash-lite
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2025-01-01"
    releaseDate: "2026-03-03"
    snapshots:
        - name: gemini-3-1-flash-lite-preview
          originalName: gemini-3.1-flash-lite-preview
    pointer: gemini-3-1-flash-lite-preview
    tags:
        - preview
        - cost-optimized
        - multimodal
        - thinking
        - structured-outputs

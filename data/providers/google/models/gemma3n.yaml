apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemma3n-e2b
    displayName: Gemma 3N E2B
    owner:
        kind: provider
        name: google
    labels:
        family: gemma3n
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: gemma3n
          adapter: openai
    family: gemma3n
    capabilities:
        chat: true
        tools: true
        vision: true
        reasoning: false
    modalities:
        input:
            - text
            - image
            - audio
        output:
            - text
    snapshots:
        - name: gemma3n-e2b
          originalName: gemma3n:e2b
    pointer: gemma3n-e2b

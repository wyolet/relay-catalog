# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: gemini-3-1-flash-image-preview
  displayName: Nano Banana 2
  owner:
    kind: provider
    name: google
  labels:
    family: gemini-flash
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: gemini-flash
  capabilities:
    chat: true
    streaming: true
    vision: true
    reasoning: true
    fileInput: true
    systemMessages: true
  modalities:
    input:
    - text
    - image
    - pdf
    output:
    - text
    - image
  contextWindowInput: 65536
  contextWindowOutput: 65536
  contextWindowTotal: 65536
  maxOutputTokens: 65536
  knowledgeCutoff: 2025-01
  releaseDate: '2026-02-26'
  enabled: true
  snapshots:
  - name: gemini-3-1-flash-image-preview
    originalName: gemini-3.1-flash-image-preview
  pointer: gemini-3-1-flash-image-preview

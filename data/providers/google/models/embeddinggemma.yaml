# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: embeddinggemma
    displayName: Embedding Gemma
    owner:
        kind: provider
        name: google
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: gemma
    productLine: embeddinggemma
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2025-09-04"
    snapshots:
        - name: embeddinggemma-latest
          originalName: embeddinggemma:latest
        - name: embeddinggemma-300m
          originalName: embeddinggemma:300m
    pointer: embeddinggemma-300m

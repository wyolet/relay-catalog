# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: functiongemma
    displayName: Function Gemma
    owner:
        kind: provider
        name: google
    labels:
        family: functiongemma
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: functiongemma
          adapter: openai
    family: functiongemma
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: functiongemma-latest
          originalName: functiongemma:latest
    pointer: functiongemma-latest

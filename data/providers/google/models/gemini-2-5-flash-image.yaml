# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: gemini-2-5-flash-image
  displayName: Nano Banana
  owner:
    kind: provider
    name: google
  labels:
    family: gemini-flash
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: gemini-flash
  capabilities:
    chat: true
    streaming: true
    vision: true
    promptCache: true
    reasoning: true
    systemMessages: true
  modalities:
    input:
    - text
    - image
    output:
    - text
    - image
  contextWindowInput: 32768
  contextWindowOutput: 32768
  contextWindowTotal: 32768
  maxOutputTokens: 32768
  knowledgeCutoff: 2025-06
  releaseDate: '2025-08-26'
  enabled: true
  snapshots:
  - name: gemini-2-5-flash-image
    originalName: gemini-2.5-flash-image
  pointer: gemini-2-5-flash-image

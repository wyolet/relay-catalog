# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-1-pro-preview
    displayName: Gemini 3.1 Pro (Preview)
    description: Advanced intelligence for complex problem-solving. Currently in preview; replaces the shut-down gemini-3-pro-preview.
    owner:
        kind: provider
        name: google
    labels:
        family: gemini-3-1-pro-preview
        source: google-ai-studio
        source_version: "2026-05-21"
spec:
    hosts:
        - host: google-ai-studio
          adapter: openai
          snapshots:
              - gemini-3-1-pro-preview
    family: gemini-3-1-pro-preview
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2025-01-01"
    snapshots:
        - name: gemini-3-1-pro-preview
          originalName: gemini-3.1-pro-preview
    pointer: gemini-3-1-pro-preview
    tags:
        - preview
        - premium
        - multimodal
        - thinking
        - structured-outputs

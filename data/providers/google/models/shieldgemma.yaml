# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: shieldgemma-2b
    displayName: ShieldGemma 2B
    owner:
        kind: provider
        name: google
    labels:
        family: shieldgemma
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: shieldgemma
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: shieldgemma-2b
          originalName: shieldgemma:2b
    pointer: shieldgemma-2b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-7-flash
    displayName: Gemini 3.7 Flash
    description: High-efficiency Gemini model for agentic workflows, coding, and multimodal reasoning.
    owner:
        kind: provider
        name: google
    labels:
        source: models.dev
        source_version: "2026-08-23"
spec:
    family: gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2026-03"
    releaseDate: "2026-08-13"
    # Replaced by gemini-3-8-flash. No shutdown date: Google keeps the endpoint and routes its requests to gemini-3.8-flash.
    deprecation:
        status: deprecated
    snapshots:
        - name: gemini-3-7-flash
          originalName: gemini-3.7-flash
          releasedAt: "2026-08-13"
    pointer: gemini-3-7-flash
    tags:
        - multimodal
        - thinking
        - structured-outputs
        - agentic

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-8-flash
    displayName: Gemini 3.8 Flash
    description: Google's most intelligent Flash model, engineered for long-horizon software engineering, autonomous agents, and complex enterprise workflows.
    owner:
        kind: provider
        name: google
    labels:
        featured: "true"
        family: gemini-3-8-flash
        source: models.dev
        source_version: "2026-09-05"
spec:
    family: gemini-3-8-flash
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    releaseDate: "2026-09-02"
    snapshots:
        - name: gemini-3-8-flash
          originalName: gemini-3.8-flash
          releasedAt: "2026-09-02"
    pointer: gemini-3-8-flash
    # Google's rolling "latest" name; sent upstream verbatim.
    aliases:
        - gemini-flash-latest
    tags:
        - newest
        - multimodal
        - thinking
        - structured-outputs
        - agentic

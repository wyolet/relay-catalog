# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-2-5-pro
    displayName: Gemini 2.5 Pro
    owner:
        kind: provider
        name: google
    labels:
        family: gemini-2-5-pro
        source: google-ai-studio
        source_version: "2026-05-21"
spec:
    hosts:
        - host: google-ai-studio
          adapter: openai
          snapshots:
              - gemini-2-5-pro
              - gemini-2-5-pro-001
    family: gemini-2-5-pro
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    snapshots:
        - name: gemini-2-5-pro
          originalName: gemini-2.5-pro
        - name: gemini-2-5-pro-001
          originalName: gemini-2.5-pro-001
          releasedAt: "2025-03-25"
    pointer: gemini-2-5-pro
    tags:
        - multimodal
        - thinking
        - structured-outputs
        - premium

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-6-flash
    displayName: Gemini 3.6 Flash
    description: Fast Gemini model balancing multimodal reasoning, tool use, and cost.
    owner:
        kind: provider
        name: google
    labels:
        featured: "true"
        family: gemini-3-6-flash
        source: models.dev
        source_version: "2026-07-24"
spec:
    family: gemini-3-6-flash
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2026-03"
    releaseDate: "2026-07-21"
    snapshots:
        - name: gemini-3-6-flash
          originalName: gemini-3.6-flash
          releasedAt: "2026-07-21"
    pointer: gemini-3-6-flash
    tags:
        - newest
        - multimodal
        - thinking
        - structured-outputs
        - agentic

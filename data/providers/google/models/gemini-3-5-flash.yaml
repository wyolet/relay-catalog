# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini-3-5-flash
    displayName: Gemini 3.5 Flash
    description: Google's most intelligent flash-tier model for sustained frontier performance on agentic and coding tasks.
    owner:
        kind: provider
        name: google
    labels:
        featured: "true"
        family: gemini-3-5-flash
        source: google-ai-studio
        source_version: "2026-05-21"
spec:
    family: gemini-3-5-flash
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        reasoning: true
        structuredOutputs: true
        promptCache: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - video
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    knowledgeCutoff: "2025-01-01"
    snapshots:
        - name: gemini-3-5-flash
          originalName: gemini-3.5-flash
    pointer: gemini-3-5-flash
    tags:
        - newest
        - multimodal
        - thinking
        - structured-outputs
        - agentic

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: together_ai/deepseek-ai/DeepSeek-V3
    owner:
        kind: provider
        name: together_ai
    labels:
        family: together_ai/deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: together_ai
          upstreamName: together_ai/deepseek-ai/DeepSeek-V3
          adapter: openai
    family: together_ai/deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 8192
    contextWindowTotal: 65536
    snapshots:
        - name: together_ai/deepseek-ai/DeepSeek-V3
          originalName: together_ai/deepseek-ai/DeepSeek-V3
    pointer: together_ai/deepseek-ai/DeepSeek-V3

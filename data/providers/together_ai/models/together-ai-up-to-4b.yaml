    owner:
        kind: provider
        name: together_ai
    labels:
        family: together
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: together_ai
          upstreamName: together-ai-up-to-4b
          adapter: openai
    family: together

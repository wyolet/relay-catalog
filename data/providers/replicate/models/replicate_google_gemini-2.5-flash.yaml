apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: replicate/google/gemini-2.5-flash
    owner:
        kind: provider
        name: replicate
    labels:
        family: replicate/google/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: replicate
          upstreamName: replicate/google/gemini-2.5-flash
          adapter: openai
    family: replicate/google/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    snapshots:
        - name: replicate/google/gemini-2.5-flash
          originalName: replicate/google/gemini-2.5-flash
    pointer: replicate/google/gemini-2.5-flash

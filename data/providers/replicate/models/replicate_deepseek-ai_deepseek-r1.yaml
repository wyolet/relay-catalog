apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: replicate/deepseek-ai/deepseek-r1
    owner:
        kind: provider
        name: replicate
    labels:
        family: replicate/deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: replicate
          upstreamName: replicate/deepseek-ai/deepseek-r1
          adapter: openai
    family: replicate/deepseek
    capabilities:
        chat: true
        streaming: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 8192
    contextWindowTotal: 65536
    snapshots:
        - name: replicate/deepseek-ai/deepseek-r1
          originalName: replicate/deepseek-ai/deepseek-r1
    pointer: replicate/deepseek-ai/deepseek-r1

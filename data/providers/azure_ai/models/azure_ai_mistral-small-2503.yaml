apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure_ai/mistral-small-2503
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure_ai/mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/mistral-small-2503
          adapter: openai
    family: azure_ai/mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    snapshots:
        - name: azure_ai/mistral-small-2503
          originalName: azure_ai/mistral-small-2503
    pointer: azure_ai/mistral-small-2503

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure_ai/mistral-large
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure_ai/mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/mistral-large
          adapter: openai
    family: azure_ai/mistral
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32000
    contextWindowOutput: 8191
    contextWindowTotal: 32000
    aliases:
        - azure_ai/mistral-large-latest
    snapshots:
        - name: azure_ai/mistral-large
          originalName: azure_ai/mistral-large
    pointer: azure_ai/mistral-large

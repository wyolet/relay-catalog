apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure_ai/jamba-instruct
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure_ai/jamba
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/jamba-instruct
          adapter: openai
    family: azure_ai/jamba
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 70000
    contextWindowOutput: 4096
    contextWindowTotal: 70000
    snapshots:
        - name: azure_ai/jamba-instruct
          originalName: azure_ai/jamba-instruct
    pointer: azure_ai/jamba-instruct

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: azure_ai/model_router
    owner:
        kind: provider
        name: azure_ai
    labels:
        family: azure_ai/model_router
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: azure_ai
          upstreamName: azure_ai/model_router
          adapter: openai
    family: azure_ai/model_router
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: azure_ai/model_router
          originalName: azure_ai/model_router
    pointer: azure_ai/model_router

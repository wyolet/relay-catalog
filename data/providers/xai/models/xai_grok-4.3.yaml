apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: xai/grok-4.3
    owner:
        kind: provider
        name: xai
    labels:
        family: xai/grok
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: xai
          upstreamName: xai/grok-4.3
          adapter: openai
    family: xai/grok
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        webSearch: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 1000000
    contextWindowTotal: 1000000
    aliases:
        - xai/grok-4.3-latest
    snapshots:
        - name: xai/grok-4.3
          originalName: xai/grok-4.3
    pointer: xai/grok-4.3

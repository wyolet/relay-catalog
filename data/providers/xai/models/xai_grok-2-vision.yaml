apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: xai/grok-2-vision
    owner:
        kind: provider
        name: xai
    labels:
        family: xai/grok
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: xai
          upstreamName: xai/grok-2-vision
          adapter: openai
    family: xai/grok
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        webSearch: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 32768
    contextWindowTotal: 32768
    aliases:
        - xai/grok-2-vision-latest
    snapshots:
        - name: xai/grok-2-vision
          originalName: xai/grok-2-vision
    pointer: xai/grok-2-vision

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: grok-4-6
    displayName: Grok 4.6
    description: xAI's frontier model for long-running agents, coding, knowledge work, and visual projects.
    owner:
        kind: provider
        name: xai
    labels:
        featured: "true"
        family: grok
        source: models.dev
        source_version: "2026-08-23"
spec:
    family: grok
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 500000
    contextWindowOutput: 500000
    contextWindowTotal: 500000
    maxOutputTokens: 500000
    knowledgeCutoff: "2026-02"
    releaseDate: "2026-08-12"
    snapshots:
        - name: grok-4-6
          releasedAt: "2026-08-12"
          originalName: grok-4.6
    pointer: grok-4-6

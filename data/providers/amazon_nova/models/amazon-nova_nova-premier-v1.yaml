apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: amazon-nova/nova-premier-v1
    owner:
        kind: provider
        name: amazon_nova
    labels:
        family: amazon
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: amazon_nova
          upstreamName: amazon-nova/nova-premier-v1
          adapter: openai
    family: amazon
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 10000
    contextWindowTotal: 1000000
    snapshots:
        - name: amazon-nova/nova-premier-v1
          originalName: amazon-nova/nova-premier-v1
    pointer: amazon-nova/nova-premier-v1

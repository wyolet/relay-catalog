apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock/us-east-2/moonshotai.kimi-k2-thinking
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock/us
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: bedrock/us-east-2/moonshotai.kimi-k2-thinking
          adapter: openai
    family: bedrock/us
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 262144
    contextWindowTotal: 262144
    snapshots:
        - name: bedrock/us-east-2/moonshotai.kimi-k2-thinking
          originalName: bedrock/us-east-2/moonshotai.kimi-k2-thinking
    pointer: bedrock/us-east-2/moonshotai.kimi-k2-thinking

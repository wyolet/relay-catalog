apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bedrock/eu-north-1/minimax.minimax-m2.5
    owner:
        kind: provider
        name: bedrock
    labels:
        family: bedrock/eu
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: bedrock/eu-north-1/minimax.minimax-m2.5
          adapter: openai
    family: bedrock/eu
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 8192
    contextWindowTotal: 1000000
    snapshots:
        - name: bedrock/eu-north-1/minimax.minimax-m2.5
          originalName: bedrock/eu-north-1/minimax.minimax-m2.5
    pointer: bedrock/eu-north-1/minimax.minimax-m2.5

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: anthropic.claude-mythos
    owner:
        kind: provider
        name: bedrock
    labels:
        family: anthropic.claude
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock
          upstreamName: anthropic.claude-mythos
          adapter: openai
    family: anthropic.claude
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    aliases:
        - anthropic.claude-mythos-preview
    snapshots:
        - name: anthropic.claude-mythos
          originalName: anthropic.claude-mythos
    pointer: anthropic.claude-mythos

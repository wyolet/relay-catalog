# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: starling-lm
    displayName: Starling LM
    owner:
        kind: provider
        name: starling
    labels:
        family: starling-lm
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: starling-lm
          adapter: openai
    family: starling-lm
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: starling-lm-latest
          originalName: starling-lm:latest
        - name: starling-lm-7b
          originalName: starling-lm:7b
    pointer: starling-lm-7b

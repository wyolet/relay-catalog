# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nous-hermes2-mixtral
    displayName: Nous Hermes 2 Mixtral
    owner:
        kind: provider
        name: nous
    labels:
        family: nous-hermes2-mixtral
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: nous-hermes2-mixtral
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nous-hermes2-mixtral-latest
          originalName: nous-hermes2-mixtral:latest
        - name: nous-hermes2-mixtral-8x7b
          originalName: nous-hermes2-mixtral:8x7b
    pointer: nous-hermes2-mixtral-8x7b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nous-hermes-7b
    displayName: Nous Hermes 7B
    owner:
        kind: provider
        name: nous
    labels:
        family: nous-hermes
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: nous-hermes
          adapter: openai
    family: nous-hermes
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nous-hermes-7b
          originalName: nous-hermes:7b
    pointer: nous-hermes-7b

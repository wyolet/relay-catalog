# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: athene-v2
    displayName: Athene V2
    owner:
        kind: provider
        name: nous
    labels:
        family: athene-v2
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: athene-v2
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: athene-v2-latest
          originalName: athene-v2:latest
        - name: athene-v2-72b
          originalName: athene-v2:72b
    pointer: athene-v2-72b

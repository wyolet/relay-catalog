    owner:
        kind: provider
        name: perplexity
    labels:
        family: perplexity/codellama
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: perplexity
          upstreamName: perplexity/codellama-70b-instruct
          adapter: openai
    family: perplexity/codellama
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 16384
    contextWindowOutput: 16384
    contextWindowTotal: 16384
    snapshots:
        - name: perplexity/codellama-70b-instruct
          originalName: perplexity/codellama-70b-instruct
    pointer: perplexity/codellama-70b-instruct

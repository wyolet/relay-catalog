apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: sonar
    displayName: Sonar
    owner:
        kind: provider
        name: perplexity
    labels:
        family: sonar
        source: models.dev
        source_version: "2026-06-09"
spec:
    family: sonar
    capabilities:
        chat: true
        streaming: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    maxOutputTokens: 4096
    knowledgeCutoff: "2025-09-01"
    releaseDate: "2024-01-01"
    enabled: true
    snapshots:
        - name: sonar
          releasedAt: "2024-01-01"
    pointer: sonar

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v3
    displayName: DeepSeek V3
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek-v3
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: deepseek-v3
          adapter: openai
    family: deepseek-v3
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: deepseek-v3-latest
          originalName: deepseek-v3:latest
        - name: deepseek-v3-671b
          originalName: deepseek-v3:671b
    pointer: deepseek-v3-671b
---

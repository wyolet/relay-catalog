# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepcoder-1-5b
    displayName: DeepCoder 1 5B
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepcoder
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: deepcoder
          adapter: openai
    family: deepcoder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: deepcoder-1-5b
          originalName: deepcoder:1.5b
    pointer: deepcoder-1-5b
---

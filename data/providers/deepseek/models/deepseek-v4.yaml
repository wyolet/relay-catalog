        family: deepseek-v4-pro
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: deepseek-v4-pro
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v4-flash
    displayName: DeepSeek V4 Flash
    owner:
        kind: provider
        name: deepseek
    labels:
        featured: "true"
        family: deepseek-v4-flash
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: deepseek-v4-flash
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: deepseek-v4-flash-cloud
          originalName: deepseek-v4-flash:cloud
        - name: deepseek-v4-flash-0731
          originalName: deepseek-v4-flash:0731
          releasedAt: "2026-07-31"
        - name: deepseek-v4-flash-free
          originalName: deepseek-v4-flash-free
        - name: deepseek-v4-flash
          originalName: deepseek-v4-flash
    pointer: deepseek-v4-flash-cloud
---
apiVersion: relay.wyolet.dev/v1alpha2

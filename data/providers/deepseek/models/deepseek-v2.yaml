# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v2-16b
    displayName: DeepSeek V2 16B
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek-v2
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: deepseek-v2
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: deepseek-v2-16b
          originalName: deepseek-v2:16b
    pointer: deepseek-v2-16b

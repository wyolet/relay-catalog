apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-coder-1-3b
    displayName: DeepSeek Coder 1 3B
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek-coder
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: deepseek-coder
          adapter: openai
    family: deepseek-coder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: deepseek-coder-1-3b
          originalName: deepseek-coder:1.3b
    pointer: deepseek-coder-1-3b

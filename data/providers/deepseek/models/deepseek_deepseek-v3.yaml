apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek/deepseek-v3
    owner:
        kind: provider
        name: deepseek
    labels:
        family: deepseek/deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: deepseek
          upstreamName: deepseek/deepseek-v3
          adapter: openai
    family: deepseek/deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        assistantPrefill: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 8192
    contextWindowTotal: 65536
    snapshots:
        - name: deepseek/deepseek-v3
          originalName: deepseek/deepseek-v3
    pointer: deepseek/deepseek-v3

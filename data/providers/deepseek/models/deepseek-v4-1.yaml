# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: deepseek-v4-1-flash
    displayName: DeepSeek V4.1 Flash
    description: DeepSeek V4.1 Flash model for reasoning and agentic coding.
    owner:
        kind: provider
        name: deepseek
    labels:
        featured: "true"
        family: deepseek-v4-1-flash
        source: models.dev
        source_version: "2026-09-21"
spec:
    family: deepseek-v4-1-flash
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    # Ollama Cloud reports 1048576; every other host serves 1000000, so the model carries the commonly-served value.
    contextWindowInput: 1000000
    contextWindowOutput: 384000
    contextWindowTotal: 1000000
    maxOutputTokens: 384000
    releaseDate: "2026-09-10"
    knowledgeCutoff: "2025-05"
    snapshots:
        - name: deepseek-v4-1-flash-cloud
          releasedAt: "2026-09-10"
          originalName: deepseek-v4.1-flash:cloud
        - name: deepseek-v4-1-flash
          releasedAt: "2026-09-10"
          originalName: deepseek-v4.1-flash
    pointer: deepseek-v4-1-flash-cloud

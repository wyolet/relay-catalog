apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: fireworks_ai/accounts/fireworks/models/firesearch-ocr-v6
    owner:
        kind: provider
        name: fireworks_ai
    labels:
        family: fireworks_ai/accounts/fireworks/models/firesearch
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: fireworks_ai
          upstreamName: fireworks_ai/accounts/fireworks/models/firesearch-ocr-v6
          adapter: openai
    family: fireworks_ai/accounts/fireworks/models/firesearch
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: fireworks_ai/accounts/fireworks/models/firesearch-ocr-v6
          originalName: fireworks_ai/accounts/fireworks/models/firesearch-ocr-v6
    pointer: fireworks_ai/accounts/fireworks/models/firesearch-ocr-v6

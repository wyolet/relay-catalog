apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: fireworks_ai/accounts/fireworks/models/rolm-ocr
    owner:
        kind: provider
        name: fireworks_ai
    labels:
        family: fireworks_ai/accounts/fireworks/models/rolm
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: fireworks_ai
          upstreamName: fireworks_ai/accounts/fireworks/models/rolm-ocr
          adapter: openai
    family: fireworks_ai/accounts/fireworks/models/rolm
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 128000
    contextWindowTotal: 128000
    snapshots:
        - name: fireworks_ai/accounts/fireworks/models/rolm-ocr
          originalName: fireworks_ai/accounts/fireworks/models/rolm-ocr
    pointer: fireworks_ai/accounts/fireworks/models/rolm-ocr

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gradient_ai/llama3-8b-instruct
    owner:
        kind: provider
        name: gradient_ai
    labels:
        family: gradient_ai/llama3
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gradient_ai
          upstreamName: gradient_ai/llama3-8b-instruct
          adapter: openai
    family: gradient_ai/llama3
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 512
    contextWindowTotal: 8192
    snapshots:
        - name: gradient_ai/llama3-8b-instruct
          originalName: gradient_ai/llama3-8b-instruct
    pointer: gradient_ai/llama3-8b-instruct

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: dbrx
    displayName: DBRX
    owner:
        kind: provider
        name: databricks
    labels:
        family: dbrx
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: dbrx
          adapter: openai
    family: dbrx
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: dbrx-latest
          originalName: dbrx:latest
        - name: dbrx-132b
          originalName: dbrx:132b
    pointer: dbrx-132b

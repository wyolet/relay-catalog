# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: claude-haiku-4-5
    displayName: Claude Haiku 4.5
    owner:
        kind: provider
        name: anthropic
    labels:
        source: litellm
        source_version: "2026-05-20"
spec:
    family: claude
    productLine: haiku
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        computerUse: true
        fileInput: true
        assistantPrefill: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 64000
    contextWindowTotal: 200000
    releaseDate: "2025-10-15"
    snapshots:
        - name: claude-haiku-4-5
        - name: claude-haiku-4-5-20251001
          releasedAt: "2025-10-01"
    pointer: claude-haiku-4-5

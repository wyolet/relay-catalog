# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: claude-3-7-sonnet
    displayName: Claude 3.7 Sonnet
    owner:
        kind: provider
        name: anthropic
    labels:
        family: claude
        source: litellm
        source_version: "2026-05-20"
spec:
    family: claude
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        computerUse: true
        webSearch: true
        fileInput: true
        assistantPrefill: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 64000
    contextWindowTotal: 200000
    deprecation:
        status: sunset
        sunsetDate: "2026-02-19"
    snapshots:
        - name: claude-3-7-sonnet-20250219
          releasedAt: "2025-02-19"
    pointer: claude-3-7-sonnet-20250219

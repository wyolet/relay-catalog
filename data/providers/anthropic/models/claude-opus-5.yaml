# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: claude-opus-5
    displayName: Claude Opus 5
    owner:
        kind: provider
        name: anthropic
    labels:
        featured: "true"
        family: claude
        source: models.dev
        source_version: "2026-07-24"
spec:
    family: claude
    capabilities:
        unsupportedParams:
            - temperature
            - top_p
            - top_k
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - pdf
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    maxOutputTokens: 128000
    knowledgeCutoff: "2026-05"
    releaseDate: "2026-07-24"
    snapshots:
        - name: claude-opus-5
          releasedAt: "2026-07-24"
    pointer: claude-opus-5
    # Claude Code's 1M-context addressing form. Resolution-only matcher:
    # routes to this model, "claude-opus-5[1m]" goes upstream verbatim.
    aliases:
        - claude-opus-5[1m]

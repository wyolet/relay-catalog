# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: claude-fable-5-1
    displayName: Claude Fable 5.1
    owner:
        kind: provider
        name: anthropic
    labels:
        featured: "true"
        family: claude
        source: anthropic-docs
        source_version: "2026-09-02"
spec:
    family: claude
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    maxOutputTokens: 128000
    knowledgeCutoff: "2026-06"
    releaseDate: "2026-09-01"
    snapshots:
        - name: claude-fable-5-1
          releasedAt: "2026-09-01"
    pointer: claude-fable-5-1
    # Claude Code's 1M-context addressing form. Resolution-only matcher:
    # routes to this model, "claude-fable-5-1[1m]" goes upstream verbatim.
    aliases:
        - claude-fable-5-1[1m]

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter/openai/gpt-5-chat
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter/openai/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/openai/gpt-5-chat
          adapter: openai
    family: openrouter/openai/gpt
    capabilities:
        chat: true
        streaming: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 16384
    contextWindowTotal: 128000
    snapshots:
        - name: openrouter/openai/gpt-5-chat
          originalName: openrouter/openai/gpt-5-chat
    pointer: openrouter/openai/gpt-5-chat

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter/google/gemini-3.1-pro
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter/google/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/google/gemini-3.1-pro
          adapter: openai
    family: openrouter/google/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - audio
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    aliases:
        - openrouter/google/gemini-3.1-pro-preview
    snapshots:
        - name: openrouter/google/gemini-3.1-pro
          originalName: openrouter/google/gemini-3.1-pro
    pointer: openrouter/google/gemini-3.1-pro

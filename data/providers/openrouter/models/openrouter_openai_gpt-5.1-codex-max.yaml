apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter/openai/gpt-5.1-codex-max
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter/openai/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/openai/gpt-5.1-codex-max
          adapter: openai
    family: openrouter/openai/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 400000
    contextWindowOutput: 128000
    contextWindowTotal: 400000
    snapshots:
        - name: openrouter/openai/gpt-5.1-codex-max
          originalName: openrouter/openai/gpt-5.1-codex-max
    pointer: openrouter/openai/gpt-5.1-codex-max

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter/z-ai/glm-4.7-flash
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter/z
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/z-ai/glm-4.7-flash
          adapter: openai
    family: openrouter/z
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        reasoning: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 32000
    contextWindowTotal: 200000
    snapshots:
        - name: openrouter/z-ai/glm-4.7-flash
          originalName: openrouter/z-ai/glm-4.7-flash
    pointer: openrouter/z-ai/glm-4.7-flash

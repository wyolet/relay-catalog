apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openrouter/qwen/qwen-vl-plus
    owner:
        kind: provider
        name: openrouter
    labels:
        family: openrouter/qwen/qwen
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: openrouter
          upstreamName: openrouter/qwen/qwen-vl-plus
          adapter: openai
    family: openrouter/qwen/qwen
    capabilities:
        chat: true
        streaming: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 2048
    contextWindowTotal: 8192
    snapshots:
        - name: openrouter/qwen/qwen-vl-plus
          originalName: openrouter/qwen/qwen-vl-plus
    pointer: openrouter/qwen/qwen-vl-plus

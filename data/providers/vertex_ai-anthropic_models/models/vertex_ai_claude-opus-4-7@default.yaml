apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vertex_ai/claude-opus-4-7@default
    owner:
        kind: provider
        name: vertex_ai-anthropic_models
    labels:
        family: vertex_ai/claude
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vertex_ai-anthropic_models
          upstreamName: vertex_ai/claude-opus-4-7@default
          adapter: openai
    family: vertex_ai/claude
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        computerUse: true
        fileInput: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 128000
    contextWindowTotal: 1000000
    snapshots:
        - name: vertex_ai/claude-opus-4-7@default
          originalName: vertex_ai/claude-opus-4-7@default
    pointer: vertex_ai/claude-opus-4-7@default

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/mistral/magistral-medium
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/mistral/magistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/mistral/magistral-medium
          adapter: openai
    family: vercel_ai_gateway/mistral/magistral
    capabilities:
        chat: true
        streaming: true
        tools: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 64000
    contextWindowTotal: 128000
    snapshots:
        - name: vercel_ai_gateway/mistral/magistral-medium
          originalName: vercel_ai_gateway/mistral/magistral-medium
    pointer: vercel_ai_gateway/mistral/magistral-medium

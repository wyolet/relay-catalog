apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/amazon/nova-pro
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/amazon/nova
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/amazon/nova-pro
          adapter: openai
    family: vercel_ai_gateway/amazon/nova
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 300000
    contextWindowOutput: 8192
    contextWindowTotal: 300000
    snapshots:
        - name: vercel_ai_gateway/amazon/nova-pro
          originalName: vercel_ai_gateway/amazon/nova-pro
    pointer: vercel_ai_gateway/amazon/nova-pro

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/perplexity/sonar-pro
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/perplexity/sonar
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/perplexity/sonar-pro
          adapter: openai
    family: vercel_ai_gateway/perplexity/sonar
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 8000
    contextWindowTotal: 200000
    snapshots:
        - name: vercel_ai_gateway/perplexity/sonar-pro
          originalName: vercel_ai_gateway/perplexity/sonar-pro
    pointer: vercel_ai_gateway/perplexity/sonar-pro

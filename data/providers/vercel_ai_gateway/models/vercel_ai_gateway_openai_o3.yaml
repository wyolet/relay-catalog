apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/openai/o3
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/openai/o3
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/openai/o3
          adapter: openai
    family: vercel_ai_gateway/openai/o3
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 200000
    contextWindowOutput: 100000
    contextWindowTotal: 200000
    snapshots:
        - name: vercel_ai_gateway/openai/o3
          originalName: vercel_ai_gateway/openai/o3
    pointer: vercel_ai_gateway/openai/o3

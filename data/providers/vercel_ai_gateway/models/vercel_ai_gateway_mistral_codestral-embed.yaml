apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/mistral/codestral-embed
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/mistral/codestral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/mistral/codestral-embed
          adapter: openai
    family: vercel_ai_gateway/mistral/codestral
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: vercel_ai_gateway/mistral/codestral-embed
          originalName: vercel_ai_gateway/mistral/codestral-embed
    pointer: vercel_ai_gateway/mistral/codestral-embed

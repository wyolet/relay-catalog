apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/cohere/command-r
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/cohere/command
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/cohere/command-r
          adapter: openai
    family: vercel_ai_gateway/cohere/command
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 4096
    contextWindowTotal: 128000
    snapshots:
        - name: vercel_ai_gateway/cohere/command-r
          originalName: vercel_ai_gateway/cohere/command-r
    pointer: vercel_ai_gateway/cohere/command-r

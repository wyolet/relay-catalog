apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: vercel_ai_gateway/google/gemini-2.5-pro
    owner:
        kind: provider
        name: vercel_ai_gateway
    labels:
        family: vercel_ai_gateway/google/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: vercel_ai_gateway
          upstreamName: vercel_ai_gateway/google/gemini-2.5-pro
          adapter: openai
    family: vercel_ai_gateway/google/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    snapshots:
        - name: vercel_ai_gateway/google/gemini-2.5-pro
          originalName: vercel_ai_gateway/google/gemini-2.5-pro
    pointer: vercel_ai_gateway/google/gemini-2.5-pro

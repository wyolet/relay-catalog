# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: cogito-3b
    displayName: Cogito 3B
    owner:
        kind: provider
        name: cogito
    labels:
        family: cogito
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: cogito
          adapter: openai
    family: cogito
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: cogito-3b
          originalName: cogito:3b
    pointer: cogito-3b
---

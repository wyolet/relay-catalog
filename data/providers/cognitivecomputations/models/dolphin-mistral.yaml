# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: dolphin-mistral
    displayName: Dolphin Mistral
    owner:
        kind: provider
        name: cognitivecomputations
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: mistral
    productLine: dolphin
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2023-10-02"
    snapshots:
        - name: dolphin-mistral-latest
          originalName: dolphin-mistral:latest
        - name: dolphin-mistral-7b
          originalName: dolphin-mistral:7b
    pointer: dolphin-mistral-7b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: dolphin-phi
    displayName: Dolphin Phi
    owner:
        kind: provider
        name: cognitivecomputations
    labels:
        family: dolphin-phi
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: dolphin-phi
          adapter: openai
    family: dolphin-phi
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: dolphin-phi-latest
          originalName: dolphin-phi:latest
        - name: dolphin-phi-2-7b
          originalName: dolphin-phi:2.7b
    pointer: dolphin-phi-2-7b

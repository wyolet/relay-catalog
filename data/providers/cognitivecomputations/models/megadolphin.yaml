# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: megadolphin
    displayName: MegaDolphin
    owner:
        kind: provider
        name: cognitivecomputations
    labels:
        family: megadolphin
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: megadolphin
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: megadolphin-latest
          originalName: megadolphin:latest
        - name: megadolphin-120b
          originalName: megadolphin:120b
    pointer: megadolphin-120b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: command-a
    displayName: Command A
    owner:
        kind: provider
        name: cohere
    labels:
        family: command-a
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: command-a
          adapter: openai
    family: command-a
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: command-a-latest
          originalName: command-a:latest
        - name: command-a-111b
          originalName: command-a:111b
    pointer: command-a-111b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: command-r
    displayName: Command R
    owner:
        kind: provider
        name: cohere
    labels:
        family: command-r
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: command-r
          adapter: openai
    family: command-r
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: command-r-latest
          originalName: command-r:latest
        - name: command-r-35b
          originalName: command-r:35b
    pointer: command-r-35b
---
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: command-r-plus
    displayName: Command R Plus
    owner:
        kind: provider
        name: cohere
    labels:
        family: command-r-plus
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: command-r-plus
          adapter: openai
    family: command-r-plus
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: command-r-plus-latest
          originalName: command-r-plus:latest
        - name: command-r-plus-104b
          originalName: command-r-plus:104b
    pointer: command-r-plus-104b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: zephyr
    displayName: Zephyr
    owner:
        kind: provider
        name: huggingface
    labels:
        family: zephyr
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: zephyr
          adapter: openai
    family: zephyr
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: zephyr-latest
          originalName: zephyr:latest
        - name: zephyr-7b
          originalName: zephyr:7b
    pointer: zephyr-7b

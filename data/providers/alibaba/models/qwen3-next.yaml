# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen3-next
    displayName: Qwen 3 Next
    owner:
        kind: provider
        name: alibaba
    labels:
        family: qwen3-next
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
          snapshots: [qwen3-next-latest, qwen3-next-80b]
        - host: ollama-cloud
          adapter: openai
          snapshots: [qwen3-next-80b-cloud]
    family: qwen3-next
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: qwen3-next-latest
          originalName: qwen3-next:latest
        - name: qwen3-next-80b
          originalName: qwen3-next:80b
        - name: qwen3-next-80b-cloud
          originalName: qwen3-next:80b-cloud
    pointer: qwen3-next-80b

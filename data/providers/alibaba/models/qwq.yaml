# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwq
    displayName: QwQ
    owner:
        kind: provider
        name: alibaba
    labels:
        family: qwq
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: qwq
          adapter: openai
    family: qwq
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: qwq-latest
          originalName: qwq:latest
        - name: qwq-32b
          originalName: qwq:32b
    pointer: qwq-32b

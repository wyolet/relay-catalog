# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen3-embedding-0-6b
    displayName: Qwen 3 Embedding 0 6B
    owner:
        kind: provider
        name: alibaba
    labels:
        family: qwen3-embedding
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: qwen3-embedding
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: qwen3-embedding-0-6b
          originalName: qwen3-embedding:0.6b
    pointer: qwen3-embedding-0-6b

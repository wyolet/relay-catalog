# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: codeqwen
    displayName: CodeQwen
    owner:
        kind: provider
        name: alibaba
    labels:
        family: codeqwen
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: codeqwen
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: codeqwen-latest
          originalName: codeqwen:latest
        - name: codeqwen-7b
          originalName: codeqwen:7b
    pointer: codeqwen-7b

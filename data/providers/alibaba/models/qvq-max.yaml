# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: qvq-max
  displayName: QVQ Max
  owner:
    kind: provider
    name: alibaba
  labels:
    family: qvq
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: qvq
  capabilities:
    chat: true
    streaming: true
    tools: true
    vision: true
    reasoning: true
    systemMessages: true
  modalities:
    input:
    - text
    - image
    output:
    - text
  contextWindowInput: 131072
  contextWindowOutput: 8192
  contextWindowTotal: 131072
  maxOutputTokens: 8192
  knowledgeCutoff: 2024-04
  releaseDate: '2025-03-25'
  enabled: true
  snapshots:
  - name: qvq-max
    releasedAt: '2025-08-28'
  pointer: qvq-max

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: qwen2-5vl-3b
    displayName: Qwen 2.5 VL 3B
    owner:
        kind: provider
        name: alibaba
    labels:
        family: qwen2.5vl
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: qwen2.5vl
          adapter: openai
    family: qwen2.5vl
    capabilities:
        chat: true
        tools: false
        vision: true
        reasoning: false
    modalities:
        input:
            - text
            - image
        output:
            - text
    snapshots:
        - name: qwen2-5vl-3b
          originalName: qwen2.5vl:3b
    pointer: qwen2-5vl-3b

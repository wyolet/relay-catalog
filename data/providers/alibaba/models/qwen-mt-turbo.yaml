# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: qwen-mt-turbo
  displayName: Qwen-MT Turbo
  owner:
    kind: provider
    name: alibaba
  labels:
    family: qwen
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: qwen
  capabilities:
    chat: true
    streaming: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 16384
  contextWindowOutput: 8192
  contextWindowTotal: 16384
  maxOutputTokens: 8192
  knowledgeCutoff: 2024-04
  releaseDate: 2025-01
  enabled: true
  snapshots:
  - name: qwen-mt-turbo
  pointer: qwen-mt-turbo

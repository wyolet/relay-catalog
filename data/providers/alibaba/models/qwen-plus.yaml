# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
  name: qwen-plus
  displayName: Qwen Plus
  owner:
    kind: provider
    name: alibaba
  labels:
    family: qwen
    source: models.dev
    source_version: '2026-06-09'
spec:
  family: qwen
  capabilities:
    chat: true
    streaming: true
    tools: true
    reasoning: true
    systemMessages: true
  modalities:
    input:
    - text
    output:
    - text
  contextWindowInput: 1000000
  contextWindowOutput: 32768
  contextWindowTotal: 1000000
  maxOutputTokens: 32768
  knowledgeCutoff: 2024-04
  releaseDate: '2024-01-25'
  enabled: true
  snapshots:
  - name: qwen-plus
    releasedAt: '2025-12-01'
  pointer: qwen-plus

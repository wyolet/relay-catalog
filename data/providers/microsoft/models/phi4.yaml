# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: phi4
    displayName: Phi 4
    owner:
        kind: provider
        name: microsoft
    labels:
        family: phi4
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: phi4
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: phi4-latest
          originalName: phi4:latest
        - name: phi4-14b
          originalName: phi4:14b
    pointer: phi4-14b
---

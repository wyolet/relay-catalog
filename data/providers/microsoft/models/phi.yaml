apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: phi
    displayName: Phi
    owner:
        kind: provider
        name: microsoft
    labels:
        family: phi
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: phi
          adapter: openai
    family: phi
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: phi-latest
          originalName: phi:latest
        - name: phi-2-7b
          originalName: phi:2.7b
    pointer: phi-2-7b

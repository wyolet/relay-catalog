# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: orca-mini-3b
    displayName: Orca Mini 3B
    owner:
        kind: provider
        name: microsoft
    labels:
        family: orca-mini
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: orca-mini
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: orca-mini-3b
          originalName: orca-mini:3b
    pointer: orca-mini-3b

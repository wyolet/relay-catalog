# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: all-minilm-22m
    displayName: All MiniLM 22M
    owner:
        kind: provider
        name: baai
    labels:
        family: all-minilm
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: all-minilm
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: all-minilm-22m
          originalName: all-minilm:22m
    pointer: all-minilm-22m

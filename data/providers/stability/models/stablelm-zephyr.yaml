# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: stablelm-zephyr
    displayName: StableLM Zephyr
    owner:
        kind: provider
        name: stability
    labels:
        family: stablelm-zephyr
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: stablelm-zephyr
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: stablelm-zephyr-latest
          originalName: stablelm-zephyr:latest
        - name: stablelm-zephyr-3b
          originalName: stablelm-zephyr:3b
    pointer: stablelm-zephyr-3b

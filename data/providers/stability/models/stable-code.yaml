apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: stable-code
    displayName: Stable Code
    owner:
        kind: provider
        name: stability
    labels:
        family: stable-code
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: stable-code
          adapter: openai
    family: stable-code
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: stable-code-latest
          originalName: stable-code:latest
        - name: stable-code-3b
          originalName: stable-code:3b
    pointer: stable-code-3b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: ollama-llama3
    owner:
        kind: provider
        name: ollama
    labels:
        family: ollama
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama
          upstreamName: ollama/llama3
          adapter: openai
    family: ollama
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: ollama-llama3
          originalName: ollama/llama3
    pointer: ollama-llama3

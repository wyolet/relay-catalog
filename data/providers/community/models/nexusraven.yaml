apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nexusraven
    displayName: NexusRaven
    owner:
        kind: provider
        name: community
    labels:
        family: nexusraven
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nexusraven
          adapter: openai
    family: nexusraven
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nexusraven-latest
          originalName: nexusraven:latest
        - name: nexusraven-13b
          originalName: nexusraven:13b
    pointer: nexusraven-13b

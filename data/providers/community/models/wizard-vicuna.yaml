apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: wizard-vicuna
    displayName: Wizard Vicuna
    owner:
        kind: provider
        name: community
    labels:
        family: wizard-vicuna
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: wizard-vicuna
          adapter: openai
    family: wizard-vicuna
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: wizard-vicuna-latest
          originalName: wizard-vicuna:latest
        - name: wizard-vicuna-13b
          originalName: wizard-vicuna:13b
    pointer: wizard-vicuna-13b

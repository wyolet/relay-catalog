apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: wizardlm
    displayName: WizardLM
    owner:
        kind: provider
        name: community
    labels:
        family: wizardlm
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: wizardlm
          adapter: openai
    family: wizardlm
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: wizardlm-latest
          originalName: wizardlm:latest
        - name: wizardlm-7b
          originalName: wizardlm:7b
    pointer: wizardlm-7b

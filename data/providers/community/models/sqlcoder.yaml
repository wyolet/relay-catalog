apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: sqlcoder-7b
    displayName: SQLCoder 7B
    owner:
        kind: provider
        name: community
    labels:
        family: sqlcoder
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: sqlcoder
          adapter: openai
    family: sqlcoder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: sqlcoder-7b
          originalName: sqlcoder:7b
    pointer: sqlcoder-7b

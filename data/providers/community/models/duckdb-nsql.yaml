apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: duckdb-nsql
    displayName: DuckDB NSQL
    owner:
        kind: provider
        name: community
    labels:
        family: duckdb-nsql
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: duckdb-nsql
          adapter: openai
    family: duckdb-nsql
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: duckdb-nsql-latest
          originalName: duckdb-nsql:latest
        - name: duckdb-nsql-7b
          originalName: duckdb-nsql:7b
    pointer: duckdb-nsql-7b

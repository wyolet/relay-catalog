apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: codebooga
    displayName: CodeBooga
    owner:
        kind: provider
        name: community
    labels:
        family: codebooga
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: codebooga
          adapter: openai
    family: codebooga
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: codebooga-latest
          originalName: codebooga:latest
        - name: codebooga-34b
          originalName: codebooga:34b
    pointer: codebooga-34b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: firefunction-v2
    displayName: FireFunction V2
    owner:
        kind: provider
        name: community
    labels:
        family: firefunction-v2
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: firefunction-v2
          adapter: openai
    family: firefunction-v2
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: firefunction-v2-latest
          originalName: firefunction-v2:latest
        - name: firefunction-v2-70b
          originalName: firefunction-v2:70b
    pointer: firefunction-v2-70b

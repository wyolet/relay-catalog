apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: alfred
    displayName: Alfred
    owner:
        kind: provider
        name: community
    labels:
        family: alfred
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: alfred
          adapter: openai
    family: alfred
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: alfred-latest
          originalName: alfred:latest
        - name: alfred-40b
          originalName: alfred:40b
    pointer: alfred-40b

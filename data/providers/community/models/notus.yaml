apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: notus
    displayName: Notus
    owner:
        kind: provider
        name: community
    labels:
        family: notus
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: notus
          adapter: openai
    family: notus
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: notus-latest
          originalName: notus:latest
        - name: notus-7b
          originalName: notus:7b
    pointer: notus-7b

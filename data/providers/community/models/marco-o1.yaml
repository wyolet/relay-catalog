apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: marco-o1
    displayName: Marco O1
    owner:
        kind: provider
        name: community
    labels:
        family: marco-o1
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: marco-o1
          adapter: openai
    family: marco-o1
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: marco-o1-latest
          originalName: marco-o1:latest
        - name: marco-o1-7b
          originalName: marco-o1:7b
    pointer: marco-o1-7b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: goliath
    displayName: Goliath
    owner:
        kind: provider
        name: community
    labels:
        family: goliath
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: goliath
          adapter: openai
    family: goliath
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: goliath-latest
          originalName: goliath:latest
        - name: goliath-120b
          originalName: goliath:120b
    pointer: goliath-120b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: smallthinker
    displayName: SmallThinker
    owner:
        kind: provider
        name: community
    labels:
        family: smallthinker
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: smallthinker
          adapter: openai
    family: smallthinker
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: smallthinker-latest
          originalName: smallthinker:latest
        - name: smallthinker-3b
          originalName: smallthinker:3b
    pointer: smallthinker-3b

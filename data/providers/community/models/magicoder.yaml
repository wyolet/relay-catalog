apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: magicoder
    displayName: Magicoder
    owner:
        kind: provider
        name: community
    labels:
        family: magicoder
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: magicoder
          adapter: openai
    family: magicoder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: magicoder-latest
          originalName: magicoder:latest
        - name: magicoder-7b
          originalName: magicoder:7b
    pointer: magicoder-7b

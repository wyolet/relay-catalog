apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: rnj-1
    displayName: RNJ 1
    owner:
        kind: provider
        name: community
    labels:
        family: rnj-1
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: rnj-1
          adapter: openai
    family: rnj-1
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: rnj-1-latest
          originalName: rnj-1:latest
    pointer: rnj-1-latest

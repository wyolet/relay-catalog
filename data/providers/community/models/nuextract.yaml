apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nuextract
    displayName: NuExtract
    owner:
        kind: provider
        name: community
    labels:
        family: nuextract
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nuextract
          adapter: openai
    family: nuextract
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nuextract-latest
          originalName: nuextract:latest
        - name: nuextract-3-8b
          originalName: nuextract:3.8b
    pointer: nuextract-3-8b

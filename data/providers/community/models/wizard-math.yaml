apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: wizard-math-7b
    displayName: Wizard Math 7B
    owner:
        kind: provider
        name: community
    labels:
        family: wizard-math
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: wizard-math
          adapter: openai
    family: wizard-math
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: wizard-math-7b
          originalName: wizard-math:7b
    pointer: wizard-math-7b
---

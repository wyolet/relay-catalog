apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: bespoke-minicheck
    displayName: Bespoke MiniCheck
    owner:
        kind: provider
        name: community
    labels:
        family: bespoke-minicheck
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: bespoke-minicheck
          adapter: openai
    family: bespoke-minicheck
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: bespoke-minicheck-latest
          originalName: bespoke-minicheck:latest
        - name: bespoke-minicheck-7b
          originalName: bespoke-minicheck:7b
    pointer: bespoke-minicheck-7b

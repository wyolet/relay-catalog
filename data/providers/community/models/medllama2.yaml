apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: medllama2
    displayName: MedLlama 2
    owner:
        kind: provider
        name: community
    labels:
        family: medllama2
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: medllama2
          adapter: openai
    family: medllama2
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: medllama2-latest
          originalName: medllama2:latest
        - name: medllama2-7b
          originalName: medllama2:7b
    pointer: medllama2-7b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: everythinglm
    displayName: EverythingLM
    owner:
        kind: provider
        name: community
    labels:
        family: everythinglm
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: everythinglm
          adapter: openai
    family: everythinglm
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: everythinglm-latest
          originalName: everythinglm:latest
        - name: everythinglm-13b
          originalName: everythinglm:13b
    pointer: everythinglm-13b

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: opencoder-1-5b
    displayName: OpenCoder 1 5B
    owner:
        kind: provider
        name: community
    labels:
        family: opencoder
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: opencoder
          adapter: openai
    family: opencoder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: opencoder-1-5b
          originalName: opencoder:1.5b
    pointer: opencoder-1-5b

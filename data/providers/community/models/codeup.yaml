apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: codeup
    displayName: CodeUp
    owner:
        kind: provider
        name: community
    labels:
        family: codeup
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: codeup
          adapter: openai
    family: codeup
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: codeup-latest
          originalName: codeup:latest
        - name: codeup-13b
          originalName: codeup:13b
    pointer: codeup-13b

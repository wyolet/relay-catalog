# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: olmo-3-1
    displayName: OLMo 3.1
    owner:
        kind: provider
        name: allenai
    labels:
        family: olmo-3.1
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: olmo-3.1
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: olmo-3-1-latest
          originalName: olmo-3.1:latest
        - name: olmo-3-1-32b
          originalName: olmo-3.1:32b
    pointer: olmo-3-1-32b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: starcoder
    displayName: StarCoder
    owner:
        kind: provider
        name: bigcode
    labels:
        family: starcoder
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: starcoder
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: starcoder-latest
          originalName: starcoder:latest
        - name: starcoder-7b
          originalName: starcoder:7b
    pointer: starcoder-7b

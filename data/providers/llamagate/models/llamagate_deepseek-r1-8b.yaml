apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llamagate/deepseek-r1-8b
    owner:
        kind: provider
        name: llamagate
    labels:
        family: llamagate/deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: llamagate
          upstreamName: llamagate/deepseek-r1-8b
          adapter: openai
    family: llamagate/deepseek
    capabilities:
        chat: true
        streaming: true
        tools: true
        reasoning: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 65536
    contextWindowOutput: 16384
    contextWindowTotal: 65536
    snapshots:
        - name: llamagate/deepseek-r1-8b
          originalName: llamagate/deepseek-r1-8b
    pointer: llamagate/deepseek-r1-8b

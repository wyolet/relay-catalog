# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: openchat
    displayName: OpenChat
    owner:
        kind: provider
        name: openchat
    labels:
        family: openchat
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: openchat
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: openchat-latest
          originalName: openchat:latest
        - name: openchat-7b
          originalName: openchat:7b
    pointer: openchat-7b

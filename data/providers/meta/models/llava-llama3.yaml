# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llava-llama3
    displayName: LLaVA Llama 3
    owner:
        kind: provider
        name: meta
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: llama
    capabilities:
        chat: true
        tools: false
        vision: true
        reasoning: false
    modalities:
        input:
            - text
            - image
        output:
            - text
    releaseDate: "2024-04-26"
    snapshots:
        - name: llava-llama3-latest
          originalName: llava-llama3:latest
        - name: llava-llama3-8b
          originalName: llava-llama3:8b
    pointer: llava-llama3-8b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama-pro
    displayName: Llama Pro
    owner:
        kind: provider
        name: meta
    labels:
        family: llama-pro
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: llama-pro
          adapter: openai
    family: llama-pro
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: llama-pro-latest
          originalName: llama-pro:latest
        - name: llama-pro-8b
          originalName: llama-pro:8b
    pointer: llama-pro-8b

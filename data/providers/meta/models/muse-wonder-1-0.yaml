            - text
            - image
            - video
            - pdf
            - audio
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 131072
    contextWindowTotal: 1048576
    maxOutputTokens: 131072
    releaseDate: "2026-10-12"
    snapshots:
        - name: muse-wonder-1-0
          releasedAt: "2026-10-12"
          originalName: muse-wonder-1.0
    pointer: muse-wonder-1-0
    tags:
        - preview

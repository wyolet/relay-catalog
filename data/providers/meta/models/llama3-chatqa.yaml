# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama3-chatqa-8b
    displayName: Llama 3 ChatQA 8B
    owner:
        kind: provider
        name: meta
    labels:
        family: llama3-chatqa
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: llama3-chatqa
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: llama3-chatqa-8b
          originalName: llama3-chatqa:8b
    pointer: llama3-chatqa-8b

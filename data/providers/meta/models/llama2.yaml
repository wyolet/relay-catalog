# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama2
    displayName: Llama 2
    owner:
        kind: provider
        name: meta
    labels:
        family: meta
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: meta
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 4096
    contextWindowTotal: 4096
    snapshots:
        - name: llama2
          originalName: llama2
    pointer: llama2

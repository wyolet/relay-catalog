# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: muse-spark-1-2
    displayName: Muse Spark 1.2
    description: Coding-focused update to Muse Spark 1.1, with improvements in code generation, complex debugging, codebase understanding, and end-to-end developer workflows.
    owner:
        kind: provider
        name: meta
    labels:
        family: muse
        source: models.dev
        source_version: "2026-09-21"
spec:
    family: muse
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        fileInput: true
        audioInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - video
            - pdf
            - audio
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 131072
    contextWindowTotal: 1048576
    maxOutputTokens: 131072
    releaseDate: "2026-08-05"
    snapshots:
        - name: muse-spark-1-2
          releasedAt: "2026-08-05"
          originalName: muse-spark-1.2
    pointer: muse-spark-1-2

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama3-1
    displayName: Llama 3.1
    owner:
        kind: provider
        name: meta
    labels:
        family: meta
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: llama3.1
          adapter: openai
    family: meta
    capabilities:
        chat: true
        streaming: true
        tools: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 8192
    contextWindowTotal: 8192
    snapshots:
        - name: llama3-1
          originalName: llama3.1
    pointer: llama3-1

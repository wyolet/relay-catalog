apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama3-gradient
    displayName: Llama 3 Gradient
    owner:
        kind: provider
        name: meta
    labels:
        family: llama3-gradient
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: llama3-gradient
          adapter: openai
    family: llama3-gradient
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: llama3-gradient-latest
          originalName: llama3-gradient:latest
        - name: llama3-gradient-8b
          originalName: llama3-gradient:8b
    pointer: llama3-gradient-8b

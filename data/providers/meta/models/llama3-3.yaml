# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama3-3
    displayName: Llama 3.3
    owner:
        kind: provider
        name: meta
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: llama
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2024-12-06"
    snapshots:
        - name: llama3-3-latest
          originalName: llama3.3:latest
        - name: llama3-3-70b
          originalName: llama3.3:70b
    pointer: llama3-3-70b

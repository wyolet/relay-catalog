# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: llama3-2-1b
    displayName: Llama 3.2 1B
    owner:
        kind: provider
        name: meta
    labels:
        family: llama3.2
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: llama3.2
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: llama3-2-1b
          originalName: llama3.2:1b
    pointer: llama3-2-1b
---

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nomic-embed-text
    displayName: Nomic Embed Text
    owner:
        kind: provider
        name: nomic
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: nomic-embed
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2024-02-10"
    snapshots:
        - name: nomic-embed-text-latest
          originalName: nomic-embed-text:latest
    pointer: nomic-embed-text-latest

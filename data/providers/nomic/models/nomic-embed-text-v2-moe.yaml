# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nomic-embed-text-v2-moe
    displayName: Nomic Embed Text V2 MOE
    owner:
        kind: provider
        name: nomic
    labels:
        source: ollama-library
        source_version: "2026-05-20"
spec:
    family: nomic-embed
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    releaseDate: "2025-02-07"
    snapshots:
        - name: nomic-embed-text-v2-moe-latest
          originalName: nomic-embed-text-v2-moe:latest
        - name: nomic-embed-text-v2-moe-475m
          originalName: nomic-embed-text-v2-moe:475m
    pointer: nomic-embed-text-v2-moe-475m

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: exaone-deep-2-4b
    displayName: EXAONE Deep 2 4B
    owner:
        kind: provider
        name: lgai
    labels:
        family: exaone-deep
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          upstreamName: exaone-deep
          adapter: openai
    family: exaone-deep
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: exaone-deep-2-4b
          originalName: exaone-deep:2.4b
    pointer: exaone-deep-2-4b

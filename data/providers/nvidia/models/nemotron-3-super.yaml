# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron-3-super
    displayName: Nemotron 3 Super
    owner:
        kind: provider
        name: nvidia
    labels:
        family: nemotron-3-super
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nemotron-3-super
          adapter: openai
          snapshots: [nemotron-3-super-latest, nemotron-3-super-120b]
        - host: ollama-cloud
          upstreamName: nemotron-3-super
          adapter: openai
          snapshots: [nemotron-3-super-cloud]
    family: nemotron-3-super
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nemotron-3-super-latest
          originalName: nemotron-3-super:latest
        - name: nemotron-3-super-120b
          originalName: nemotron-3-super:120b
        - name: nemotron-3-super-cloud
          originalName: nemotron-3-super:cloud
    pointer: nemotron-3-super-120b

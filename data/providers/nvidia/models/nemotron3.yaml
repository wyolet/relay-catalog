apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron3
    displayName: Nemotron 3
    owner:
        kind: provider
        name: nvidia
    labels:
        family: nemotron3
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nemotron3
          adapter: openai
    family: nemotron3
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nemotron3-latest
          originalName: nemotron3:latest
        - name: nemotron3-8b
          originalName: nemotron3:8b
    pointer: nemotron3-8b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron
    displayName: Nemotron
    owner:
        kind: provider
        name: nvidia
    labels:
        family: nemotron
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nemotron
          adapter: openai
    family: nemotron
    capabilities:
        chat: true
        tools: false
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nemotron-latest
          originalName: nemotron:latest
        - name: nemotron-70b
          originalName: nemotron:70b
    pointer: nemotron-70b

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nemotron-mini
    displayName: Nemotron Mini
    owner:
        kind: provider
        name: nvidia
    labels:
        family: nemotron-mini
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-self
          upstreamName: nemotron-mini
          adapter: openai
    family: nemotron-mini
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: false
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: nemotron-mini-latest
          originalName: nemotron-mini:latest
        - name: nemotron-mini-4b
          originalName: nemotron-mini:4b
    pointer: nemotron-mini-4b

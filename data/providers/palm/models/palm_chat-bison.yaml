apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: palm/chat-bison
    owner:
        kind: provider
        name: palm
    labels:
        family: palm/chat
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: palm
          upstreamName: palm/chat-bison
          adapter: openai
    family: palm/chat
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 8192
    contextWindowOutput: 4096
    contextWindowTotal: 8192
    snapshots:
        - name: palm/chat-bison
          originalName: palm/chat-bison
    pointer: palm/chat-bison

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gmi/moonshotai/Kimi-K2-Thinking
    owner:
        kind: provider
        name: gmi
    labels:
        family: gmi/moonshotai/Kimi
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gmi
          upstreamName: gmi/moonshotai/Kimi-K2-Thinking
          adapter: openai
    family: gmi/moonshotai/Kimi
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 262144
    contextWindowOutput: 16384
    contextWindowTotal: 262144
    snapshots:
        - name: gmi/moonshotai/Kimi-K2-Thinking
          originalName: gmi/moonshotai/Kimi-K2-Thinking
    pointer: gmi/moonshotai/Kimi-K2-Thinking

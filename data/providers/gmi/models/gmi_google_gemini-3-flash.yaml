apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gmi/google/gemini-3-flash
    owner:
        kind: provider
        name: gmi
    labels:
        family: gmi/google/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gmi
          upstreamName: gmi/google/gemini-3-flash
          adapter: openai
    family: gmi/google/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65536
    contextWindowTotal: 1048576
    aliases:
        - gmi/google/gemini-3-flash-preview
    snapshots:
        - name: gmi/google/gemini-3-flash
          originalName: gmi/google/gemini-3-flash
    pointer: gmi/google/gemini-3-flash

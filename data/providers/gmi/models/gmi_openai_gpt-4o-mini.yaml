apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gmi/openai/gpt-4o-mini
    owner:
        kind: provider
        name: gmi
    labels:
        family: gmi/openai/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gmi
          upstreamName: gmi/openai/gpt-4o-mini
          adapter: openai
    family: gmi/openai/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 131072
    contextWindowOutput: 16384
    contextWindowTotal: 131072
    snapshots:
        - name: gmi/openai/gpt-4o-mini
          originalName: gmi/openai/gpt-4o-mini
    pointer: gmi/openai/gpt-4o-mini

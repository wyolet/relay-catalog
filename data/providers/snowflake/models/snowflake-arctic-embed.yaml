# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake-arctic-embed-22m
    displayName: Snowflake Arctic Embed 22M
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake-arctic-embed
        source: ollama-library
        source_version: '2026-05-20'
spec:
    hosts:
        - host: ollama-self
          adapter: openai
    family: snowflake-arctic-embed
    capabilities:
        chat: false
        embeddings: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: snowflake-arctic-embed-22m
          originalName: snowflake-arctic-embed:22m
    pointer: snowflake-arctic-embed-22m
---

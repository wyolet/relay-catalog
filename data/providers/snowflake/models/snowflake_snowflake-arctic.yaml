apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake/snowflake-arctic
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake/snowflake
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/snowflake-arctic
          adapter: openai
    family: snowflake/snowflake
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 4096
    contextWindowOutput: 8192
    contextWindowTotal: 4096
    snapshots:
        - name: snowflake/snowflake-arctic
          originalName: snowflake/snowflake-arctic
    pointer: snowflake/snowflake-arctic

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake/deepseek-r1
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake/deepseek
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/deepseek-r1
          adapter: openai
    family: snowflake/deepseek
    capabilities:
        chat: true
        streaming: true
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 32768
    contextWindowOutput: 8192
    contextWindowTotal: 32768
    snapshots:
        - name: snowflake/deepseek-r1
          originalName: snowflake/deepseek-r1
    pointer: snowflake/deepseek-r1

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake/jamba-1.5-mini
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake/jamba
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/jamba-1.5-mini
          adapter: openai
    family: snowflake/jamba
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 256000
    contextWindowOutput: 8192
    contextWindowTotal: 256000
    snapshots:
        - name: snowflake/jamba-1.5-mini
          originalName: snowflake/jamba-1.5-mini
    pointer: snowflake/jamba-1.5-mini

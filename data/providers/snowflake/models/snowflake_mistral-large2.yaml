apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: snowflake/mistral-large2
    owner:
        kind: provider
        name: snowflake
    labels:
        family: snowflake/mistral
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: snowflake
          upstreamName: snowflake/mistral-large2
          adapter: openai
    family: snowflake/mistral
    capabilities:
        chat: true
        streaming: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: snowflake/mistral-large2
          originalName: snowflake/mistral-large2
    pointer: snowflake/mistral-large2

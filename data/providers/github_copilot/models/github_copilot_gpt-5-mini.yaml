apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: github_copilot/gpt-5-mini
    owner:
        kind: provider
        name: github_copilot
    labels:
        family: github_copilot/gpt
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: github_copilot
          upstreamName: github_copilot/gpt-5-mini
          adapter: openai
    family: github_copilot/gpt
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        structuredOutputs: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 64000
    contextWindowTotal: 128000
    snapshots:
        - name: github_copilot/gpt-5-mini
          originalName: github_copilot/gpt-5-mini
    pointer: github_copilot/gpt-5-mini

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: nvidia.nemotron-nano-12b-v2
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: nvidia.nemotron
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: nvidia.nemotron-nano-12b-v2
          adapter: openai
    family: nvidia.nemotron
    capabilities:
        chat: true
        streaming: true
        vision: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 8192
    contextWindowTotal: 128000
    snapshots:
        - name: nvidia.nemotron-nano-12b-v2
          originalName: nvidia.nemotron-nano-12b-v2
    pointer: nvidia.nemotron-nano-12b-v2

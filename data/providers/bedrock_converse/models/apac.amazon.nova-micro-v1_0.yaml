apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: apac.amazon.nova-micro-v1:0
    owner:
        kind: provider
        name: bedrock_converse
    labels:
        family: apac.amazon.nova
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: bedrock_converse
          upstreamName: apac.amazon.nova-micro-v1:0
          adapter: openai
    family: apac.amazon.nova
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        structuredOutputs: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 128000
    contextWindowOutput: 10000
    contextWindowTotal: 128000
    snapshots:
        - name: apac.amazon.nova-micro-v1:0
          originalName: apac.amazon.nova-micro-v1:0
    pointer: apac.amazon.nova-micro-v1:0

# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha3/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha3
kind: Model
metadata:
    name: minimax-m3-1-flash
    displayName: MiniMax-M3.1-Flash
    description: Multimodal coding model with 1M context window and tunable thinking depth.
    owner:
        kind: provider
        name: minimax
    labels:
        featured: "true"
        source: models.dev
        source_version: "2026-11-07"
spec:
    family: minimax
    capabilities:
        chat: true
        streaming: true
        tools: true
        vision: true
        promptCache: true
        reasoning: true
        systemMessages: true
        reasoningEfforts:
            - low
            - medium
            - high
            - xhigh
            - max
    modalities:
        input:
            - text
            - image
            - video
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 524288
    contextWindowTotal: 1000000
    maxOutputTokens: 524288
    releaseDate: "2026-10-19"
    tags:
        - open-weights
    enabled: true
    snapshots:
        - name: minimax-m3-1-flash
          releasedAt: "2026-10-19"
          originalName: MiniMax-M3.1-Flash
        - name: minimax-m3-1-flash-cloud
          originalName: minimax-m3.1-flash:cloud
    pointer: minimax-m3-1-flash

apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: minimax/MiniMax-M2.1-lightning
    owner:
        kind: provider
        name: minimax
    labels:
        family: minimax/MiniMax
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: minimax
          upstreamName: minimax/MiniMax-M2.1-lightning
          adapter: openai
    family: minimax/MiniMax
    capabilities:
        chat: true
        streaming: true
        tools: true
        promptCache: true
        reasoning: true
        systemMessages: true
    modalities:
        input:
            - text
        output:
            - text
    contextWindowInput: 1000000
    contextWindowOutput: 8192
    contextWindowTotal: 1000000
    snapshots:
        - name: minimax/MiniMax-M2.1-lightning
          originalName: minimax/MiniMax-M2.1-lightning
    pointer: minimax/MiniMax-M2.1-lightning

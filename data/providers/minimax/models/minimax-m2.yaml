# yaml-language-server: $schema=https://relay-api.wyolet.dev/schemas/v1alpha2/Model.schema.json
apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: minimax-m2
    displayName: MiniMax M2
    owner:
        kind: provider
        name: minimax
    labels:
        family: minimax-m2
        source: ollama-library
        source_version: "2026-05-20"
spec:
    hosts:
        - host: ollama-cloud
          adapter: openai
    family: minimax-m2
    capabilities:
        chat: true
        tools: true
        vision: false
        reasoning: true
    modalities:
        input:
            - text
        output:
            - text
    snapshots:
        - name: minimax-m2-cloud
          originalName: minimax-m2:cloud
    pointer: minimax-m2-cloud
---

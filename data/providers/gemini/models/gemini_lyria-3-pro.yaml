apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini/lyria-3-pro
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini/lyria
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/lyria-3-pro
          adapter: openai
    family: gemini/lyria
    capabilities:
        chat: true
        streaming: true
        audioOutput: true
    modalities:
        input:
            - text
        output:
            - text
            - audio
    contextWindowInput: 131072
    contextWindowOutput: 8192
    contextWindowTotal: 131072
    aliases:
        - gemini/lyria-3-pro-preview
    snapshots:
        - name: gemini/lyria-3-pro
          originalName: gemini/lyria-3-pro
    pointer: gemini/lyria-3-pro

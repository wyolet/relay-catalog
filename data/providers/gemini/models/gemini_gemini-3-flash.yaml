apiVersion: relay.wyolet.dev/v1alpha2
kind: Model
metadata:
    name: gemini/gemini-3-flash
    owner:
        kind: provider
        name: gemini
    labels:
        family: gemini/gemini
        source: litellm
        source_version: "2026-05-20"
spec:
    hosts:
        - host: gemini
          upstreamName: gemini/gemini-3-flash
          adapter: openai
    family: gemini/gemini
    capabilities:
        chat: true
        streaming: true
        tools: true
        parallelTools: true
        vision: true
        promptCache: true
        reasoning: true
        structuredOutputs: true
        batch: true
        webSearch: true
        fileInput: true
        systemMessages: true
    modalities:
        input:
            - text
            - image
            - file
        output:
            - text
    contextWindowInput: 1048576
    contextWindowOutput: 65535
    contextWindowTotal: 1048576
    aliases:
        - gemini/gemini-3-flash-preview
    snapshots:
        - name: gemini/gemini-3-flash
          originalName: gemini/gemini-3-flash
    pointer: gemini/gemini-3-flash
